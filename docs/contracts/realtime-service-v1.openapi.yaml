openapi: 3.0.3
info: {title: Runtime realtime service contract, version: 1.0.0}
paths: {}
components:
  schemas:
    RealtimeOperation:
      type: object
      additionalProperties: false
      required: [contract_version, tenant_key, namespace, operation]
      properties:
        contract_version: {type: string, enum: [realtime.service.v1]}
        tenant_key: {type: string, format: uuid}
        namespace: {type: string, minLength: 1, maxLength: 128}
        operation: {type: string, enum: [publish, cursor, subscribe]}
        cursor: {type: string, pattern: '^(0|[1-9][0-9]{0,19})-(0|[1-9][0-9]{0,19})$'}
        event: {$ref: '#/components/schemas/RealtimeEvent'}
      oneOf:
        - properties: {operation: {enum: [publish]}}
          required: [event]
          not: {required: [cursor]}
        - properties: {operation: {enum: [cursor]}}
          not:
            anyOf: [{required: [event]}, {required: [cursor]}]
        - properties: {operation: {enum: [subscribe]}}
          required: [cursor]
          not: {required: [event]}
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event_id, tenant_uuid, topic, trace_id, payload_base64]
      properties:
        event_id: {type: string, format: uuid}
        tenant_uuid: {type: string, format: uuid}
        topic: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,512}$'}
        member_uuid: {type: string, format: uuid}
        trace_id: {type: string, maxLength: 128}
        payload_base64: {type: string, format: byte, maxLength: 87384}
