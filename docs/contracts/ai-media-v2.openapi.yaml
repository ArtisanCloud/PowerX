  /ai/media/tasks/{task_uuid}/events:
    get:
      operationId: mediaTaskEvents
      parameters:
      - name: task_uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Last-Event-ID
        in: header
        schema: &id001
          type: string
        description: task_uuid:revision; reconnect returns current snapshot instead
          of replaying intermediate states.
      responses:
        '400':
          description: Invalid typed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
