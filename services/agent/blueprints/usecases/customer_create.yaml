flow_id: "customer_create"
name: "新增客户记录"
base_flow: "base_flow"
steps:
  - use: "validate.schema"
    params:
      schema:
        type: "object"
        required: ["name", "email"]
        properties:
          name:  { type: "string", minLength: 2, maxLength: 100 }
          email: { type: "string", format: "email" }
          phone: { type: "string", pattern: "^1[3-9]\\d{9}$" }
          owner_id: { type: "string" }
          tags: { type: "array", items: { type: "string" }, maxItems: 20 }

  - use: "customer.check_uniqueness"
    params:
      unique_fields: ["email", "phone"]
      table: "customers"
      conflict_message: "客户已存在"

  - use: "customer.create"
    params:
      # 约定工具从输入中取字段（或由 normalize 之后的上下文提供）
      fields_from_input: ["name", "email", "phone", "owner_id", "tags"]

overrides:
  steps:
    - use: "event.emit"
      params:
        name: "customer.created"
        payload_ref: "{{ .steps.customer.create.output }}"
    - use: "audit.log"
      params:
        level: "info"
        event: "customer_created"
        fields:
          - "id"
          - "email"
          - "owner_id"
    - use: "response.format"
      params:
        template: |
          {
            "id": "{{ .steps.customer.create.output.id }}",
            "name": "{{ .steps.customer.create.output.name }}",
            "email": "{{ .steps.customer.create.output.email }}",
            "created_at": "{{ .steps.customer.create.output.created_at }}"
          }

metadata:
  domain: "crm"
  entity: "customer"
  version: "1.0.0"
  intent:
    matchers:
      - type: "keyword"
        any: ["创建客户", "新增客户", "add customer", "create customer"]
      - type: "pattern"
        regex: "(创建|新增|添加|新建).*(客户|customer)"
    examples:
      positive:
      - "创建一个新客户，名字叫张三，邮箱是zhangsan@example.com，由李四所有。"
      - "新增一位客户，姓名为李四，电子邮件地址为lisi@example.com，由王五负责管理。"
      - "添加一名客户，名字是赵六，邮箱是zhao6@example.com，由孙七负责。"
      negative:
        - "删除客户"
        - "更新客户"
        - "查询客户"
        - "查找客户"
        - "查询客户详情"
        - "查找客户详情"
