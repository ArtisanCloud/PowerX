flow_id: core.demo.fanin.task_5
name: "fan-in/fan-out：task_5（汇合）"
version: "1.0"

metadata:
  io:
    inputs:
      # 简化为单一 upstream_id；装配 Plan 时可从 {t2,t3,t4} 选择/合并绑定
      - { name: upstream_id, type: string, required: true }
    outputs:
      - { name: id, type: string }
      - { name: timestamp, type: string }
  requires: ["core.demo.fanin.task_2","core.demo.fanin.task_3","core.demo.fanin.task_4"]
  intent:
    register: true
    group: "demo.fanin"
    matchers:
      - type: keyword
        any: ["汇合任务5","fan-in 任务5","执行任务5","执行task_5","t5 fanin"]
    embedding:
      title: "Fan-in/Fan-out：执行 task_5（扇入汇合）"
      synonyms: ["第五步","汇合","合并处理"]
    examples:
      positive: ["执行任务5"]
      negative: ["执行任务1","执行任务6"]

slots:
  - { name: upstream_id, type: string, required: true }

nodes:
  - id: n1
    use: core.debug.forward
    kind: biz_logic
    params: { id_ref: "{{ .input.upstream_id }}" }
    io:
      in_map:      { upstream_id: "{{ input.upstream_id }}" }
      out_map: { id: id, timestamp: timestamp }
  - id: n2
    use: core.response.format
    kind: text_proc
    params: { template: '{ "id":"{{ node.n1.output.id }}","from":"t5@fanin" }' }
    io:
      out_map: { id: id, timestamp: timestamp }
edges:
  - { from: n1, to: n2, type: SEQ }
