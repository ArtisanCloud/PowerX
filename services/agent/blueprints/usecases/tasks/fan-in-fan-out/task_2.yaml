flow_id: core.demo.fanin.task_2
name: "fan-in/fan-out：task_2"
version: "1.0"

metadata:
  io:
    inputs:
      - { name: upstream_id, type: string, required: true }
    outputs:
      - { name: id, type: string }
      - { name: timestamp, type: string }
  requires: ["core.demo.fanin.task_1"]
  intent:
    register: true
    group: "demo.fanin"
    matchers:
      - type: keyword
        any: ["扇出任务2","fan-in 任务2","执行任务2","执行task_2","t2 fanin"]
      - type: regex
        pattern: "(?:任务\\s*2|task\\s*2|\\bt2\\b)"
    embedding:
      title: "Fan-in/Fan-out：执行 task_2"
      synonyms: ["第二步","并发分支-2"]
    examples:
      positive: ["执行任务2"]
      negative: ["执行任务1","执行任务5"]

slots:
  - { name: upstream_id, type: string, required: true }

nodes:
  - id: n1
    use: core.debug.forward
    kind: biz_logic
    params: { id_ref: "{{ .input.upstream_id }}" }
    io:
      in_map:      { upstream_id: "{{ input.upstream_id }}" }
      out_map: { id: id, timestamp: timestamp }
  - id: n2
    use: core.response.format
    kind: text_proc
    params: { template: '{ "id":"{{ node.n1.output.id }}","from":"t2@fanin" }' }
    io:
      out_map: { id: id, timestamp: timestamp }
edges:
  - { from: n1, to: n2, type: SEQ }
