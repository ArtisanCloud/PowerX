flow_id: core.demo.baseline.task_6
name: "baseline：task_6"
version: "1.0"

metadata:
  io:
    inputs:
      - { name: upstream_id, type: string, required: true }
    outputs:
      - { name: id, type: string }
      - { name: timestamp, type: string }
  requires: ["core.demo.baseline.task_5"]
  intent:
    register: true
    group: "demo.baseline"
    matchers:
      - type: keyword
        any: ["执行任务6","执行task_6","baseline 任务6","run task 6","t6"]
    embedding:
      title: "Baseline：执行 task_6（收尾）"
      synonyms: ["第六步","最后一步","完成任务","任务6"]
    examples:
      positive: ["执行任务6"]
      negative: ["执行任务2"]

slots:
  - { name: upstream_id, type: string, required: true }

nodes:
  - id: n1
    use: core.debug.forward
    kind: biz_logic
    params: { id_ref: "{{ .input.upstream_id }}" }
    io:
      in_map:      { upstream_id: "{{ input.upstream_id }}" }
      out_map: { id: id, timestamp: timestamp }
  - id: n2
    use: core.response.format
    kind: text_proc
    params: { template: '{ "id":"{{ node.n1.output.id }}","from":"t6@baseline" }' }
    io:
      out_map: { id: id, timestamp: timestamp }
edges:
  - { from: n1, to: n2, type: SEQ }
