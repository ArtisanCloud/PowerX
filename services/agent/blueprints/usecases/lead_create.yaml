flow_id: "lead_create"
name: "新增线索记录"
base_flow: "base_flow"
steps:
  - use: "validate.schema"
    params:
      schema:
        type: "object"
        required: ["subject", "channel"]
        properties:
          subject: { type: "string", minLength: 2, maxLength: 200 }
          channel: { type: "string", enum: ["web", "ad", "referral", "event", "manual"] }
          contact_name:  { type: "string" }
          contact_email: { type: "string", format: "email" }
          contact_phone: { type: "string", pattern: "^1[3-9]\\d{9}$" }
          customer_id:   { type: "string" }
          owner_id:      { type: "string" }
          tags:          { type: "array", items: { type: "string" }, maxItems: 20 }

  - use: "lead.create"
    params:
      fields_from_input:
        ["subject","channel","contact_name","contact_email","contact_phone","customer_id","owner_id","tags"]

overrides:
  steps:
    - use: "relation.bind_if_present"
      params:
        # 如果传了 customer_id，就建立客户-线索的关联；否则跳过
        relation: "customer_to_lead"
        from_ref: "{{ .input.customer_id }}"
        to_ref:   "{{ .steps.lead.create.output.id }}"

    - use: "event.emit"
      params:
        name: "lead.created"
        payload_ref: "{{ .steps.lead.create.output }}"

    - use: "audit.log"
      params:
        level: "info"
        event: "lead_created"
        fields:
          - "id"
          - "channel"
          - "owner_id"

    - use: "response.format"
      params:
        template: |
          {
            "id": "{{ .steps.lead.create.output.id }}",
            "subject": "{{ .steps.lead.create.output.subject }}",
            "channel": "{{ .steps.lead.create.output.channel }}",
            "customer_id": "{{ .input.customer_id }}"
          }

metadata:
  domain: "crm"
  entity: "lead"
  version: "1.0.0"
  intent:
    matchers:
      - type: keyword
        any: [ "创建线索", "新增线索", "添加线索", "新建线索", "create lead", "add lead" ]
      - type: pattern
        regex: "(创建|新增|添加|新建).*(线索|lead)"
    examples:
      positive:
        - "创建线索"
        - "新增一个 lead"
        - "帮我添加销售线索"
        - "把这个客户信息存成线索"
      negative:
        - "删除线索"
        - "更新线索"
        - "查询线索"
        - "查找线索"
        - "查询线索详情"
        - "查找线索详情"
  description: "创建一条新的线索记录，关联到指定的客户。"
  notes: |
    这个用例主要用于处理线索的创建操作，包括从外部系统获取客户信息、生成线索记录并进行相应的事件和审计日志记录。
