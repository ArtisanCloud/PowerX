syntax = "proto3";

package powerx.setting.ai.v1;

option go_package = "github.com/ArtisanCloud/PowerX/api/grpc/gen/go/powerx/setting/ai/v1;settingv1";
option java_package = "com.powerx.setting.ai.v1";
option java_multiple_files = true;
option csharp_namespace = "PowerX.Setting.AI.V1";
option php_namespace = "PowerX\\Setting\\AI\\V1";
option php_metadata_namespace = "GPBMetadata\\PowerX\\Setting\\AI\\V1";

import "google/protobuf/struct.proto";
import "common/v1/context.proto";
import "common/v1/response.proto";
import "common/v1/pagination.proto";

/**************** 基础类型 ****************/

enum Modality {
  MODALITY_UNSPECIFIED = 0;
  MODALITY_LLM         = 1;
  MODALITY_IMAGE       = 2;
  MODALITY_EMBEDDING   = 3;
  MODALITY_VIDEO       = 4;
}

message BaseConn {
  string provider        = 1;
  string model           = 2;
  string base_url        = 3;
  string api_key         = 4;
  string region          = 5; // 可选
  string organization    = 6; // 可选
  string azure_deployment= 7; // 可选
}

message LLMSetting {
  BaseConn base     = 1;
  double   temperature = 2;
  int32    max_tokens  = 3;
  double   top_p       = 4;
  bool     stream      = 5;
}

message ImageSetting {
  BaseConn base   = 1;
  string   size   = 2;
  string   quality= 3;
  string   format = 4;
  string   prompt_hint = 5;
}

message EmbeddingSetting {
  BaseConn base      = 1;
  int32    dimensions= 2;
  string   truncate  = 3;
  int32    batch     = 4;
}

message VideoSetting {
  BaseConn base          = 1;
  string   resolution    = 2;
  int32    fps           = 3;
  int32    max_duration_sec = 4;
  string   prompt_hint   = 5;
}

message AIProviderItem {
  string id   = 1;
  string name = 2;
}

message AIProviderCredential {
  string name       = 1;
  string provider   = 2;
  string auth_scheme= 3;
  google.protobuf.Struct data = 4; // base_url/api_key/region/...
}

message AIModelProfile {
  string modality = 1; // "llm"/"image"/"embedding"/"video"
  string provider = 2;
  string model    = 3;
  repeated string tags = 4;
  google.protobuf.Struct defaults = 5; // 温度/maxTokens/size/...
  // 如需暴露能力缓存，可后续添加：google.protobuf.Struct cap_cache = 6;
}

/**************** Service ****************/

service SettingAIService {
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);

  rpc SaveSettings(SaveSettingsRequest) returns (SaveSettingsResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  rpc TestQuickCall(TestQuickCallRequest) returns (TestQuickCallResponse);

  rpc GetActiveProfile(GetActiveProfileRequest) returns (GetActiveProfileResponse);
  rpc SetActiveProfile(SetActiveProfileRequest) returns (SetActiveProfileResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);

  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
}

/**************** Requests ****************/

message ListProvidersRequest {
  common.v1.RequestContext ctx = 1;
  Modality modality = 2;
}

message ListModelsRequest {
  common.v1.RequestContext ctx = 1;
  Modality modality = 2;
  string provider = 3;
}

message SaveSettingsRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  Modality modality = 3;

  oneof setting {
    LLMSetting       llm       = 10;
    ImageSetting     image     = 11;
    EmbeddingSetting embedding = 12;
    VideoSetting     video     = 13;
  }
}

message TestConnectionRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  Modality modality = 3;

  oneof setting {
    LLMSetting       llm       = 10;
    ImageSetting     image     = 11;
    EmbeddingSetting embedding = 12;
    VideoSetting     video     = 13;
  }
}

message TestQuickCallRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  Modality modality = 3;
  string   prompt   = 4; // LLM 快测用
  LLMSetting llm    = 10; // 仅 LLM 使用
}

message GetActiveProfileRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  Modality modality = 3;
}

message SetActiveProfileRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  // 注意：保持与现有服务一致，可接受 string 模态名
  string   modality = 3; // "llm"/"image"/"embedding"/"video"
  string   provider = 4;
  string   model    = 5;
}

message ListProfilesRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
  repeated Modality modalities = 3;
}

message ListCredentialsRequest {
  common.v1.RequestContext ctx = 1;
  string   env      = 2;
}

/**************** Responses（统一 meta + data） ****************/

message ListProvidersData { repeated AIProviderItem items = 1; }
message ListProvidersResponse {
  common.v1.ResponseMeta meta = 1;
  ListProvidersData      data = 2;
}

message ListModelsData {
  repeated string items = 1;
  // 如需分页：common.v1.PageResponse pagination = 2;
}
message ListModelsResponse {
  common.v1.ResponseMeta meta = 1;
  ListModelsData         data = 2;
}

message SaveSettingsData { bool ok = 1; }
message SaveSettingsResponse {
  common.v1.ResponseMeta meta = 1;
  SaveSettingsData       data = 2;
}

message TestConnectionData { bool ok = 1; }
message TestConnectionResponse {
  common.v1.ResponseMeta meta = 1;
  TestConnectionData     data = 2;
}

message TestQuickCallData {
  bool   ok     = 1;
  string result = 2; // LLM 单轮输出（便于前端展示）
}
message TestQuickCallResponse {
  common.v1.ResponseMeta meta = 1;
  TestQuickCallData      data = 2;
}

message GetActiveProfileData {
  string env = 1;
  string modality = 2;
  AIModelProfile profile = 3;
}
message GetActiveProfileResponse {
  common.v1.ResponseMeta meta = 1;
  GetActiveProfileData   data = 2;
}

message SetActiveProfileData { bool ok = 1; }
message SetActiveProfileResponse {
  common.v1.ResponseMeta meta = 1;
  SetActiveProfileData   data = 2;
}

message ListProfilesData {
  string env = 1;
  repeated AIModelProfile profiles = 2;
}
message ListProfilesResponse {
  common.v1.ResponseMeta meta = 1;
  ListProfilesData       data = 2;
}

message ListCredentialsData {
  string env = 1;
  repeated AIProviderCredential credentials = 2;
}
message ListCredentialsResponse {
  common.v1.ResponseMeta meta = 1;
  ListCredentialsData    data = 2;
}
