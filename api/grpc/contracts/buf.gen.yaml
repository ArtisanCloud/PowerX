version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/ArtisanCloud/PowerX/api/grpc/gen/go
    # powerx/workflow/v1 uses默认前缀，保证生成路径与包结构对齐
plugins:
  - plugin: go
    out: ../gen/go
    opt:
      - paths=source_relative
  - plugin: go-grpc
    out: ../gen/go
    opt:
      - paths=source_relative
