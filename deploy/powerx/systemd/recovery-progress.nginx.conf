# 合并到原站点 server 块，指向原 Core 后端端口（生产示例 8080，开发通常 8077）。
# Core 以同一 PID / 端口进入维护模式；不添加 12994 状态服务或另一套网关。
# 普通站点 location / 仍指向原 Web Admin。下面的固定前缀可直接绕过 Node，
# 保留原站点域名、HTTPS 和 Cookie。控制请求需管理会话 + CSRF，jobs 仅接受只读票据。
# 旧 profile 演练部署保留其原有网关配置，不直接套用本示例。
location ^~ /__powerx_recovery/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    add_header Cache-Control no-store always;
}
