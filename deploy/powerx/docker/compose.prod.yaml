version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerx}
      POSTGRES_USER: ${POSTGRES_USER:-powerx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerx}
    ports:
      - "${POWERX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerx} -d ${POSTGRES_DB:-powerx}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${POWERX_LOKI_PORT:-3100}:3100"
    volumes:
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/loki:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro

  promtail:
    image: grafana/promtail:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/promtail:/tmp
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.4.5
    restart: unless-stopped
    ports:
      - "${POWERX_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${POWERX_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${POWERX_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${POWERX_GRAFANA_ANONYMOUS_ENABLED:-false}
    volumes:
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/grafana:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki

  backend:
    image: powerx-backend:${POWERX_IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: deploy/powerx/docker/dockerfiles/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 配置真源：优先使用宿主机映射到容器内 /etc/powerx 的运行时配置
      POWERX_CONFIG: ${POWERX_CONFIG:-/etc/powerx/config.yaml}
      POWERX_BACKEND_HOST: ${POWERX_BACKEND_HOST:-0.0.0.0}
    volumes:
      # 配置层映射：宿主机 /etc/powerx -> 容器 /etc/powerx
      - ${POWERX_HOST_CONFIG_DIR:-/etc/powerx}:/etc/powerx
      # 数据层映射：本地存储场景（如 storage.local_path=/data/uploads）
      - ${POWERX_HOST_DATA_DIR:-/var/lib/powerx}/uploads:/data/uploads
    ports:
      - "${POWERX_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      loki:
        condition: service_started

  web-admin:
    image: powerx-web-admin:${POWERX_IMAGE_TAG:-local}
    build:
      context: ../../..
      dockerfile: deploy/powerx/docker/dockerfiles/web-admin.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 前端代理真源：优先 .env 中的 POWERX_BACKEND/WS_UPSTREAM，未设置时走 backend 服务名
      POWERX_BACKEND: ${POWERX_BACKEND:-http://backend:8080}
      WS_UPSTREAM: ${WS_UPSTREAM:-ws://backend:8080/api/ws}
    volumes:
      - ${POWERX_HOST_CONFIG_DIR:-/etc/powerx}:/etc/powerx:ro
    ports:
      - "${POWERX_WEB_ADMIN_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
