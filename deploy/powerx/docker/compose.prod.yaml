version: "3.9"

services:
  backend:
    image: ghcr.io/artisancloud/powerx-backend:${POWERX_BACKEND_TAG}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POWERX_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  runner:
    image: ghcr.io/artisancloud/powerx-runner:${POWERX_RUNNER_TAG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

  web-admin:
    image: ghcr.io/artisancloud/powerx-web-admin:${POWERX_WEB_ADMIN_TAG}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POWERX_WEB_ADMIN_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
