server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
    pipeline_stages:
      - json:
          expressions:
            plugin_id: plugin_id
            tenant_uuid: tenant_uuid
            component: component
            level: level
      - labels:
          plugin_id:
          tenant_uuid:
          component:
          level:

  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            plugin_id: plugin_id
            tenant_uuid: tenant_uuid
            component: component
            level: level
      - labels:
          plugin_id:
          tenant_uuid:
          component:
          level:
