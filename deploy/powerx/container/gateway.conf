map $http_upgrade $powerx_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    client_max_body_size 100m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $powerx_connection_upgrade;
    location ~ ^/(api(?:/|$)|ws(?:/|$)|media(?:/|$)|healthz$) {
        set $powerx_api http://backend:8080;
        proxy_pass $powerx_api;
    }
    location / {
        set $powerx_web http://web-admin:3000;
        proxy_pass $powerx_web;
    }
}
