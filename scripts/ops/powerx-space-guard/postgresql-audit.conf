# Staged collector handover. logging_collector needs one operator-approved restart.
# Existing stderr logging remains active until then; do not disable it early.
log_statement = 'mod'
log_min_error_statement = 'error'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %qdb=%d user=%u app=%a client=%r session=%c xid=%x '
logging_collector = on
log_destination = 'stderr'
log_directory = '/var/log/postgresql/powerx-audit'
log_filename = 'postgresql-audit-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_rotation_age = '60min'
log_rotation_size = '100MB'
log_truncate_on_rotation = off
