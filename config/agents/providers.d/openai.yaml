id: openai
name: OpenAI
aliases: ["OpenAI API", "openai.com"]
drivers:
  llm: openai
  embedding: openai
  image: openai
auth:
  scheme: bearer
  fields: ["api_key", "base_url"]
modalities:
  llm:
    models:
      - id: gpt-4o-mini
        label: "GPT-4o mini"
        tags: ["fast","cheap"]
        defaults: { temperature: 0.7, max_tokens: 512 }
        limits: { context_window: 128000 }
      - id: gpt-4.1-mini
        label: "GPT-4.1 mini"
        tags: ["json"]
        defaults: { temperature: 0.7, max_tokens: 512 }
  embedding:
    models:
      - id: text-embedding-3-small
        label: "TE-3-small"
        tags: ["cheap"]
        limits: { dims: 1536 }
      - id: text-embedding-3-large
        label: "TE-3-large"
        limits: { dims: 3072 }
  image:
    models:
      - id: gpt-image-1
        label: "GPT-Image-1"
        tags: ["sdxl-like"]
