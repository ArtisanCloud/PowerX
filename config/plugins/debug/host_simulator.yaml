# Default PX host simulator runtime catalogue.
defaults:
  ttl_seconds: 600
  http_port: 51701
  grpc_port: 52701

runtimes:
  - id: go1.26.7
    description: Default Go 1.26.7 host simulator image
    image: registry.powerx.dev/px-host-sim:go1.26.7
    healthcheck: /healthz
  - id: node20
    description: Node 20 + Vite host simulator image
    image: registry.powerx.dev/px-host-sim:node20
    healthcheck: /healthz
