openapi: 3.1.0
info:
  title: PowerX 插件数据集执行
  version: 1.0.0
security:
  - RootUserJWT: []
paths:
  /admin/ops/storage/datasets/{dataset_id}/policies/{tenant_uuid}:
    parameters:
      - $ref: '#/components/parameters/Dataset'
      - name: tenant_uuid
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UUID'}
    get:
      operationId: getStorageDatasetPolicy
      summary: 读取该租户的数据集执行策略
      responses:
        '200': {$ref: '#/components/responses/Policy'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: changeStorageDatasetPolicy
      summary: 按当前修订启用或暂停
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PolicyChange'}
      responses:
        '200': {$ref: '#/components/responses/Policy'}
        default: {$ref: '#/components/responses/Error'}
  /admin/ops/storage/datasets/{dataset_id}/runs:
    parameters:
      - $ref: '#/components/parameters/Dataset'
    post:
      operationId: startStorageDatasetExecution
      summary: 核对预览后派发一个有界批次
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunInput'}
      responses:
        '200': {$ref: '#/components/responses/Run'}
        '202': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /admin/ops/storage/datasets/{dataset_id}/runs/{request_uuid}:
    parameters:
      - $ref: '#/components/parameters/Dataset'
      - $ref: '#/components/parameters/Request'
    get:
      operationId: getStorageDatasetExecution
      summary: 按原批次核对执行结果
      responses:
        '200': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /admin/ops/storage/datasets/{dataset_id}/runs/{request_uuid}/cancellations:
    parameters:
      - $ref: '#/components/parameters/Dataset'
      - $ref: '#/components/parameters/Request'
    post:
      operationId: cancelStorageDatasetExecution
      summary: 撤销尚未签发授权的批次
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /admin/ops/storage/datasets/{dataset_id}/runs/{request_uuid}/archive:
    parameters:
      - $ref: '#/components/parameters/Dataset'
      - $ref: '#/components/parameters/Request'
    get:
      operationId: downloadStorageDatasetArchive
      summary: 校验原归档对象版本并以附件取回
      responses:
        '200':
          description: 已复核长度与 SHA-256 的 JSON Lines
          content:
            application/x-ndjson:
              schema: {type: string, contentMediaType: application/x-ndjson}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    RootUserJWT: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Dataset:
      name: dataset_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
    Request:
      name: request_uuid
      in: path
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  responses:
    Error:
      description: 拒绝参数、授权、版本不符、待核对或依赖未就绪
      content:
        application/json:
          schema: {type: object}
    Policy:
      description: 数据集与租户策略
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: {const: 200}
              data: {$ref: '#/components/schemas/Policy'}
    Run:
      description: 原请求批次
      content:
        application/json:
          schema:
            type: object
            required: [code, data]
            properties:
              code: {enum: [200, 202]}
              data: {$ref: '#/components/schemas/Run'}
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$'
      not: {const: '00000000-0000-0000-0000-000000000000'}
    Revision:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    PolicyChange:
      type: object
      additionalProperties: false
      required: [expected_revision, enabled]
      properties:
        expected_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        enabled: {type: boolean}
        acceptance_revision: {$ref: '#/components/schemas/Revision'}
        action: {enum: [delete, archive]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        archive_target_uuid: {$ref: '#/components/schemas/UUID'}
      allOf:
        - if: {properties: {enabled: {const: true}}}
          then: {required: [acceptance_revision, action, retention_days]}
        - if: {required: [action], properties: {action: {const: archive}}}
          then: {required: [archive_target_uuid]}
    Policy:
      type: object
      required: [dataset_uuid, tenant_uuid, revision, acceptance_revision, enabled, state]
      properties:
        dataset_uuid: {$ref: '#/components/schemas/UUID'}
        tenant_uuid: {$ref: '#/components/schemas/UUID'}
        revision: {type: integer, minimum: 0}
        acceptance_revision: {type: integer, minimum: 0}
        enabled: {type: boolean}
        action: {enum: [delete, archive]}
        retention_days: {type: integer, minimum: 1, maximum: 3650}
        archive_target_uuid: {$ref: '#/components/schemas/UUID'}
        target_revision: {$ref: '#/components/schemas/Revision'}
        active_request_uuid: {$ref: '#/components/schemas/UUID'}
        state: {enum: [paused, enabled, draining]}
    RunInput:
      type: object
      additionalProperties: false
      required: [request_uuid, tenant_uuid, preview_request_uuid, expected_policy_revision]
      properties:
        request_uuid: {$ref: '#/components/schemas/UUID'}
        tenant_uuid: {$ref: '#/components/schemas/UUID'}
        preview_request_uuid: {$ref: '#/components/schemas/UUID'}
        expected_policy_revision: {$ref: '#/components/schemas/Revision'}
    Run:
      type: object
      required: [request_uuid, dataset_uuid, tenant_uuid, preview_request_uuid, policy_revision, action, state, cutoff_at]
      properties:
        request_uuid: {$ref: '#/components/schemas/UUID'}
        dataset_uuid: {$ref: '#/components/schemas/UUID'}
        tenant_uuid: {$ref: '#/components/schemas/UUID'}
        preview_request_uuid: {$ref: '#/components/schemas/UUID'}
        policy_revision: {$ref: '#/components/schemas/Revision'}
        action: {enum: [delete, archive]}
        state: {enum: [queued, authorized, needs_reconciliation, committed, aborted, cancelled]}
        cutoff_at: {type: string, format: date-time}
        grant_expires_at: {type: string, format: date-time}
        affected_count: {type: integer, minimum: 0, maximum: 128}
        source_receipt_uuid: {$ref: '#/components/schemas/UUID'}
        archive_available: {type: boolean}
