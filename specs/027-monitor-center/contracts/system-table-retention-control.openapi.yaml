openapi: 3.0.3
info:
  title: Root fixed system-table retention authority
  version: 1.0.0
  description: Two reviewed adapters only, independent CAS/publication/receipts. Explicit paused adoption
    and same-transaction preview consumption, bounded cleanup and completion receipt.
servers:
- url: /api/v1
security:
- RootUserJWT: []
paths:
  /admin/ops/storage/database-tables/{table_id}/retention:
    get:
      summary: Read desired policy, three publication versions, prerequisites, physical bytes and recent
        receipts
      responses:
        '200':
          description: Status with database/legacy/unavailable configuration authority; readiness does
            not mean enabled
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Status'
        '403':
          description: Root human access session required
    put:
      deprecated: true
      summary: Disabled shared JSON writer
      responses:
        '428':
          description: Use explicit adoption and typed changes
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/adoptions:
    post:
      summary: Explicitly adopt this adapter paused; preserve legacy evidence and block its unknown historical
        results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - legacy_digest
              - confirm
              properties:
                request_id:
                  type: string
                  format: uuid
                legacy_digest:
                  type: string
                  pattern: ^[a-f0-9]{64}$
                confirm:
                  type: boolean
                  enum:
                  - true
      responses:
        '200':
          description: Original request receipt and current publication state; enqueue is not execution
            approval
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Mutation'
        '409':
          description: Legacy drift
          unconfirmed results or conflicting request identity: null
        '503':
          description: Schema
          source or worker unavailable: null
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/changes:
    post:
      summary: Save this adapter settings paused or separately confirm activation; other adapters keep
        their revisions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request_id
              - expected_revision
              - action
              - confirm
              properties:
                request_id:
                  type: string
                  format: uuid
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
                action:
                  type: string
                  enum:
                  - save
                  - status
                settings:
                  $ref: '#/components/schemas/Settings'
                enabled:
                  type: boolean
                confirm:
                  type: boolean
                  enum:
                  - true
              description: save requires settings and forbids enabled; status requires enabled and forbids
                settings. Retention save pauses only this adapter.
      responses:
        '200':
          description: Original request ID
          operation_revision and current configuration: null
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Mutation'
        '409':
          description: CAS or original request payload conflict
        '428':
          description: Explicit adoption required
        '503':
          description: Prerequisites unavailable
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/requests/{request_id}:
    get:
      summary: Read original policy receipt without resubmitting a change
      parameters:
      - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Original operation revision and current configuration; current read failure does
            not erase a committed receipt
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Mutation'
        '403':
          description: Root session and original actor required
        '404':
          description: Keep outcome unconfirmed; do not automatically retry POST
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/previews:
    post:
      summary: Observe eligible source records without modifying them; persist a five-minute governance
        preview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_revision
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '200':
          description: Preview UUID
          revision: null
          actor: null
          fixed cutoffs: null
          expires_at: null
          policy_snapshot and counts; preview metadata is persisted: null
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Run'
        '409':
          description: Revision not current or publication pending
        '503':
          description: PostgreSQL adapter
          indexes: null
          schema or deployment unavailable: null
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/runs:
    post:
      summary: Atomically consume this adapter preview, recheck eligibility and store completed result
        with row changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expected_revision
              - request_id
              - preview_id
              - confirm
              properties:
                expected_revision:
                  type: integer
                  format: int64
                  minimum: 1
                request_id:
                  type: string
                  format: uuid
                preview_id:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum:
                  - true
      responses:
        '200':
          description: Completed original receipt; same exact request returns the original result without
            deleting again
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Run'
        '409':
          description: Expired/consumed preview
          actor/version change: null
          pending publication: null
          disabled policy or request mismatch: null
        '428':
          description: Preview UUID required
        '503':
          description: Unavailable or transaction outcome not confirmed; read original request only
    parameters:
    - $ref: '#/components/parameters/TableID'
  /admin/ops/storage/database-tables/{table_id}/retention/runs/{request_id}:
    get:
      summary: Read original manual execution receipt; no status polling or retry side effects
      parameters:
      - $ref: '#/components/parameters/RequestID'
      responses:
        '200':
          description: Completed receipt retained for at least 30 days; cutoffs and actor are immutable
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - data
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/Run'
        '403':
          description: Root human session and original actor required
        '404':
          description: Unconfirmed outcome; never interpreted as permission to retry
    parameters:
    - $ref: '#/components/parameters/TableID'
components:
  securitySchemes:
    RootUserJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestID:
      in: path
      name: request_id
      required: true
      schema:
        type: string
        format: uuid
    TableID:
      in: path
      name: table_id
      required: true
      schema:
        type: string
        enum:
        - capability_registry_health_probe_results
        - capability_registry_discovery_cache
  schemas:
    Settings:
      type: object
      additionalProperties: false
      required:
      - retention_days
      - batch_limit
      properties:
        retention_days: &id001
          type: integer
          minimum: 7
          maximum: 3650
        batch_limit: &id002
          type: integer
          minimum: 1
          maximum: 500
    Policy:
      type: object
      required:
      - retention_days
      - batch_limit
      - enabled
      - actor
      - updated_at
      properties:
        retention_days: *id001
        batch_limit: *id002
        enabled:
          type: boolean
        actor:
          type: integer
          format: int64
          minimum: 0
        updated_at:
          type: string
          format: date-time
    Configuration:
      type: object
      required:
      - authority
      - state
      - ready
      - execution_ready
      - desired_revision
      - applied_revision
      - snapshot_revision
      - legacy_digest
      properties:
        authority:
          type: string
          enum:
          - database
          - legacy
          - unavailable
        state:
          type: string
          enum:
          - legacy
          - unconfigured
          - pending
          - applied
          - failed
          - unconfirmed
          - unavailable
        ready:
          type: boolean
        execution_ready:
          type: boolean
        desired_revision:
          type: integer
          format: int64
          minimum: 0
        applied_revision:
          type: integer
          format: int64
          minimum: 0
        snapshot_revision:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        legacy_digest:
          type: string
        problem:
          type: string
    Mutation:
      type: object
      required:
      - request_id
      - operation_revision
      - configuration
      - table_id
      properties:
        request_id:
          type: string
          format: uuid
        operation_revision:
          type: integer
          format: int64
          minimum: 1
        configuration:
          $ref: '#/components/schemas/Configuration'
        table_id:
          type: string
    Run:
      type: object
      required:
      - id
      - revision
      - state
      - at
      - actor
      - policy_snapshot
      - trigger
      - table_id
      - rows
      - cutoff
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 1
        state:
          type: string
          enum:
          - preview
          - completed
        at:
          type: string
          format: date-time
        actor:
          type: integer
          format: int64
          minimum: 0
        policy_snapshot:
          $ref: '#/components/schemas/Policy'
        expires_at:
          type: string
          format: date-time
        preview_id:
          type: string
          format: uuid
        trigger:
          type: string
          enum:
          - manual
          - scheduled
        table_id:
          type: string
        rows:
          type: integer
          minimum: 0
          maximum: 500
        cutoff:
          type: string
          format: date-time
    Status:
      type: object
      required:
      - id
      - revision
      - policy
      - configuration
      - state_configured
      - enforcement_allowed
      - worker_enabled
      - ready
      - runs
      - unconfirmed_runs
      properties:
        state_configured:
          type: boolean
        enforcement_allowed:
          type: boolean
        worker_enabled:
          type: boolean
        ready:
          type: boolean
        unconfirmed_runs:
          type: integer
          format: int64
          minimum: 0
        policy:
          $ref: '#/components/schemas/Policy'
        configuration:
          $ref: '#/components/schemas/Configuration'
        runs:
          type: array
          maxItems: 300
          items:
            type: object
            description: New preview/completed receipts follow Run; retained legacy evidence may also
              carry failed/unconfirmed states and missing historical metadata.
        id:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        adapter_problem:
          type: string
        problem:
          type: string
