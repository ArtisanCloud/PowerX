openapi: 3.0.3
info:
  title: Archive credential authority
  version: 1.0.0
  description: Root专用独立凭据存储。外部文件密钥提供器 v1，不依赖业务数据库；不代表已接入外部 KMS 或完成恢复时代次保护。
servers:
- url: /api/v1
security:
- RootUserJWT: []
paths:
  /admin/ops/backup/archives/s3-credentials:
    get:
      operationId: listArchiveCredentialAuthority
      summary: 查看凭据权威、版本、旧来源及密钥轮换状态
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialOverview'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
    post:
      operationId: saveEncryptedArchiveCredential
      summary: 创建或更新独立加密凭据；不写旧 secrets 文件
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialMutation'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveCredential'
  /admin/ops/backup/archives/s3-credentials/requests/{request_id}:
    get:
      operationId: getArchiveCredentialRequest
      summary: 仅原提交者只读核对原请求；不重放写入
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialMutation'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
      parameters:
      - in: path
        name: request_id
        required: true
        schema:
          type: string
          format: uuid
  /admin/ops/backup/archives/s3-credentials/{credential_ref}/adoptions:
    post:
      operationId: adoptLegacyArchiveCredential
      summary: 明确核对旧版本／摘要后复制到独立加密权威，保留旧对象
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialMutation'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptCredential'
      parameters: &id001
      - in: path
        name: credential_ref
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
  /admin/ops/backup/archives/s3-credentials/{credential_ref}/revocations:
    post:
      operationId: revokeArchiveCredential
      summary: 吊销当前凭据并禁止旧明文回退；不撤销已在途的远端请求
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialMutation'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCredential'
      parameters: *id001
  /admin/ops/backup/archives/credential-store/rotations:
    post:
      operationId: rewrapArchiveCredentialStore
      summary: 使用外部挂载的活动主密钥重新加密；不接收或生成主密钥
      responses:
        '200':
          description: 只返回元数据与原操作回执；无凭据值。
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CredentialMutation'
                required:
                - data
        '400':
          description: 严格 DTO 或必需字段无效
        '401':
          description: 缺少有效用户会话
        '403':
          description: 不是平台 Root 用户或不是原提交者
        '404':
          description: 尚无该回执；不得自动重发未知操作
        '409':
          description: 版本、请求载荷或主密钥轮换状态冲突
        '503':
          description: 独立凭据存储、主密钥或绑定不可用；不回退旧明文
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCredential'
components:
  securitySchemes:
    RootUserJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 真实平台 Root 用户 access JWT；API Key、STS、服务身份拒绝。
  schemas:
    SaveCredential:
      type: object
      additionalProperties: false
      required:
      - request_id
      - expected_revision
      - ref
      - access_key
      - secret_key
      properties:
        request_id: &id002
          type: string
          format: uuid
        expected_revision: &id003
          type: integer
          format: int64
          minimum: 0
        ref:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
        access_key:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
        secret_key:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        session_token:
          type: string
          maxLength: 16384
          writeOnly: true
      description: 请求体上限32KiB；凭据字段长度以UTF-8字节计。expected_revision=0仅创建；旧来源必须先接管。
    ControlCredential:
      type: object
      additionalProperties: false
      required:
      - request_id
      - expected_revision
      - confirm
      properties:
        request_id: *id002
        expected_revision: *id003
        confirm:
          type: boolean
          enum:
          - true
    AdoptCredential:
      type: object
      additionalProperties: false
      required:
      - request_id
      - expected_revision
      - legacy_digest
      - confirm
      properties:
        request_id: *id002
        expected_revision: *id003
        legacy_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        confirm:
          type: boolean
          enum:
          - true
    CredentialView:
      type: object
      required:
      - ref
      - revision
      - origin
      - state
      properties:
        ref:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        origin:
          type: string
          enum:
          - legacy
          - sealed
        state:
          type: string
          enum:
          - active
          - revoked
          - read_only
          - recovery_required
          - unavailable
        legacy_digest:
          type: string
    CredentialStore:
      type: object
      required:
      - configured
      - ready
      - revision
      - rotation_required
      properties:
        configured:
          type: boolean
        ready:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        rotation_required:
          type: boolean
        store_id:
          type: string
        key_id:
          type: string
        active_key_id:
          type: string
        problem:
          type: string
        credentials:
          type: array
          items:
            type: object
            description: 经过认证的凭据元数据；没有Value、AccessKey或SecretKey。
    CredentialOverview:
      type: object
      required:
      - store
      - items
      properties:
        store:
          $ref: '#/components/schemas/CredentialStore'
        items:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/CredentialView'
    CredentialReceipt:
      type: object
      required:
      - request_id
      - action
      - revision
      - store_revision
      - actor
      - at
      properties:
        request_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
          - save
          - adopt
          - revoke
          - rewrap
        ref:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 0
        store_revision:
          type: integer
          format: int64
          minimum: 1
        actor:
          type: integer
          format: int64
          minimum: 1
        at:
          type: string
          format: date-time
        trace:
          type: string
        origin_revision:
          type: integer
          format: int64
          minimum: 0
        origin_digest:
          type: string
    CredentialMutation:
      type: object
      required:
      - receipt
      - overview
      properties:
        receipt:
          $ref: '#/components/schemas/CredentialReceipt'
        overview:
          $ref: '#/components/schemas/CredentialOverview'
