openapi: 3.0.3
info:
  title: Agent Lifecycle Control API
  version: "0.1.0"
  description: >
    管理员、运维与 SRE 通过统一 HTTP 控制面管理代理注册、生命周期与健康观测。
servers:
  - url: https://api.powerx.local/admin
    description: Admin 控制面
  - url: https://api.powerx.local/openapi
    description: 租户/运维控制面
tags:
  - name: Agents
    description: 代理注册与基本信息
  - name: Lifecycle
    description: 生命周期控制与事件查询
  - name: Health
    description: 健康观测与告警
  - name: Sharing
    description: 多租户共享与撤销
paths:
  /agents:
    post:
      tags: [Agents]
      summary: 注册新代理
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResource'
        '409':
          description: 租户内别名冲突或依赖校验失败
  /agents/{agentId}:
    get:
      tags: [Agents]
      summary: 查看代理详情
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: 代理详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResource'
        '404':
          description: 未找到
  /agents/{agentId}/activate:
    post:
      tags: [Lifecycle]
      summary: 激活代理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
      responses:
        '202':
          description: 激活请求已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleEventResource'
        '409':
          description: 依赖校验失败或状态不允许
  /agents/{agentId}/pause:
    post:
      tags: [Lifecycle]
      summary: 暂停代理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
      responses:
        '202':
          description: 暂停请求已受理
  /agents/{agentId}/resume:
    post:
      tags: [Lifecycle]
      summary: 恢复代理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
      responses:
        '202':
          description: 恢复请求已受理
  /agents/{agentId}/retire:
    post:
      tags: [Lifecycle]
      summary: 退役代理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
      responses:
        '202':
          description: 退役请求已受理
  /agents/{agentId}/scale:
    post:
      tags: [Lifecycle]
      summary: 扩缩容代理
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleCommand'
      responses:
        '202':
          description: 扩缩容请求已受理
        '400':
          description: 容量值非法
  /agents/{agentId}/events:
    get:
      tags: [Lifecycle]
      summary: 查询代理生命周期事件历史
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - in: query
          name: since
          description: ISO timestamp，过滤开始时间
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 生命周期事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/LifecycleEventResource'
  /agents/{agentId}/health/summary:
    get:
      tags: [Health]
      summary: 获取代理当前健康摘要
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: 健康摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthSummary'
  /agents/{agentId}/health/history:
    get:
      tags: [Health]
      summary: 获取代理健康历史
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - in: query
          name: window
          description: 聚合窗口（分钟）
          schema:
            type: integer
            default: 60
            minimum: 1
        - in: query
          name: range_hours
          description: 回溯小时数
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 168
      responses:
        '200':
          description: 健康历史集合
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
            type: array
            items:
              $ref: '#/components/schemas/HealthSnapshot'
  /autoreg/manifests:
    post:
      tags: [Agents]
      summary: 插件 manifest 自动注册 Agent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRegisterManifestRequest'
      responses:
        '201':
          description: 自动注册结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRegisterResponse'
        '400':
          description: manifest 载荷非法
        '401':
          description: 签名校验失败
  /agents/{agentId}/sandbox:
    post:
      tags: [Agents]
      summary: 手动重跑沙箱验证
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxRunRequest'
      responses:
        '200':
          description: 沙箱执行结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResult'
        '502':
          description: 沙箱执行失败
  /admin/agents/tenant/forms:
    post:
      tags: [Agents]
      summary: 租户管理员提交 Agent 表单
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAgentFormRequest'
      responses:
        '201':
          description: 表单已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAgentFormResponse'
        '400':
          description: 校验失败或策略冲突
    get:
      tags: [Agents]
      summary: 列出租户提交的表单
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: tenant_id
          schema:
            type: string
          required: true
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_approval, approved, rejected, activated]
      responses:
        '200':
          description: 表单列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantAgentFormResponse'
  /admin/agents/tenant/forms/{formId}:
    get:
      tags: [Agents]
      summary: 查看单个租户表单
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormId'
      responses:
        '200':
          description: 表单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAgentFormResponse'
        '404':
          description: 未找到
  /admin/agents/tenant/forms/{formId}/approve:
    post:
      tags: [Agents]
      summary: 审批通过租户表单并激活 Agent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAgentFormActionRequest'
      responses:
        '200':
          description: 表单已审批
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAgentFormResponse'
        '409':
          description: 状态不允许
  /admin/agents/tenant/forms/{formId}/reject:
    post:
      tags: [Agents]
      summary: 拒绝租户表单
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FormId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAgentFormActionRequest'
      responses:
        '200':
          description: 表单已拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAgentFormResponse'
        '409':
          description: 状态不允许

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgentId:
      name: agentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: shareId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FormId:
      name: formId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterAgentRequest:
      type: object
      required:
        - alias
        - tenantId
        - toolGrants
        - telemetryContractVersion
        - defaultCapacityInstances
      properties:
        alias:
          type: string
          description: 代理别名（租户内唯一）
        tenantId:
          type: string
        toolGrants:
          type: array
          items:
            $ref: '#/components/schemas/ToolGrant'
        telemetryContractVersion:
          type: string
        defaultCapacityInstances:
          type: integer
          minimum: 1
        maxCapacityInstances:
          type: integer
          minimum: 1
        notificationChannel:
          type: string
          description: 企业 IM Webhook URL
        metadata:
          type: object
          additionalProperties: true
    AutoRegisterManifestRequest:
      type: object
      required:
        - pluginId
        - pluginVersion
        - manifestVersion
        - tenantId
        - alias
        - telemetryContractVersion
        - signature
      properties:
        pluginId:
          type: string
        pluginVersion:
          type: string
        manifestVersion:
          type: string
        tenantId:
          type: string
        alias:
          type: string
        displayName:
          type: string
        telemetryContractVersion:
          type: string
        toolGrants:
          type: array
          items:
            $ref: '#/components/schemas/ToolGrant'
        defaultCapacityInstances:
          type: integer
          minimum: 1
        maxCapacityInstances:
          type: integer
        notificationChannel:
          type: string
        metadata:
          type: object
          additionalProperties: true
        capabilities:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        rateLimits:
          type: object
          additionalProperties:
            type: integer
        sandboxProfile:
          type: string
        signature:
          type: string
        dryRun:
          type: boolean
        requestedBy:
          type: string
        traceId:
          type: string
    AutoRegisterResponse:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/AgentResource'
        sandbox:
          $ref: '#/components/schemas/SandboxResult'
        dryRun:
          type: boolean
    SandboxResult:
      type: object
      properties:
        status:
          type: string
        reportUrl:
          type: string
        profile:
          type: string
        executedAt:
          type: string
          format: date-time
        metrics:
          type: object
          additionalProperties:
            type: number
    SandboxRunRequest:
      type: object
      properties:
        profile:
          type: string
        requestedBy:
          type: string
        traceId:
          type: string
    TenantAgentFormRequest:
      type: object
      required: [tenantId, alias, telemetryContractVersion]
      properties:
        tenantId:
          type: string
        alias:
          type: string
        displayName:
          type: string
        purpose:
          type: string
        promptTemplate:
          type: string
        telemetryContractVersion:
          type: string
        toolGrants:
          type: array
          items:
            $ref: '#/components/schemas/ToolGrant'
        permissions:
          type: array
          items:
            type: string
        rateLimit:
          type: integer
        sandboxProfile:
          type: string
        metadata:
          type: object
          additionalProperties: true
        requestedBy:
          type: string
        traceId:
          type: string
    TenantAgentFormActionRequest:
      type: object
      required: [operator]
      properties:
        operator:
          type: string
        reason:
          type: string
        traceId:
          type: string
    PolicyConflict:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    TenantAgentFormResponse:
      allOf:
        - type: object
          properties:
            id:
              type: string
              format: uuid
            tenantId:
              type: string
            alias:
              type: string
            displayName:
              type: string
            purpose:
              type: string
            promptTemplate:
              type: string
            telemetryContractVersion:
              type: string
            toolGrants:
              type: array
              items:
                $ref: '#/components/schemas/ToolGrant'
            permissions:
              type: array
              items:
                type: string
            rateLimit:
              type: integer
            sandboxProfile:
              type: string
            status:
              type: string
            workflowTicketId:
              type: string
            conflictReasons:
              type: array
              items:
                $ref: '#/components/schemas/PolicyConflict'
            requestedBy:
              type: string
            approvedBy:
              type: string
            approvedAt:
              type: string
              format: date-time
            activatedAgentId:
              type: string
              format: uuid
            metadata:
              type: object
              additionalProperties: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AgentResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        alias:
          type: string
        tenantId:
          type: string
        status:
          type: string
          enum: [pending, active, paused, retired]
        toolGrants:
          type: array
          items:
            $ref: '#/components/schemas/ToolGrant'
        telemetryContractVersion:
          type: string
        defaultCapacityInstances:
          type: integer
        maxCapacityInstances:
          type: integer
        currentCapacityInstances:
          type: integer
        eventTopic:
          type: string
        notificationChannel:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ToolGrant:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
        expiresAt:
          type: string
          format: date-time
    LifecycleCommand:
      type: object
      properties:
        reason:
          type: string
        traceId:
          type: string
        requestedAt:
          type: string
          format: date-time
    ScaleCommand:
      allOf:
        - $ref: '#/components/schemas/LifecycleCommand'
        - type: object
          required: [targetCapacityInstances]
          properties:
            targetCapacityInstances:
              type: integer
              minimum: 1
    LifecycleEventResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            [register, activate, pause, resume, scale_up, scale_down, retire, auto_degrade, auto_recover]
        fromStatus:
          type: string
        toStatus:
          type: string
        requestedCapacity:
          type: integer
        reason:
          type: string
        triggeredBy:
          type: string
        traceId:
          type: string
        eventId:
          type: string
        createdAt:
          type: string
          format: date-time
    HealthSummary:
      type: object
      properties:
        agentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [healthy, degraded, unavailable, unknown]
        healthScore:
          type: integer
          minimum: 0
          maximum: 100
        updatedAt:
          type: string
          format: date-time
        metrics:
          type: object
          properties:
            throughputPerMin:
              type: number
            successRate:
              type: number
            p95LatencyMs:
              type: integer
            resourceUtilizationPct:
              type: number
            errorRate:
              type: number
        recommendations:
          type: array
          items:
            type: string
    HealthSnapshot:
      type: object
      properties:
        windowStartedAt:
          type: string
          format: date-time
        windowDurationSec:
          type: integer
        healthScore:
          type: integer
        status:
          type: string
        throughputPerMin:
          type: number
        successRate:
          type: number
        p95LatencyMs:
          type: integer
        resourceUtilizationPct:
          type: number
        anomalyTraceIds:
          type: array
          items:
            type: string
  /agents/{agentId}/shares:
    post:
      tags: [Sharing]
      summary: 将代理共享给目标租户
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareAgentRequest'
      responses:
        '201':
          description: 共享记录已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentShareResource'
        '400':
          description: 参数或白名单校验失败
        '409':
          description: 已存在共享记录
  /agents/shares/{shareId}/revoke:
    post:
      tags: [Sharing]
      summary: 撤销现有共享
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ShareId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeShareRequest'
      responses:
        '200':
          description: 共享已撤销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentShareResource'
        '404':
          description: 未找到共享记录

  /agents/{agentId}/bridge/state:
    get:
      tags: [Lifecycle]
      summary: 获取 ReAct/任务执行需要的聚合状态
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 聚合状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeStateResponse'
  /agents/{agentId}/bridge/freeze:
    post:
      tags: [Lifecycle]
      summary: Planner/Coordinator 暂停 Agent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeControlRequest'
      responses:
        '200':
          description: 暂停成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeLifecycleResponse'
  /agents/{agentId}/bridge/recover:
    post:
      tags: [Lifecycle]
      summary: Recovery 阶段恢复 Agent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeControlRequest'
      responses:
        '200':
          description: 恢复成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeLifecycleResponse'
  /agents/{agentId}/bridge/rebalance:
    post:
      tags: [Lifecycle]
      summary: Coordinator 触发扩缩容
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeRebalanceRequest'
      responses:
        '200':
          description: 扩缩容成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeLifecycleResponse'
    ShareAgentRequest:
      type: object
      required:
        - tenantId
      properties:
        tenantId:
          type: string
        requestedBy:
          type: string
        traceId:
          type: string
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/ShareQuota'
        metadata:
          type: object
          additionalProperties:
            type: string
    RevokeShareRequest:
      type: object
      properties:
        reason:
          type: string
        requestedBy:
          type: string
        traceId:
          type: string
    ShareQuota:
      type: object
      properties:
        type:
          type: string
        limit:
          type: integer
    AgentShareResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        tenantId:
          type: string
        status:
          type: string
        quotas:
          type: array
          items:
            $ref: '#/components/schemas/ShareQuota'
        metadata:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
    BridgeStateResponse:
      type: object
      properties:
        agent:
          $ref: '#/components/schemas/BridgeAgent'
        health:
          $ref: '#/components/schemas/HealthSummary'
        events:
          type: array
          items:
            $ref: '#/components/schemas/BridgeEvent'
    BridgeAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
        alias:
          type: string
        status:
          type: string
        capacity:
          type: object
          properties:
            default:
              type: integer
            current:
              type: integer
            max:
              type: integer
              nullable: true
        updatedAt:
          type: string
          format: date-time
    BridgeEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        reason:
          type: string
        triggered_by:
          type: string
