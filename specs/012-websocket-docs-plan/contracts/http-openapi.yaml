openapi: 3.0.3
info:
  title: PowerX WebSocket Notify Bus
  version: 1.0.0
paths:
  /api/ws:
    get:
      summary: WebSocket 连接升级入口
      description: 建立通用 WebSocket 连接，后续通过消息订阅主题。消息体结构参考 components/schemas/WSBusEnvelope。
      responses:
        "101":
          description: Switching Protocols
components:
  schemas:
    WSBusEnvelope:
      type: object
      properties:
        topic:
          type: string
        type:
          type: string
        payload:
          type: object
        ts:
          type: integer
          format: int64
        trace_id:
          type: string
      required: [type, ts]
    WSBusCommand:
      type: object
      properties:
        type:
          type: string
        topic:
          type: string
        topics:
          type: array
          items:
            type: string
        req_id:
          type: string
      required: [type]
    WSBusWelcomePayload:
      type: object
      properties:
        protocol:
          type: string
        server:
          type: string
        heartbeat_sec:
          type: integer
    WSBusAckPayload:
      type: object
      properties:
        req_id:
          type: string
        ok:
          type: boolean
        message:
          type: string
        topics:
          type: array
          items:
            type: string
    WSBusErrorPayload:
      type: object
      properties:
        req_id:
          type: string
        code:
          type: string
        message:
          type: string
        detail:
          type: string
    IngestionProgress:
      type: object
      properties:
        tenant_uuid:
          type: string
        space_uuid:
          type: string
        job_uuid:
          type: string
        status:
          type: string
        stage:
          type: string
        progress:
          type: integer
        chunk_total:
          type: integer
        embedding_pct:
          type: number
          format: float
        masking_pct:
          type: number
          format: float
        updated_at:
          type: string
          format: date-time
