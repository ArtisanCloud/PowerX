openapi: 3.1.0
info:
  title: Workflow Orchestration Admin API
  version: 0.1.0
  description: >
    Admin endpoints for managing workflow definitions and orchestrating runtime execution.
    All routes require authenticated CoreX administrators with tenant-scoped RBAC.
servers:
  - url: https://{host}/api/v1/admin/workflows
    variables:
      host:
        default: localhost:8077
tags:
  - name: Definitions
  - name: Instances
  - name: Exports
  - name: NodeCatalog
  - name: HumanReview
  - name: Packs
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ResponseMeta:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        timestamp:
          type: integer
          description: Unix epoch seconds
        request_id:
          type: string
    PageResponse:
      type: object
      properties:
        total:
          type: integer
        next_page_token:
          type: string
    WorkflowDefinitionCreateRequest:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          example: onboarding-approval
        description:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowStepDefinition'
        default_retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        compensation_policy:
          $ref: '#/components/schemas/CompensationPolicy'
        sla_policy:
          $ref: '#/components/schemas/SlaPolicy'
        metadata:
          type: object
          additionalProperties: true
    WorkflowDefinition:
      type: object
      required:
        - definition_uuid
        - name
        - version
        - status
        - steps
      properties:
        definition_uuid:
          type: string
          format: uuid
        tenant_uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, archived]
        default_retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        compensation_policy:
          $ref: '#/components/schemas/CompensationPolicy'
        sla_policy:
          $ref: '#/components/schemas/SlaPolicy'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepDefinition'
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
    WorkflowStepDefinition:
      type: object
      required: [id, type, node_kind]
      properties:
        id:
          type: string
          description: Logical identifier within the workflow graph
        display_name:
          type: string
        type:
          type: string
          enum: [agent, system, decision, parallel, human_approval, compensation]
        node_kind:
          type: string
          enum:
            [
              input.capture,
              skill.invoke,
              capability.invoke,
              metadata.classify,
              knowledge.stage,
              decision.gateway,
              parallel.fanout,
              parallel.join,
              human.review,
              knowledge.publish,
              event.emit,
              compensation.rollback
            ]
        node_ref:
          type: string
        input_mapping:
          type: object
          additionalProperties: true
        output_mapping:
          type: object
          additionalProperties: true
        config:
          type: object
          description: Declarative configuration for the step executor
          additionalProperties: true
        compensatable:
          type: boolean
          default: false
        next_step_ids:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          default: 5
        initial_interval_ms:
          type: integer
          default: 30000
        backoff_multiplier:
          type: number
          default: 2
        max_interval_ms:
          type: integer
        jitter_ms:
          type: integer
    CompensationPolicy:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        require_manual_approval:
          type: boolean
          default: false
        max_concurrent:
          type: integer
          default: 1
        escalation_channel:
          type: string
    SlaPolicy:
      type: object
      properties:
        step_timeout_seconds:
          type: integer
        overall_timeout_seconds:
          type: integer
        heartbeat_interval_seconds:
          type: integer
    WorkflowInstanceCreateRequest:
      type: object
      required: [definition_uuid]
      properties:
        definition_uuid:
          type: string
          format: uuid
        definition_version:
          type: integer
          description: Optional explicit version; defaults to latest published
        input:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties:
            type: string
        correlation_id:
          type: string
    WorkflowInstance:
      type: object
      required: [instance_uuid, definition_uuid, state]
      properties:
        instance_uuid:
          type: string
          format: uuid
        tenant_uuid:
          type: string
          format: uuid
        definition_uuid:
          type: string
          format: uuid
        definition_version:
          type: integer
        state:
          type: string
          enum:
            [
              draft,
              running,
              waiting,
              suspended,
              succeeded,
              failed,
              compensating,
              compensated,
              canceled,
              compensation_failed
            ]
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        sla:
          $ref: '#/components/schemas/SlaSnapshot'
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        tags:
          type: object
          additionalProperties:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepSummary'
    WorkflowStepSummary:
      type: object
      properties:
        step_record_id:
          type: string
          format: uuid
        step_id:
          type: string
        type:
          type: string
          enum: [agent, system, decision, parallel, human_approval, compensation]
        node_kind:
          type: string
        node_ref:
          type: string
        state:
          type: string
          enum: [queued, in_progress, waiting, completed, failed, compensating, compensated]
        subject_type:
          type: string
          enum: [system, agent, human]
        subject_uuid:
          type: string
        tool_grant_version:
          type: integer
        attempt:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        payload_in:
          type: object
          additionalProperties: true
        payload_out:
          type: object
          additionalProperties: true
        failure_reason:
          type: string
        error_code:
          type: string
        error_message:
          type: string
        awaiting_manual_approval:
          type: boolean
    SlaSnapshot:
      type: object
      properties:
        overall_deadline:
          type: string
          format: date-time
        next_heartbeat_due:
          type: string
          format: date-time
        breached:
          type: boolean
        breaches:
          type: array
          items:
            $ref: '#/components/schemas/SlaBreach'
    SlaBreach:
      type: object
      properties:
        metric:
          type: string
        occurred_at:
          type: string
          format: date-time
        details:
          type: string
    ManualActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pause, resume, cancel, retry_step, reassign_step, trigger_compensation]
        step_id:
          type: string
        assignment_id:
          type: string
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
    DefinitionResponse:
      type: object
      required: [meta, definition]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
    InstanceResponse:
      type: object
      required: [meta, instance]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        instance:
          $ref: '#/components/schemas/WorkflowInstance'
    ListDefinitionsResponse:
      type: object
      required: [meta, page, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        page:
          $ref: '#/components/schemas/PageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
    ListInstancesResponse:
      type: object
      required: [meta, page, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        page:
          $ref: '#/components/schemas/PageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstance'
    ExportResponse:
      type: object
      required: [meta, rows]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
        download_url:
          type: string
          format: uri
    ExportRow:
      type: object
      properties:
        instance_uuid:
          type: string
        definition_uuid:
          type: string
        definition_version:
          type: integer
        state:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        tenant_uuid:
          type: string
        correlation_id:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              step_id:
                type: string
              type:
                type: string
              state:
                type: string
              subject_type:
                type: string
              subject_uuid:
                type: string
              attempts:
                type: integer
              tool_grant_version:
                type: integer
              last_transition_at:
                type: string
                format: date-time
              last_error:
                type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                additionalProperties: true
    NodeCatalogItem:
      type: object
      required: [node_kind, display_name_i18n_key, category, step_type, config_schema]
      properties:
        node_kind:
          type: string
        display_name_i18n_key:
          type: string
        description_i18n_key:
          type: string
        category:
          type: string
        step_type:
          type: string
          enum: [agent, system, decision, parallel, human_approval, compensation]
        input_schema:
          type: object
          additionalProperties: true
        output_schema:
          type: object
          additionalProperties: true
        config_schema:
          type: object
          additionalProperties: true
        required_permissions:
          type: array
          items:
            type: string
        required_capabilities:
          type: array
          items:
            type: string
        idempotency_required:
          type: boolean
        compensation_supported:
          type: boolean
        source_status:
          type: string
          enum: [available, missing_dependency, permission_denied, disabled]
    NodeCatalogResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeCatalogItem'
    HumanReviewTask:
      type: object
      required: [review_task_uuid, workflow_instance_uuid, step_id, status]
      properties:
        review_task_uuid:
          type: string
          format: uuid
        tenant_uuid:
          type: string
          format: uuid
        workflow_instance_uuid:
          type: string
          format: uuid
        step_id:
          type: string
        review_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        approver_policy:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, approved, rejected, changes_requested, canceled, expired]
        reviewer_user_uuid:
          type: string
          format: uuid
        decision:
          type: string
        decision_payload:
          type: object
          additionalProperties: true
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    HumanReviewActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, request_changes, cancel]
        comment:
          type: string
        decision_payload:
          type: object
          additionalProperties: true
    HumanReviewTaskResponse:
      type: object
      required: [meta, review_task]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        review_task:
          $ref: '#/components/schemas/HumanReviewTask'
    ListHumanReviewTasksResponse:
      type: object
      required: [meta, page, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        page:
          $ref: '#/components/schemas/PageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/HumanReviewTask'
    WorkflowPack:
      type: object
      required: [workflow_key, version, status]
      properties:
        workflow_key:
          type: string
        display_name_i18n_key:
          type: string
        version:
          type: integer
        status:
          type: string
          enum: [missing, seeded, dependency_failed]
        definition_uuid:
          type: string
          format: uuid
        definition_version:
          type: integer
        checksum:
          type: string
    ListWorkflowPacksResponse:
      type: object
      required: [meta, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPack'
paths:
  /definitions:
    post:
      tags: [Definitions]
      summary: Create workflow definition
      operationId: createDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinitionCreateRequest'
      responses:
        '201':
          description: Definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Definitions]
      summary: List workflow definitions
      operationId: listDefinitions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, archived]
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Definitions page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDefinitionsResponse'
  /definitions/{definition_uuid}:
    get:
      tags: [Definitions]
      summary: Get workflow definition
      operationId: getDefinition
      parameters:
        - in: path
          name: definition_uuid
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: version
          schema:
            type: integer
      responses:
        '200':
          description: Definition detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '404':
          description: Definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /definitions/{definition_uuid}/publish:
    post:
      tags: [Definitions]
      summary: Publish workflow definition
      operationId: publishDefinition
      parameters:
        - in: path
          name: definition_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                change_note:
                  type: string
      responses:
        '200':
          description: Definition published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '409':
          description: Definition already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /definitions/{definition_uuid}/archive:
    post:
      tags: [Definitions]
      summary: Archive workflow definition
      operationId: archiveDefinition
      parameters:
        - in: path
          name: definition_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Definition archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
  /definitions/{definition_uuid}/validate:
    post:
      tags: [Definitions]
      summary: Validate workflow definition dependencies before publish
      operationId: validateDefinition
      parameters:
        - in: path
          name: definition_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Definition dependency validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '400':
          description: Definition invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /node-catalog:
    get:
      tags: [NodeCatalog]
      summary: List executable workflow node kinds
      operationId: listNodeCatalog
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
      responses:
        '200':
          description: Node catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeCatalogResponse'
  /node-catalog/{node_kind}:
    get:
      tags: [NodeCatalog]
      summary: Get executable workflow node kind
      operationId: getNodeCatalogItem
      parameters:
        - in: path
          name: node_kind
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node catalog item
          content:
            application/json:
              schema:
                type: object
                required: [meta, item]
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  item:
                    $ref: '#/components/schemas/NodeCatalogItem'
  /instances:
    post:
      tags: [Instances]
      summary: Start workflow instance
      operationId: startInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInstanceCreateRequest'
      responses:
        '202':
          description: Instance accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
    get:
      tags: [Instances]
      summary: List workflow instances
      operationId: listInstances
      parameters:
        - in: query
          name: definition_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: state
          schema:
            type: string
            enum:
              [
                draft,
                running,
                waiting,
                suspended,
                succeeded,
                failed,
                compensating,
                compensated,
                canceled,
                compensation_failed
              ]
        - in: query
          name: agent_uuid
          schema:
            type: string
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
        - in: query
          name: include_steps
          schema:
            type: boolean
            default: false
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Instances page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
  /instances/{instance_uuid}:
    get:
      tags: [Instances]
      summary: Get workflow instance
      operationId: getInstance
      parameters:
        - in: path
          name: instance_uuid
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: include_steps
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Instance detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /instances/{instance_uuid}/actions:
    post:
      tags: [Instances]
      summary: Execute manual control action
      operationId: controlInstance
      parameters:
        - in: path
          name: instance_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActionRequest'
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '409':
          description: Action rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /instances/{instance_uuid}/steps:
    get:
      tags: [Instances]
      summary: List step records for workflow instance
      operationId: listInstanceSteps
      parameters:
        - in: path
          name: instance_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Step records
          content:
            application/json:
              schema:
                type: object
                required: [meta, items]
                properties:
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowStepSummary'
  /review-tasks:
    get:
      tags: [HumanReview]
      summary: List workflow human review tasks
      operationId: listHumanReviewTasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: workflow_instance_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Review task page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHumanReviewTasksResponse'
  /review-tasks/{review_task_uuid}:
    get:
      tags: [HumanReview]
      summary: Get workflow human review task
      operationId: getHumanReviewTask
      parameters:
        - in: path
          name: review_task_uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewTaskResponse'
  /review-tasks/{review_task_uuid}/actions:
    post:
      tags: [HumanReview]
      summary: Complete workflow human review task
      operationId: actHumanReviewTask
      parameters:
        - in: path
          name: review_task_uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanReviewActionRequest'
      responses:
        '202':
          description: Review action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanReviewTaskResponse'
  /instances/export:
    get:
      tags: [Exports]
      summary: Export workflow execution records
      operationId: exportInstances
      parameters:
        - in: query
          name: definition_uuid
          schema:
            type: string
            format: uuid
        - in: query
          name: state
          schema:
            type: string
        - in: query
