openapi: 3.1.0
info:
  title: Workflow Orchestration Admin API
  version: 0.1.0
  description: >
    Admin endpoints for managing workflow definitions and orchestrating runtime execution.
    All routes require authenticated CoreX administrators with tenant-scoped RBAC.
servers:
  - url: https://{host}/api/v1/admin/workflows
    variables:
      host:
        default: localhost:8077
tags:
  - name: Definitions
  - name: Instances
  - name: Exports
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ResponseMeta:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: success
        timestamp:
          type: integer
          description: Unix epoch seconds
        request_id:
          type: string
    PageResponse:
      type: object
      properties:
        total:
          type: integer
        next_page_token:
          type: string
    WorkflowDefinitionCreateRequest:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          example: onboarding-approval
        description:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowStepDefinition'
        default_retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        compensation_policy:
          $ref: '#/components/schemas/CompensationPolicy'
        sla_policy:
          $ref: '#/components/schemas/SlaPolicy'
        metadata:
          type: object
          additionalProperties: true
    WorkflowDefinition:
      type: object
      required:
        - definition_id
        - name
        - version
        - status
        - steps
      properties:
        definition_id:
          type: string
          format: uuid
        tenant_uuid:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, published, archived]
        default_retry_policy:
          $ref: '#/components/schemas/RetryPolicy'
        compensation_policy:
          $ref: '#/components/schemas/CompensationPolicy'
        sla_policy:
          $ref: '#/components/schemas/SlaPolicy'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepDefinition'
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
    WorkflowStepDefinition:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: Logical identifier within the workflow graph
        display_name:
          type: string
        type:
          type: string
          enum: [agent, system, decision, parallel, human_approval, compensation]
        config:
          type: object
          description: Declarative configuration for the step executor
          additionalProperties: true
        compensatable:
          type: boolean
          default: false
        next_step_ids:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
    RetryPolicy:
      type: object
      properties:
        max_attempts:
          type: integer
          default: 5
        initial_interval_ms:
          type: integer
          default: 30000
        backoff_multiplier:
          type: number
          default: 2
        max_interval_ms:
          type: integer
        jitter_ms:
          type: integer
    CompensationPolicy:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        require_manual_approval:
          type: boolean
          default: false
        max_concurrent:
          type: integer
          default: 1
        escalation_channel:
          type: string
    SlaPolicy:
      type: object
      properties:
        step_timeout_seconds:
          type: integer
        overall_timeout_seconds:
          type: integer
        heartbeat_interval_seconds:
          type: integer
    WorkflowInstanceCreateRequest:
      type: object
      required: [definition_id]
      properties:
        definition_id:
          type: string
          format: uuid
        definition_version:
          type: integer
          description: Optional explicit version; defaults to latest published
        input:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties:
            type: string
        correlation_id:
          type: string
    WorkflowInstance:
      type: object
      required: [instance_id, definition_id, state]
      properties:
        instance_id:
          type: string
          format: uuid
        tenant_uuid:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        definition_version:
          type: integer
        state:
          type: string
          enum:
            [
              draft,
              running,
              waiting,
              suspended,
              succeeded,
              failed,
              compensating,
              compensated,
              canceled,
              compensation_failed
            ]
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        sla:
          $ref: '#/components/schemas/SlaSnapshot'
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        tags:
          type: object
          additionalProperties:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStepSummary'
    WorkflowStepSummary:
      type: object
      properties:
        step_record_id:
          type: string
          format: uuid
        step_id:
          type: string
        type:
          type: string
          enum: [agent, system, decision, parallel, human_approval, compensation]
        state:
          type: string
          enum: [queued, in_progress, waiting, completed, failed, compensating, compensated]
        subject_type:
          type: string
          enum: [system, agent, human]
        subject_id:
          type: string
        tool_grant_version:
          type: integer
        attempt:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        payload_in:
          type: object
          additionalProperties: true
        payload_out:
          type: object
          additionalProperties: true
        failure_reason:
          type: string
        awaiting_manual_approval:
          type: boolean
    SlaSnapshot:
      type: object
      properties:
        overall_deadline:
          type: string
          format: date-time
        next_heartbeat_due:
          type: string
          format: date-time
        breached:
          type: boolean
        breaches:
          type: array
          items:
            $ref: '#/components/schemas/SlaBreach'
    SlaBreach:
      type: object
      properties:
        metric:
          type: string
        occurred_at:
          type: string
          format: date-time
        details:
          type: string
    ManualActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pause, resume, cancel, retry_step, reassign_step, trigger_compensation]
        step_id:
          type: string
        assignment_id:
          type: string
        reason:
          type: string
        payload:
          type: object
          additionalProperties: true
    DefinitionResponse:
      type: object
      required: [meta, definition]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
    InstanceResponse:
      type: object
      required: [meta, instance]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        instance:
          $ref: '#/components/schemas/WorkflowInstance'
    ListDefinitionsResponse:
      type: object
      required: [meta, page, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        page:
          $ref: '#/components/schemas/PageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
    ListInstancesResponse:
      type: object
      required: [meta, page, items]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        page:
          $ref: '#/components/schemas/PageResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowInstance'
    ExportResponse:
      type: object
      required: [meta, rows]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
        download_url:
          type: string
          format: uri
    ExportRow:
      type: object
      properties:
        instance_id:
          type: string
        definition_id:
          type: string
        definition_version:
          type: integer
        state:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        tenant_uuid:
          type: string
        correlation_id:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              step_id:
                type: string
              type:
                type: string
              state:
                type: string
              subject_type:
                type: string
              subject_id:
                type: string
              attempts:
                type: integer
              tool_grant_version:
                type: integer
              last_transition_at:
                type: string
                format: date-time
              last_error:
                type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
paths:
  /definitions:
    post:
      tags: [Definitions]
      summary: Create workflow definition
      operationId: createDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinitionCreateRequest'
      responses:
        '201':
          description: Definition created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Definitions]
      summary: List workflow definitions
      operationId: listDefinitions
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, published, archived]
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Definitions page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDefinitionsResponse'
  /definitions/{definitionId}:
    get:
      tags: [Definitions]
      summary: Get workflow definition
      operationId: getDefinition
      parameters:
        - in: path
          name: definitionId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: version
          schema:
            type: integer
      responses:
        '200':
          description: Definition detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '404':
          description: Definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /definitions/{definitionId}/publish:
    post:
      tags: [Definitions]
      summary: Publish workflow definition
      operationId: publishDefinition
      parameters:
        - in: path
          name: definitionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                change_note:
                  type: string
      responses:
        '200':
          description: Definition published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
        '409':
          description: Definition already published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /definitions/{definitionId}/archive:
    post:
      tags: [Definitions]
      summary: Archive workflow definition
      operationId: archiveDefinition
      parameters:
        - in: path
          name: definitionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Definition archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefinitionResponse'
  /instances:
    post:
      tags: [Instances]
      summary: Start workflow instance
      operationId: startInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowInstanceCreateRequest'
      responses:
        '202':
          description: Instance accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
    get:
      tags: [Instances]
      summary: List workflow instances
      operationId: listInstances
      parameters:
        - in: query
          name: definition_id
          schema:
            type: string
            format: uuid
        - in: query
          name: state
          schema:
            type: string
            enum:
              [
                draft,
                running,
                waiting,
                suspended,
                succeeded,
                failed,
                compensating,
                compensated,
                canceled,
                compensation_failed
              ]
        - in: query
          name: agent_id
          schema:
            type: string
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
        - in: query
          name: include_steps
          schema:
            type: boolean
            default: false
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Instances page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
  /instances/{instanceId}:
    get:
      tags: [Instances]
      summary: Get workflow instance
      operationId: getInstance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: include_steps
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Instance detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '404':
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /instances/{instanceId}/actions:
    post:
      tags: [Instances]
      summary: Execute manual control action
      operationId: controlInstance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActionRequest'
      responses:
        '202':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
        '409':
          description: Action rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /instances/export:
    get:
      tags: [Exports]
      summary: Export workflow execution records
      operationId: exportInstances
      parameters:
        - in: query
          name: definition_id
          schema:
            type: string
            format: uuid
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: created_from
          schema:
            type: string
            format: date-time
        - in: query
          name: created_to
          schema:
            type: string
            format: date-time
        - in: query
          name: include_step_details
          schema:
            type: boolean
            default: true
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, json]
            default: csv
      responses:
        '200':
          description: Export payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
