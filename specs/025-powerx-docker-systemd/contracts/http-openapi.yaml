openapi: 3.0.3
info:
  title: PowerX Ops Admin API
  version: 0.1.0
  description: Deploy / Plugin / Backup management APIs for P0 operations console.
servers:
  - url: /api/v1
paths:
  /admin/setup/status:
    get:
      summary: Get first-install setup status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatus'
  /admin/setup/config:
    get:
      summary: Get first-install setup config draft
      responses:
        '200':
          description: OK
    put:
      summary: Save first-install setup config draft
      responses:
        '200':
          description: Accepted
  /admin/setup/complete:
    post:
      summary: Mark first-install setup completed
      responses:
        '200':
          description: Accepted
  /admin/deploy/releases:
    get:
      summary: List deploy release records
      responses:
        '200':
          description: OK
        '503':
          description: SYSTEM_NOT_INSTALLED
    post:
      summary: Trigger a release action
      responses:
        '200':
          description: Accepted
  /admin/deploy/rollback:
    post:
      summary: Trigger rollback to target version
      responses:
        '200':
          description: Accepted
  /admin/deploy/health:
    get:
      summary: Get aggregated deploy health status
      responses:
        '200':
          description: OK
  /admin/plugins/{pluginId}/audit:
    get:
      summary: Get plugin lifecycle audit timeline
      parameters:
        - in: path
          name: pluginId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/backup/policies:
    get:
      summary: List backup policies
      responses:
        '200':
          description: OK
    post:
      summary: Create or update backup policy
      responses:
        '200':
          description: Accepted
  /admin/backup/jobs/run:
    post:
      summary: Trigger backup job manually
      responses:
        '200':
          description: Accepted
  /admin/backup/jobs:
    get:
      summary: List backup jobs
      responses:
        '200':
          description: OK
  /admin/backup/cleanup:
    post:
      summary: Trigger backup cleanup
      responses:
        '200':
          description: Accepted
  /admin/backup/restore-drills/run:
    post:
      summary: Trigger restore drill
      responses:
        '200':
          description: Accepted
  /admin/migration/runbooks/run:
    post:
      summary: Trigger instance migration runbook
      responses:
        '200':
          description: Accepted
  /admin/migration/runbooks/{migrationId}:
    get:
      summary: Get migration runbook record
      parameters:
        - in: path
          name: migrationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /admin/migration/runbooks/{migrationId}/acceptance:
    post:
      summary: Submit migration acceptance result
      parameters:
        - in: path
          name: migrationId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Accepted
  /admin/migration/traffic/switch:
    post:
      summary: Trigger migration traffic switch or rollback
      responses:
        '200':
          description: Accepted
components:
  schemas:
    SetupStatus:
      type: object
      properties:
        configured:
          type: boolean
        requires_login:
          type: boolean
        install_status:
          type: string
          enum: [uninstalled, configuring, installed]
        guard_mode:
          type: string
        version:
          type: string
        checks:
          type: object
    DeployReleaseRecord:
      type: object
      properties:
        id:
          type: string
        environment:
          type: string
        backend_version:
          type: string
        web_admin_version:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
    BackupJob:
      type: object
      properties:
        id:
          type: string
        policy_id:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
    RestoreDrillRecord:
      type: object
      properties:
        id:
          type: string
        source_job_id:
          type: string
        status:
          type: string
        rto_seconds:
          type: integer
    MigrationRunbookRecord:
      type: object
      properties:
        id:
          type: string
        source_env:
          type: string
        target_env:
          type: string
        status:
          type: string
        db_migration_status:
          type: string
        instance_acceptance_status:
          type: string
        traffic_switch_status:
          type: string
        traffic_rollback_status:
          type: string
        dry_run:
          type: boolean
        summary:
          type: string
    SetupConfig:
      type: object
      properties:
        domain:
          type: object
        https:
          type: object
        storage:
          type: object
        cache:
          type: object
        email:
          type: object
        ports:
          type: object
          properties:
            backend_port:
              type: integer
              minimum: 1
              maximum: 65535
            web_admin_port:
              type: integer
              minimum: 1
              maximum: 65535
