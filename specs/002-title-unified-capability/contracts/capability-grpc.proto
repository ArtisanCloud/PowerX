syntax = "proto3";

package powerx.capability.v1;

option go_package = "github.com/ArtisanCloud/PowerX/api/grpc/gen/go/powerx/capability/v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// CapabilityRegistryService 提供能力契约与版本策略的读写接口。
service CapabilityRegistryService {
  // 获取指定能力版本的契约。
  rpc GetCapability(GetCapabilityRequest) returns (CapabilityContract) {}

  // 分页查询契约列表。
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse) {}

  // 创建或更新契约草稿（仅供内部使用）。
  rpc UpsertCapability(UpsertCapabilityRequest) returns (CapabilityContract) {}

  // 发布契约，执行所有校验流程。
  rpc PublishCapability(PublishCapabilityRequest) returns (PublishCapabilityResponse) {}

  // 废弃契约并广播事件。
  rpc DeprecateCapability(DeprecateCapabilityRequest) returns (CapabilityContract) {}

  // 获取版本策略。
  rpc GetVersionPolicy(GetVersionPolicyRequest) returns (CapabilityVersionPolicy) {}

  // 设置版本策略。
  rpc UpsertVersionPolicy(UpsertVersionPolicyRequest) returns (CapabilityVersionPolicy) {}

  // 查询传输配置，用于 Router/Adapter。
  rpc ListTransportProfiles(ListTransportProfilesRequest) returns (ListTransportProfilesResponse) {}
}

message GetCapabilityRequest {
  string capability_key = 1;
  string version = 2;
  string tenant_id = 3;
}

message ListCapabilitiesRequest {
  string capability_key = 1;
  string tenant_id = 2;
  string lifecycle_state = 3;
  TransportKind transport_filter = 4;
  int32 page_size = 5;
  string page_token = 6;
}

message ListCapabilitiesResponse {
  repeated CapabilityContract items = 1;
  string next_page_token = 2;
}

message UpsertCapabilityRequest {
  CapabilityContract contract = 1;
}

message PublishCapabilityRequest {
  string capability_key = 1;
  string version = 2;
  google.protobuf.Timestamp effective_at = 3;
  string notes = 4;
}

message PublishCapabilityResponse {
  CapabilityContract contract = 1;
  repeated ValidationIssue issues = 2;
}

message DeprecateCapabilityRequest {
  string capability_key = 1;
  string version = 2;
  google.protobuf.Timestamp deprecated_at = 3;
  string replacement_capability = 4;
  string advisory_message = 5;
}

message ListTransportProfilesRequest {
  string capability_key = 1;
  string version = 2;
}

message ListTransportProfilesResponse {
  repeated TransportProfile transports = 1;
}

message GetVersionPolicyRequest {
  string capability_key = 1;
}

message UpsertVersionPolicyRequest {
  CapabilityVersionPolicy policy = 1;
}

message CapabilityContract {
  string capability_key = 1;
  string version = 2;
  string tenant_id = 3;
  string provider_id = 4;
  string display_name = 5;
  string description = 6;
  LifecycleState lifecycle_state = 7;
  string security_scope = 8;
  bool tool_grant_required = 9;
  repeated IOSchemaDescriptor io_schemas = 10;
  repeated TransportPreference transport_preferences = 11;
  repeated ErrorTaxonomyEntry error_taxonomy = 12;
  google.protobuf.Struct observability_config = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  string created_by = 16;
  string updated_by = 17;
}

message IOSchemaDescriptor {
  IOSchemaDirection direction = 1;
  IOSchemaFormat format = 2;
  string schema_uri = 3;
  string schema_hash = 4;
  google.protobuf.Struct validation_rules = 5;
}

message TransportProfile {
  TransportKind transport = 1;
  TransportMode mode = 2;
  int32 timeout_ms = 3;
  RetryPolicy retry = 4;
  bool streaming = 5;
  google.protobuf.Struct qos = 6;
  google.protobuf.Struct endpoint_selector = 7;
  TransportHealthStatus last_health_status = 8;
}

message RetryPolicy {
  int32 max_attempts = 1;
  int32 backoff_ms = 2;
  bool idempotent = 3;
}

message TransportHealthStatus {
  string status = 1; // healthy, degraded, unavailable
  google.protobuf.Timestamp checked_at = 2;
  ErrorTaxonomyEntry last_error = 3;
}

message TransportPreference {
  TransportKind transport = 1;
  TransportMode mode = 2;
}

message CapabilityVersionPolicy {
  string capability_key = 1;
  VersionStrategy default_strategy = 2;
  repeated VersionRule allowed_versions = 3;
  google.protobuf.Struct compatibility_matrix = 4;
  DeprecationPolicy deprecation_policy = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message VersionRule {
  string version = 1;
  repeated string compatible_with = 2;
  VersionStatus status = 3;
}

message DeprecationPolicy {
  int32 warning_period_days = 1;
  int32 auto_deprecate_after_days = 2;
  repeated string notify_channels = 3;
}

message ValidationIssue {
  string code = 1;
  string message = 2;
  ErrorSeverity severity = 3;
  google.protobuf.Struct details = 4;
}

message ErrorTaxonomyEntry {
  string namespace = 1;
  string category = 2;
  string code = 3;
  ErrorSeverity severity = 4;
  ErrorStage stage = 5;
  int32 http_status = 6;
  int32 grpc_status = 7;
  string suggested_action = 8;
}

enum LifecycleState {
  LIFECYCLE_STATE_UNSPECIFIED = 0;
  LIFECYCLE_STATE_DRAFT = 1;
  LIFECYCLE_STATE_PUBLISHED = 2;
  LIFECYCLE_STATE_DEPRECATED = 3;
}

enum TransportKind {
  TRANSPORT_KIND_UNSPECIFIED = 0;
  TRANSPORT_KIND_HTTP = 1;
  TRANSPORT_KIND_GRPC = 2;
  TRANSPORT_KIND_MCP = 3;
  TRANSPORT_KIND_AGENT = 4;
}

enum TransportMode {
  TRANSPORT_MODE_UNSPECIFIED = 0;
  TRANSPORT_MODE_PREFER = 1;
  TRANSPORT_MODE_ONLY = 2;
  TRANSPORT_MODE_FALLBACK = 3;
}

enum IOSchemaDirection {
  IO_SCHEMA_DIRECTION_UNSPECIFIED = 0;
  IO_SCHEMA_DIRECTION_INPUT = 1;
  IO_SCHEMA_DIRECTION_OUTPUT = 2;
}

enum IOSchemaFormat {
  IO_SCHEMA_FORMAT_UNSPECIFIED = 0;
  IO_SCHEMA_FORMAT_JSON_SCHEMA = 1;
  IO_SCHEMA_FORMAT_PROTOBUF = 2;
  IO_SCHEMA_FORMAT_AVRO = 3;
}

enum VersionStrategy {
  VERSION_STRATEGY_UNSPECIFIED = 0;
  VERSION_STRATEGY_LATEST_MINOR = 1;
  VERSION_STRATEGY_FIXED_MAJOR = 2;
  VERSION_STRATEGY_CUSTOM = 3;
}

enum VersionStatus {
  VERSION_STATUS_UNSPECIFIED = 0;
  VERSION_STATUS_ACTIVE = 1;
  VERSION_STATUS_DEPRECATED = 2;
  VERSION_STATUS_BLOCKED = 3;
}

enum ErrorSeverity {
  ERROR_SEVERITY_UNSPECIFIED = 0;
  ERROR_SEVERITY_INFO = 1;
  ERROR_SEVERITY_WARNING = 2;
  ERROR_SEVERITY_ERROR = 3;
  ERROR_SEVERITY_FATAL = 4;
}

enum ErrorStage {
  ERROR_STAGE_UNSPECIFIED = 0;
  ERROR_STAGE_VALIDATE = 1;
  ERROR_STAGE_INVOKE = 2;
  ERROR_STAGE_STREAM = 3;
  ERROR_STAGE_OBSERVE = 4;
}
