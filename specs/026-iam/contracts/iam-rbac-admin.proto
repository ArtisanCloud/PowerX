syntax = "proto3";

package powerx.iam.v1;

option go_package = "github.com/ArtisanCloud/PowerX/backend/api/grpc/gen/go/powerx/iam/v1;iamv1";

service IamRbacAdminService {
  rpc GetMeContext(GetMeContextRequest) returns (GetMeContextResponse);
  rpc SwitchTenant(SwitchTenantRequest) returns (SwitchTenantResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc SignupSaaSTenant(SignupSaaSTenantRequest) returns (SignupSaaSTenantResponse);
  rpc GetEffectiveRegistrationPolicy(GetEffectiveRegistrationPolicyRequest) returns (RegistrationPolicyEffectiveResponse);
  rpc GetRegistrationPolicy(GetRegistrationPolicyRequest) returns (RegistrationPolicyResponse);
  rpc UpsertRegistrationPolicyDraft(UpsertRegistrationPolicyDraftRequest) returns (RegistrationPolicyResponse);
  rpc ActivateRegistrationPolicy(ActivateRegistrationPolicyRequest) returns (RegistrationPolicyResponse);
  rpc CreateRegistrationInviteBatch(CreateRegistrationInviteBatchRequest) returns (RegistrationInviteBatchResponse);
  rpc GenerateRegistrationInviteCodes(GenerateRegistrationInviteCodesRequest) returns (GenerateRegistrationInviteCodesResponse);
  rpc SubmitRegistrationRequest(SubmitRegistrationRequestRequest) returns (RegistrationRequestResponse);
  rpc ApproveRegistrationRequest(ApproveRegistrationRequestRequest) returns (RegistrationRequestResponse);
  rpc RejectRegistrationRequest(RejectRegistrationRequestRequest) returns (RegistrationRequestResponse);
  rpc GetIAMMigrationReport(GetIAMMigrationReportRequest) returns (IAMMigrationReportResponse);
  rpc FixMissingTenantOwner(FixMissingTenantOwnerRequest) returns (IAMMigrationFixOwnerResponse);
  rpc StartRootSupportSession(StartRootSupportSessionRequest) returns (RootSupportSessionResponse);
  rpc EndRootSupportSession(EndRootSupportSessionRequest) returns (RootSupportSessionResponse);
  rpc ListTenantPluginInstances(ListTenantPluginInstancesRequest) returns (ListTenantPluginInstancesResponse);
}

message GetMeContextRequest {}

message SwitchTenantRequest {
  string tenant_uuid = 1;
}

message SwitchTenantResponse {
  string token_type = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
  string scope = 5;
  GetMeContextResponse context = 6;
}

message CheckPermissionRequest {
  string resource = 1;
  string action = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason = 2;
}

message GetMeContextResponse {
  bool is_root = 1;
  string current_tenant_uuid = 2;
  int64 current_member_id = 3;
  UserSummary user = 4;
  repeated TenantMembership members = 5;
  string current_member_uuid = 6;
}

message UserSummary {
  int64 id = 1;
  string email = 2;
  string display_name = 3;
  int32 status = 4;
  bool is_root = 5;
}

message TenantMembership {
  string tenant_uuid = 1;
  string tenant_name = 2;
  int64 member_id = 3;
  bool is_admin = 4;
  string member_uuid = 5;
  bool is_owner = 6;
}

message SignupSaaSTenantRequest {
  string tenant_key = 1;
  string tenant_name = 2;
  string plan = 3;
  string owner_email = 4;
  string owner_phone = 5;
  string owner_password = 6;
  string owner_display_name = 7;
  string verification_code = 8;
  string invite_code = 9;
  string channel = 10;
  string campaign = 11;
  string registration_request_uuid = 12;
}

message SignupSaaSTenantResponse {
  string access_token = 1;
  string refresh_token = 2;
  GetMeContextResponse context = 3;
}

message GetEffectiveRegistrationPolicyRequest {}

message RegistrationPolicyEffectiveResponse {
  string mode = 1;
  bool requires_verification = 2;
  bool requires_invite_code = 3;
  bool requires_root_approval = 4;
  bool accepts_registration_request = 5;
  string reason_code = 6;
}

message GetRegistrationPolicyRequest {}

message RegistrationPolicyResponse {
  string uuid = 1;
  int64 version = 2;
  string mode = 3;
  string status = 4;
  bool requires_verification = 5;
  bool requires_invite_code = 6;
  bool requires_root_approval = 7;
  int64 daily_tenant_quota = 8;
  int64 total_tenant_quota = 9;
  string start_at = 10;
  string end_at = 11;
  repeated RegistrationPolicyRule rules = 12;
}

message UpsertRegistrationPolicyDraftRequest {
  string mode = 1;
  bool requires_verification = 2;
  bool requires_invite_code = 3;
  bool requires_root_approval = 4;
  int64 daily_tenant_quota = 5;
  int64 total_tenant_quota = 6;
  string start_at = 7;
  string end_at = 8;
  repeated RegistrationPolicyRule rules = 9;
}

message ActivateRegistrationPolicyRequest {
  string policy_uuid = 1;
}

message RegistrationPolicyRule {
  string type = 1;
  repeated string values = 2;
  string batch_uuid = 3;
  int64 value = 4;
  string seed = 5;
}

message CreateRegistrationInviteBatchRequest {
  string name = 1;
  int64 max_codes = 2;
  int64 max_uses_per_code = 3;
  string allowed_plan = 4;
  repeated string allowed_email_domains = 5;
  repeated string allowed_channels = 6;
  string starts_at = 7;
  string expires_at = 8;
}

message RegistrationInviteBatchResponse {
  string uuid = 1;
  string name = 2;
  string status = 3;
  int64 max_codes = 4;
  int64 max_uses_per_code = 5;
}

message GenerateRegistrationInviteCodesRequest {
  string batch_uuid = 1;
  int64 count = 2;
}

message GenerateRegistrationInviteCodesResponse {
  string batch_uuid = 1;
  repeated string plain_codes = 2;
}

message SubmitRegistrationRequestRequest {
  string tenant_key = 1;
  string tenant_name = 2;
  string plan = 3;
  string owner_email = 4;
  string owner_phone = 5;
  string owner_display_name = 6;
  string invite_code = 7;
  string channel = 8;
  string campaign = 9;
}

message ApproveRegistrationRequestRequest {
  string request_uuid = 1;
}

message RejectRegistrationRequestRequest {
  string request_uuid = 1;
  string reason_code = 2;
}

message RegistrationRequestResponse {
  string uuid = 1;
  string mode = 2;
  string status = 3;
  string tenant_name = 4;
  string tenant_key = 5;
  string policy_uuid = 6;
  int64 policy_version = 7;
  string created_tenant_uuid = 8;
  string reject_reason_code = 9;
}

message GetIAMMigrationReportRequest {}

message FixMissingTenantOwnerRequest {
  bool dry_run = 1;
}

message IAMMigrationReportResponse {
  repeated UserSummary root_users = 1;
  string system_tenant_status = 2;
  string root_system_member_status = 3;
  repeated string tenant_owner_missing = 4;
  repeated string tenant_admin_missing = 5;
  repeated string auto_fix_candidates = 6;
  repeated string manual_fix_required = 7;
}

message IAMMigrationFixOwnerResponse {
  repeated string fixed_tenant_uuids = 1;
  IAMMigrationReportResponse report = 2;
}

message StartRootSupportSessionRequest {
  string target_tenant_uuid = 1;
  string reason = 2;
  string mode = 3;
}

message EndRootSupportSessionRequest {
  int64 id = 1;
}

message RootSupportSessionResponse {
  int64 id = 1;
  int64 root_user_id = 2;
  string target_tenant_uuid = 3;
  string reason = 4;
  string mode = 5;
  string status = 6;
  string started_at = 7;
  string ended_at = 8;
}

message ListTenantPluginInstancesRequest {}

message ListTenantPluginInstancesResponse {
  repeated TenantPluginInstance items = 1;
}

message TenantPluginInstance {
  string tenant_uuid = 1;
  string plugin_id = 2;
  string version = 3;
  bool enabled = 4;
}
