openapi: 3.0.3
info:
  title: PowerX IAM User Role RBAC Admin API
  version: "0.2.0"
  description: HTTP contract for IAM role boundaries, SaaS signup, root support sessions, tenant plugin isolation, and me/context consistency.
servers:
  - url: https://api.powerx.local/api/v1
paths:
  /public/saas/registration-policy/effective:
    get:
      summary: Get effective SaaS tenant registration policy for public signup UI
      operationId: getEffectiveSaaSRegistrationPolicy
      tags: [SaaSRegistrationPolicy]
      responses:
        '200':
          description: Public-safe effective registration policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyEffectiveResponse'
        '503':
          description: Registration policy is not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/saas/registration-requests:
    post:
      summary: Submit waitlist or approval-required registration request
      operationId: submitSaaSRegistrationRequest
      tags: [SaaSRegistrationPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequestCreateRequest'
      responses:
        '202':
          description: Registration request accepted for waitlist or review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestResponse'
        '400':
          description: Invalid request or current policy does not accept requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/saas/signup/verification-code:
    post:
      summary: Send SaaS signup verification code
      operationId: sendSaaSSignupVerificationCode
      tags: [SaaSSignup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaaSSignupVerificationCodeRequest'
      responses:
        '200':
          description: Verification code sent
        '400':
          description: Invalid contact or registration policy rejected verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/saas/signup:
    post:
      summary: Create a SaaS tenant and bootstrap owner/admin member
      operationId: signupSaaSTenant
      tags: [SaaSSignup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaaSSignupRequest'
      responses:
        '200':
          description: Tenant created and current context issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaaSSignupResponse'
        '400':
          description: Invalid request or duplicate tenant key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant key or account conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Registration is closed, waitlisted, approval-required, quota-limited, or invite-gated by active policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/registration-policy:
    get:
      summary: Get current tenant registration policy
      operationId: getTenantRegistrationPolicy
      tags: [SaaSRegistrationAdmin]
      responses:
        '200':
          description: Current registration policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyAdminResponse'
    put:
      summary: Create a draft tenant registration policy version
      operationId: updateTenantRegistrationPolicyDraft
      tags: [SaaSRegistrationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationPolicyUpdateRequest'
      responses:
        '200':
          description: Draft policy created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyAdminResponse'
  /admin/registration-policy/history:
    get:
      summary: List tenant registration policy versions
      operationId: listTenantRegistrationPolicyHistory
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Registration policy version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyHistoryResponse'
  /admin/registration-policy/activate:
    post:
      summary: Activate a tenant registration policy version
      operationId: activateTenantRegistrationPolicy
      tags: [SaaSRegistrationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_uuid]
              properties:
                policy_uuid:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Policy activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPolicyAdminResponse'
  /admin/registration-invite-batches:
    get:
      summary: List registration invite batches
      operationId: listRegistrationInviteBatches
      tags: [SaaSRegistrationAdmin]
      responses:
        '200':
          description: Invite batch list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteBatchListResponse'
    post:
      summary: Create registration invite batch
      operationId: createRegistrationInviteBatch
      tags: [SaaSRegistrationAdmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInviteBatchCreateRequest'
      responses:
        '201':
          description: Invite batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteBatchResponse'
    delete:
      summary: Delete unused registration invite batches
      operationId: deleteRegistrationInviteBatches
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        '200':
          description: Invite batches deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteBatchDeleteResponse'
  /admin/registration-invite-batches/{batch_uuid}/codes:
    get:
      summary: List saved invite codes for a registration invite batch
      operationId: listRegistrationInviteCodes
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 }
      responses:
        '200':
          description: Saved invite code list for root administration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteCodeListResponse'
    post:
      summary: Generate invite codes for a registration invite batch
      operationId: generateRegistrationInviteCodes
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        '201':
          description: Invite codes generated and saved to the batch for root administration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteCodeGenerateResponse'
  /admin/registration-invite-batches/{batch_uuid}/codes/reset-missing-plain:
    post:
      summary: Reset missing plaintext for unused invite codes in a batch
      operationId: resetMissingPlainRegistrationInviteCodes
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Missing plaintext was regenerated for unused active codes, and the refreshed code list is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteCodeListResponse'
  /admin/registration-invite-batches/{batch_uuid}/pause:
    post:
      summary: Pause a registration invite batch
      operationId: pauseRegistrationInviteBatch
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invite batch paused
  /admin/registration-invite-batches/{batch_uuid}/revoke:
    post:
      summary: Revoke a registration invite batch
      operationId: revokeRegistrationInviteBatch
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: batch_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Invite batch revoked
  /admin/registration-requests:
    get:
      summary: List waitlist and approval registration requests
      operationId: listRegistrationRequests
      tags: [SaaSRegistrationAdmin]
      responses:
        '200':
          description: Registration request list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestListResponse'
  /admin/registration-requests/{request_uuid}/approve:
    post:
      summary: Approve registration request and create tenant when required
      operationId: approveRegistrationRequest
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Registration request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestResponse'
  /admin/registration-requests/{request_uuid}/reject:
    post:
      summary: Reject registration request
      operationId: rejectRegistrationRequest
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string }
      responses:
        '200':
          description: Registration request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationRequestResponse'
  /admin/registration-requests/{request_uuid}/issue-invite:
    post:
      summary: Issue invite code from a registration request
      operationId: issueInviteForRegistrationRequest
      tags: [SaaSRegistrationAdmin]
      parameters:
        - name: request_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Invite code issued and saved for root administration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationInviteCodeGenerateResponse'
  /tenant/iam/roles:
    get:
      summary: List bindable tenant roles for plugin service workflows
      operationId: listTenantProvisionRoles
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token. The result includes only bindable roles for provisioning:
        role_user and plugin-managed roles. It does not expose admin, owner,
        root, system, or numeric role identifiers.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: include_builtin
          in: query
          schema: { type: boolean, default: true }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Bindable role page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionRoleListResponse'
        '400':
          description: Invalid role list request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/iam/roles/provision:
    post:
      summary: Provision a plugin-managed tenant role
      operationId: provisionTenantRole
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token and cannot be supplied in the request body. Role codes
        must use the plugin_ prefix and cannot create owner, admin, system, root,
        builtin, or unrestricted roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMProvisionRoleRequest'
      responses:
        '201':
          description: Role provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionRoleResponse'
        '400':
          description: Invalid role provisioning request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/iam/members/provision:
    post:
      summary: Provision a tenant user and member for plugin service workflows
      operationId: provisionTenantMember
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token and cannot be supplied in the request body. New users need
        an initial password. Existing users are matched by email. The endpoint
        cannot create root or system administrator users and can bind only
        role_user or plugin-managed roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMProvisionMemberRequest'
      responses:
        '201':
          description: Member provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionMemberResponse'
        '400':
          description: Invalid member provisioning request or provisioning conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/auth/me/context:
    get:
      summary: Get current identity context for UI routing
      operationId: getMeContext
      tags: [AuthContext]
      responses:
        '200':
          description: Current context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeContextResponse'
  /admin/user/auth/me/switch-tenant:
    post:
      summary: Switch current tenant context
      operationId: switchTenant
      tags: [AuthContext]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_uuid]
              properties:
                tenant_uuid:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tenant switched and tokens reissued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchTenantResponse'
        '403':
          description: Tenant not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/auth/me/tenants:
    get:
      summary: List tenants available for current user
      operationId: listMeTenants
      tags: [AuthContext]
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberTenant'
  /admin/iam/members:
    get:
      summary: List members in current tenant scope
      operationId: listTenantMembers
      tags: [IAMMembers]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Member page
  /admin/iam/users/{user_id}/member:
    get:
      summary: Get member record of user within current tenant
      operationId: getMemberByUser
      tags: [IAMMembers]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User member in current tenant
        '404':
          description: Member not found in current tenant
  /admin/iam/roles/{id}/permissions:
    get:
      summary: List permissions bound to role
      operationId: listRolePermissions
      tags: [IAMRoles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Permissions list
  /admin/iam/me/check:
    get:
      summary: Check permission for current principal
      operationId: checkPermission
      tags: [IAMRBAC]
      parameters:
        - name: permission
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: resource
          in: query
          required: false
          schema: { type: string }
        - name: module
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Permission decision
  /admin/iam/migration/report:
    get:
      summary: Inspect existing IAM data before SaaS semantic migration
      operationId: getIAMMigrationReport
      tags: [IAMMigration]
      responses:
        '200':
          description: Migration inspection report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMMigrationReportResponse'
  /admin/iam/migration/fix-owner:
    post:
      summary: Auto-fill tenant owner role for deterministic candidates
      operationId: fixMissingTenantOwner
      tags: [IAMMigration]
      responses:
        '200':
          description: Owner role auto-fix result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMMigrationFixOwnerResponse'
        '403':
          description: Caller is not root
  /admin/root/support-sessions:
    post:
      summary: Start a root support session for a target tenant
      operationId: startRootSupportSession
      tags: [RootSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootSupportSessionCreateRequest'
      responses:
        '200':
          description: Support session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSupportSessionResponse'
        '403':
          description: Caller is not root
        '404':
          description: Target tenant not found
  /admin/root/support-sessions/{id}/end:
    post:
      summary: End a root support session
      operationId: endRootSupportSession
      tags: [RootSupport]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Support session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSupportSessionResponse'
        '403':
          description: Caller is not root
        '404':
          description: Support session not found
  /admin/plugins/tenant-instances:
    get:
      summary: List plugin instances enabled for current tenant
      operationId: listTenantPluginInstances
      tags: [TenantPlugins]
      responses:
        '200':
          description: Tenant plugin instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPluginInstanceListResponse'
  /admin/plugins/tenant-instances/{plugin_id}/enable:
    post:
      summary: Enable a plugin package for current tenant
      operationId: enableTenantPluginInstance
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plugin enabled for tenant
  /admin/plugins/tenant-instances/{plugin_id}/disable:
    post:
      summary: Disable a plugin package for current tenant
      operationId: disableTenantPluginInstance
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plugin disabled for tenant
  /admin/plugins/{plugin_id}/uninstall:
    post:
      summary: Uninstall a global plugin package
      operationId: uninstallGlobalPluginPackage
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Global plugin package uninstalled
        '409':
          description: Plugin still has tenant instances and requires drain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/plugins/{plugin_id}/drain:
    post:
      summary: Create a root controlled plugin drain plan
      operationId: createPluginDrainJob
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginDrainJobCreateRequest'
      responses:
        '200':
          description: Drain job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobResponse'
        '403':
          description: Caller is not root
    get:
      summary: List root controlled plugin drain plans
      operationId: listPluginDrainJobs
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Drain jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobListResponse'
  /admin/plugins/drain/{job_id}:
    get:
      summary: Get a root controlled plugin drain plan
      operationId: getPluginDrainJob
      tags: [TenantPlugins]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Drain job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobResponse'
        '404':
          description: Drain job not found
components:
  securitySchemes:
    StsTenantJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PowerX STS token with issuer powerx-sts and audience powerx:api.
  schemas:
    MeContextResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/MeContext'
    MeContext:
      type: object
      required: [is_root, members]
      properties:
        is_root: { type: boolean }
        current_tenant_uuid:
          type: string
          format: uuid
          nullable: true
        current_member_id:
          type: integer
          nullable: true
        user:
          $ref: '#/components/schemas/UserSummary'
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberTenant'
    UserSummary:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        display_name: { type: string }
        status: { type: integer }
        is_root: { type: boolean }
    MemberTenant:
      type: object
      properties:
        tenant_uuid:
          type: string
          format: uuid
        tenant_name: { type: string }
        member_id: { type: integer }
        member_uuid:
          type: string
          format: uuid
        is_admin: { type: boolean }
        is_owner: { type: boolean }
    SaaSSignupRequest:
      type: object
      required: [tenant_name, owner_password]
      properties:
        tenant_key:
          type: string
          description: Optional. If omitted, generated from tenant_name; if provided, it must be globally unique.
        tenant_name: { type: string }
        plan: { type: string, default: free }
        owner_email: { type: string }
        owner_phone: { type: string }
        owner_password: { type: string, format: password }
        owner_display_name: { type: string }
        verification_code:
          type: string
          description: Required only when active registration policy requires verification.
        invite_code:
          type: string
          description: Required when active registration policy is invite_only or requires an invite code.
        channel:
          type: string
          description: Structured signup channel used by allowlist or rollout rules.
        campaign:
          type: string
          description: Structured signup campaign used by rollout audit and rules.
        registration_request_uuid:
          type: string
          format: uuid
          description: Optional approved registration request to convert into a tenant.
    SaaSSignupVerificationCodeRequest:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
          description: Email address or mobile number.
        invite_code:
          type: string
