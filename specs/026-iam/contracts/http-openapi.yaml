openapi: 3.0.3
info:
  title: PowerX IAM User Role RBAC Admin API
  version: "0.2.0"
  description: HTTP contract for IAM role boundaries, SaaS signup, root support sessions, tenant plugin isolation, and me/context consistency.
servers:
  - url: https://api.powerx.local/api/v1
paths:
  /public/saas/signup/verification-code:
    post:
      summary: Send SaaS signup verification code
      operationId: sendSaaSSignupVerificationCode
      tags: [SaaSSignup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaaSSignupVerificationCodeRequest'
      responses:
        '200':
          description: Verification code sent
        '400':
          description: Invalid contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/saas/signup:
    post:
      summary: Create a SaaS tenant and bootstrap owner/admin member
      operationId: signupSaaSTenant
      tags: [SaaSSignup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaaSSignupRequest'
      responses:
        '200':
          description: Tenant created and current context issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaaSSignupResponse'
        '400':
          description: Invalid request or duplicate tenant key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tenant key or account conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/iam/roles:
    get:
      summary: List bindable tenant roles for plugin service workflows
      operationId: listTenantProvisionRoles
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token. The result includes only bindable roles for provisioning:
        role_user and plugin-managed roles. It does not expose admin, owner,
        root, system, or numeric role identifiers.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: include_builtin
          in: query
          schema: { type: boolean, default: true }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Bindable role page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionRoleListResponse'
        '400':
          description: Invalid role list request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/iam/roles/provision:
    post:
      summary: Provision a plugin-managed tenant role
      operationId: provisionTenantRole
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token and cannot be supplied in the request body. Role codes
        must use the plugin_ prefix and cannot create owner, admin, system, root,
        builtin, or unrestricted roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMProvisionRoleRequest'
      responses:
        '201':
          description: Role provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionRoleResponse'
        '400':
          description: Invalid role provisioning request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tenant/iam/members/provision:
    post:
      summary: Provision a tenant user and member for plugin service workflows
      operationId: provisionTenantMember
      tags: [IAMSvcProvisioning]
      security:
        - StsTenantJWT: []
      description: >
        Service-actor endpoint for plugin backends. The tenant is resolved from
        the STS token and cannot be supplied in the request body. New users need
        an initial password. Existing users are matched by email. The endpoint
        cannot create root or system administrator users and can bind only
        role_user or plugin-managed roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IAMProvisionMemberRequest'
      responses:
        '201':
          description: Member provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMProvisionMemberResponse'
        '400':
          description: Invalid member provisioning request or provisioning conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a PowerX STS service actor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/auth/me/context:
    get:
      summary: Get current identity context for UI routing
      operationId: getMeContext
      tags: [AuthContext]
      responses:
        '200':
          description: Current context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeContextResponse'
  /admin/user/auth/me/switch-tenant:
    post:
      summary: Switch current tenant context
      operationId: switchTenant
      tags: [AuthContext]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_uuid]
              properties:
                tenant_uuid:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Tenant switched and tokens reissued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchTenantResponse'
        '403':
          description: Tenant not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/user/auth/me/tenants:
    get:
      summary: List tenants available for current user
      operationId: listMeTenants
      tags: [AuthContext]
      responses:
        '200':
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberTenant'
  /admin/iam/members:
    get:
      summary: List members in current tenant scope
      operationId: listTenantMembers
      tags: [IAMMembers]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Member page
  /admin/iam/users/{user_id}/member:
    get:
      summary: Get member record of user within current tenant
      operationId: getMemberByUser
      tags: [IAMMembers]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: User member in current tenant
        '404':
          description: Member not found in current tenant
  /admin/iam/roles/{id}/permissions:
    get:
      summary: List permissions bound to role
      operationId: listRolePermissions
      tags: [IAMRoles]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Permissions list
  /admin/iam/me/check:
    get:
      summary: Check permission for current principal
      operationId: checkPermission
      tags: [IAMRBAC]
      parameters:
        - name: permission
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: resource
          in: query
          required: false
          schema: { type: string }
        - name: module
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Permission decision
  /admin/iam/migration/report:
    get:
      summary: Inspect existing IAM data before SaaS semantic migration
      operationId: getIAMMigrationReport
      tags: [IAMMigration]
      responses:
        '200':
          description: Migration inspection report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMMigrationReportResponse'
  /admin/iam/migration/fix-owner:
    post:
      summary: Auto-fill tenant owner role for deterministic candidates
      operationId: fixMissingTenantOwner
      tags: [IAMMigration]
      responses:
        '200':
          description: Owner role auto-fix result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IAMMigrationFixOwnerResponse'
        '403':
          description: Caller is not root
  /admin/root/support-sessions:
    post:
      summary: Start a root support session for a target tenant
      operationId: startRootSupportSession
      tags: [RootSupport]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootSupportSessionCreateRequest'
      responses:
        '200':
          description: Support session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSupportSessionResponse'
        '403':
          description: Caller is not root
        '404':
          description: Target tenant not found
  /admin/root/support-sessions/{id}/end:
    post:
      summary: End a root support session
      operationId: endRootSupportSession
      tags: [RootSupport]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Support session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootSupportSessionResponse'
        '403':
          description: Caller is not root
        '404':
          description: Support session not found
  /admin/plugins/tenant-instances:
    get:
      summary: List plugin instances enabled for current tenant
      operationId: listTenantPluginInstances
      tags: [TenantPlugins]
      responses:
        '200':
          description: Tenant plugin instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPluginInstanceListResponse'
  /admin/plugins/tenant-instances/{plugin_id}/enable:
    post:
      summary: Enable a plugin package for current tenant
      operationId: enableTenantPluginInstance
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plugin enabled for tenant
  /admin/plugins/tenant-instances/{plugin_id}/disable:
    post:
      summary: Disable a plugin package for current tenant
      operationId: disableTenantPluginInstance
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Plugin disabled for tenant
  /admin/plugins/{plugin_id}/uninstall:
    post:
      summary: Uninstall a global plugin package
      operationId: uninstallGlobalPluginPackage
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Global plugin package uninstalled
        '409':
          description: Plugin still has tenant instances and requires drain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/plugins/{plugin_id}/drain:
    post:
      summary: Create a root controlled plugin drain plan
      operationId: createPluginDrainJob
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginDrainJobCreateRequest'
      responses:
        '200':
          description: Drain job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobResponse'
        '403':
          description: Caller is not root
    get:
      summary: List root controlled plugin drain plans
      operationId: listPluginDrainJobs
      tags: [TenantPlugins]
      parameters:
        - name: plugin_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: Drain jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobListResponse'
  /admin/plugins/drain/{job_id}:
    get:
      summary: Get a root controlled plugin drain plan
      operationId: getPluginDrainJob
      tags: [TenantPlugins]
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Drain job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginDrainJobResponse'
        '404':
          description: Drain job not found
components:
  securitySchemes:
    StsTenantJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: PowerX STS token with issuer powerx-sts and audience powerx:api.
  schemas:
    MeContextResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/MeContext'
    MeContext:
      type: object
      required: [is_root, members]
      properties:
        is_root: { type: boolean }
        current_tenant_uuid:
          type: string
          format: uuid
          nullable: true
        current_member_id:
          type: integer
          nullable: true
        user:
          $ref: '#/components/schemas/UserSummary'
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberTenant'
    UserSummary:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        display_name: { type: string }
        status: { type: integer }
        is_root: { type: boolean }
    MemberTenant:
      type: object
      properties:
        tenant_uuid:
          type: string
          format: uuid
        tenant_name: { type: string }
        member_id: { type: integer }
        member_uuid:
          type: string
          format: uuid
        is_admin: { type: boolean }
        is_owner: { type: boolean }
    SaaSSignupRequest:
      type: object
      required: [tenant_name, owner_password]
      properties:
        tenant_key:
          type: string
          description: Optional. If omitted, generated from tenant_name; if provided, it must be globally unique.
        tenant_name: { type: string }
        plan: { type: string, default: free }
        owner_email: { type: string }
        owner_phone: { type: string }
        owner_password: { type: string, format: password }
        owner_display_name: { type: string }
        verification_code:
          type: string
          description: Required only when feature_gate.enable_saas_signup_verification_code is enabled.
    SaaSSignupVerificationCodeRequest:
      type: object
      required: [contact]
      properties:
        contact:
          type: string
          description: Email address or mobile number.
    SaaSSignupResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            context:
              $ref: '#/components/schemas/MeContext'
    IAMProvisionRoleRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^plugin_[a-z0-9_]{1,57}$'
          description: Plugin-managed tenant role code. Must start with plugin_.
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 2000
    IAMProvisionRoleResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            payload:
              $ref: '#/components/schemas/IAMProvisionRole'
    IAMProvisionRoleListResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/IAMProvisionRole'
            pagination:
              $ref: '#/components/schemas/Pagination'
    IAMProvisionRole:
      type: object
      required: [role_uuid, code, name, builtin, tenant_uuid]
      properties:
        role_uuid:
          type: string
          format: uuid
        code: { type: string }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
        tenant_uuid:
          type: string
          format: uuid
    IAMProvisionMemberRequest:
      type: object
      required: [username, email, display_name]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,63}$'
        email:
          type: string
          format: email
          maxLength: 128
        display_name:
          type: string
          maxLength: 128
        avatar_url:
          type: string
        status:
          type: string
          enum: [active, enabled, inactive, disabled]
        initial_password:
          type: string
          format: password
          minLength: 8
          description: Required when the email does not already identify an existing user.
        role_codes:
          type: array
          items:
            type: string
          description: Empty means role_user. Non-role_user entries must use the plugin_ prefix.
        source_external_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
    IAMProvisionMemberResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            payload:
              $ref: '#/components/schemas/IAMProvisionMember'
    IAMProvisionMember:
      type: object
      required: [user_uuid, member_uuid, username, email, role_codes, tenant_uuid]
      properties:
        user_uuid:
          type: string
          format: uuid
        member_uuid:
          type: string
          format: uuid
        username: { type: string }
        email:
          type: string
          format: email
        role_codes:
          type: array
          items:
            type: string
        tenant_uuid:
          type: string
          format: uuid
    SwitchTenantResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            token_type:
              type: string
              enum: [Bearer]
            access_token: { type: string }
            refresh_token: { type: string }
            expires_in: { type: integer }
            scope: { type: string }
            context:
              $ref: '#/components/schemas/MeContext'
    RootSupportSessionCreateRequest:
      type: object
      required: [target_tenant_uuid, reason]
      properties:
        target_tenant_uuid:
          type: string
          format: uuid
        reason: { type: string }
        mode:
          type: string
          enum: [read_only, write_enabled]
          default: read_only
    RootSupportSession:
      type: object
      properties:
        id: { type: integer }
        root_user_id: { type: integer }
        target_tenant_uuid:
          type: string
          format: uuid
        reason: { type: string }
        mode:
          type: string
          enum: [read_only, write_enabled]
        status:
          type: string
          enum: [active, ended, revoked]
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
    RootSupportSessionResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/RootSupportSession'
    TenantPluginInstance:
      type: object
      properties:
        tenant_uuid:
          type: string
          format: uuid
        plugin_id: { type: string }
        version: { type: string }
        enabled: { type: boolean }
        status:
          type: string
          enum: [available, subscribed, enabled, disabled, draining_requested, disabled_by_platform, drained, expired]
        drain_job_id:
          type: string
          nullable: true
        config:
          type: object
          additionalProperties: true
    TenantPluginInstanceListResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantPluginInstance'
    PluginDrainJobCreateRequest:
      type: object
      properties:
        version:
          type: string
          description: Optional target version. Empty means all versions for the plugin.
        reason: { type: string }
        mode:
          type: string
          enum: [drain, emergency_disable]
          default: drain
    PluginDrainJob:
      type: object
      properties:
        job_id: { type: string }
        plugin_id: { type: string }
        version: { type: string }
        scope:
          type: string
          enum: [plugin, plugin_version]
        status:
          type: string
          enum: [requested, blocking_new_usage, draining, ready_to_uninstall, completed, failed, cancelled]
        reason: { type: string }
        requested_by_root_user_id: { type: integer }
        affected_tenant_count: { type: integer }
        drained_tenant_count: { type: integer }
        completed_at:
          type: string
          format: date-time
          nullable: true
    PluginDrainJobResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            job:
              $ref: '#/components/schemas/PluginDrainJob'
    PluginDrainJobListResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PluginDrainJob'
    IAMMigrationReportResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: '#/components/schemas/IAMMigrationReport'
    IAMMigrationFixOwnerResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            fixed_tenant_uuids:
              type: array
              items: { type: string, format: uuid }
            report:
              $ref: '#/components/schemas/IAMMigrationReport'
    IAMMigrationReport:
      type: object
      properties:
        root_users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        system_tenant_status:
          type: string
          enum: [ok, missing, invalid]
        root_system_member_status:
          type: string
          enum: [ok, missing, invalid]
        tenant_owner_missing:
          type: array
          items: { type: string, format: uuid }
        tenant_admin_missing:
          type: array
          items: { type: string, format: uuid }
        auto_fix_candidates:
          type: array
          items: { type: string, format: uuid }
        manual_fix_required:
          type: array
          items: { type: string, format: uuid }
    ErrorResponse:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        error: { type: string }
        request_id: { type: string }
    Pagination:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        pages: { type: integer }
