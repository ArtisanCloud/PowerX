components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: ApiKey
    Bearer:
      type: http
      scheme: bearer
  schemas:
    ProfileRef:
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
      required:
      - uuid
      - version
    Indexing:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - semantic
          - hybrid
        embedding_profile:
          $ref: '#/components/schemas/ProfileRef'
        artifact_roles:
          type: array
          items:
            type: string
            enum:
            - knowledge_profile
            - source_chunk
      required:
      - mode
      - embedding_profile
      - artifact_roles
    SourceRef:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - raw_document
          - cleaned_document
          - knowledge_profile
        source_uuid:
          type: string
          format: uuid
        version:
          type: string
        checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: 'SHA256 of the complete immutable UTF-8 source text; no sha256: prefix'
        position_unit:
          type: string
          const: unicode_codepoint
        char_start:
          type: integer
          minimum: 0
        char_end:
          type: integer
          minimum: 0
      required:
      - kind
      - source_uuid
      - version
      - checksum
      - position_unit
      - char_start
      - char_end
      description: Unicode codepoint half-open offsets [char_start,char_end). Artifact submission supplies the complete
        immutable text and requires start=0, end=codepoint length; returned chunks have exact subranges.
    Artifact:
      type: object
      additionalProperties: false
      properties:
        uuid:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - source_chunk
          - knowledge_profile
        text:
          type: string
        checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: 'SHA256 of the complete immutable UTF-8 source text; no sha256: prefix'
        version:
          type: string
        source_ref:
          $ref: '#/components/schemas/SourceRef'
        knowledge_profile_uuid:
          type: string
          format: uuid
        case_uuid:
          type: string
          format: uuid
        category_codes:
          type: array
          items:
            type: string
          maxItems: 32
        tag_uuids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 64
      required:
      - uuid
      - role
      - text
      - checksum
      - version
      - source_ref
      - category_codes
      - tag_uuids
    Filters:
      type: object
      additionalProperties: false
      properties:
        document_uuids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        category_codes:
          type: array
          items:
            type: string
          maxItems: 100
        tag_uuids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
        artifact_roles:
          type: array
          items:
            type: string
            enum:
            - knowledge_profile
            - source_chunk
          maxItems: 100
      required: []
    Query:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          const: powerx.knowledge.retrieval-query/v1
        query:
          type: string
          minLength: 1
          maxLength: 8192
        space_uuids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 16
        mode:
          type: string
          enum:
          - semantic
          - hybrid
        top_k:
          type: integer
          minimum: 1
          maximum: 100
        filters:
          $ref: '#/components/schemas/Filters'
        required_generations:
          type: object
          additionalProperties:
            type: string
            format: uuid
      required:
      - schema
      - query
      - space_uuids
      - mode
      - top_k
      - filters
    Configure:
      type: object
      additionalProperties: false
      properties:
        embedding_profile_key:
          type: string
        expected_configuration_generation:
          type: string
          format: uuid
      required:
      - embedding_profile_key
    Visibility:
      type: object
      additionalProperties: false
      properties:
        queryable:
          type: boolean
        expected_epoch:
          type: string
          format: uuid
      required:
      - queryable
    Generation:
      type: object
      additionalProperties: false
      properties:
        space_uuid:
          type: string
          format: uuid
        configuration_generation:
          type: string
          format: uuid
        corpus_generation:
          type: string
          format: uuid
        embedding_profile:
          $ref: '#/components/schemas/ProfileRef'
        model_key:
          type: string
        model_revision:
          type: string
        dimensions:
          type: integer
        distance_metric:
          type: string
          const: cosine
        env:
          type: string
          description: Frozen model configuration environment; queries and workers use this binding, not request-selected
            models.
      required:
      - space_uuid
      - configuration_generation
      - corpus_generation
      - embedding_profile
      - model_key
      - model_revision
      - dimensions
      - distance_metric
      - env
    Score:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
        score:
          type: number
        score_type:
          type: string
        direction:
          type: string
          enum:
          - lower_better
          - higher_better
      required:
      - source
      - score
      - score_type
      - direction
    Match:
      type: object
      additionalProperties: false
      properties:
        space_uuid:
          type: string
          format: uuid
        document_uuid:
          type: string
          format: uuid
        chunk_uuid:
          type: string
          format: uuid
        artifact_uuid:
          type: string
          format: uuid
        artifact_role:
          type: string
        knowledge_profile_uuid:
          type: string
          format: uuid
        case_uuid:
          type: string
          format: uuid
        title:
          type: string
        text:
          type: string
        score:
          type: number
        score_type:
          type: string
        scores:
          type: array
          items:
            $ref: '#/components/schemas/Score'
        retrieval_sources:
          type: array
          items:
            type: string
        external_ref:
          type: object
          additionalProperties: false
          properties:
            document_uuid:
              type: string
              format: uuid
          required:
          - document_uuid
        source_ref:
          $ref: '#/components/schemas/SourceRef'
        document_version:
          type: string
        bundle_generation:
          type: string
          format: uuid
      required:
      - space_uuid
      - document_uuid
      - chunk_uuid
      - artifact_uuid
      - artifact_role
      - text
      - score
      - score_type
      - scores
      - retrieval_sources
      - source_ref
      - document_version
      - bundle_generation
    Result:
      type: object
      additionalProperties: false
      properties:
        schema:
          type: string
          const: powerx.knowledge.retrieval-result/v1
        query_uuid:
          type: string
          format: uuid
        requested_mode:
          type: string
        effective_mode:
          type: string
        generations:
          type: array
          items:
            $ref: '#/components/schemas/Generation'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        trace_id:
          type: string
      required:
      - schema
      - query_uuid
      - requested_mode
      - effective_mode
      - generations
      - items
      - trace_id
    Document:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        uri:
          type: string
        content:
          type: string
        content_type:
          type: string
          enum:
          - text/plain
          - text/markdown
        checksum:
          type: string
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        ingestion:
          $ref: ./http-openapi.yaml#/components/schemas/KnowledgeDocumentIngestionSettings
        indexing:
          $ref: '#/components/schemas/Indexing'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          minItems: 1
          maxItems: 64
        external_ref:
          $ref: '#/components/schemas/ExternalRef'
        idempotency_key:
          type: string
          maxLength: 128
      required:
      - title
      - uri
      - content
      - content_type
      - checksum
      - version
      - indexing
      - artifacts
      - idempotency_key
    TypedRetrievalOperation:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          operation:
            const: query
          query:
            $ref: '#/components/schemas/Query'
        required:
        - operation
        - query
      - type: object
        additionalProperties: false
        properties:
          operation:
            const: capabilities
          space_uuid:
            type: string
            format: uuid
        required:
        - operation
        - space_uuid
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        schema:
          const: powerx.knowledge.semantic-capabilities/v1
        configured:
          type: boolean
        ready:
          type: boolean
        indexed:
          type: boolean
        query_modes:
          type: array
          items:
            type: string
            enum:
            - semantic
            - hybrid
        index_modes:
          type: array
          items:
            type: string
            enum:
            - semantic
            - hybrid
        indexed_query_modes:
          type: array
          items:
            type: string
            enum:
            - semantic
            - hybrid
        index_counts:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              mode:
                type: string
                enum:
                - semantic
                - hybrid
              documents:
                type: integer
                minimum: 0
              chunks:
                type: integer
                minimum: 0
            required:
            - mode
            - documents
            - chunks
        artifact_roles:
          type: array
          items:
            type: string
        supported_filters:
          type: array
          items:
            type: string
        tag_match:
          const: any
        position_unit:
          const: unicode_codepoint
        strict_sources:
          type: boolean
        generation:
          $ref: '#/components/schemas/Generation'
        reason_code:
          type: string
        limits:
          type: object
          additionalProperties:
            type: integer
        pending_generation:
          oneOf:
          - $ref: '#/components/schemas/Generation'
          - type: 'null'
      required:
      - schema
      - configured
      - ready
      - indexed
      - query_modes
      - reason_code
    VisibilityResult:
