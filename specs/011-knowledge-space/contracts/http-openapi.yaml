openapi: 3.0.3
info:
  title: Knowledge Space Provisioning API
  version: "0.1.0"
  description: HTTP contract for provisioning, ingestion, fusion, and feedback workflows.
servers:
  - url: https://api.powerx.local
paths:
  /knowledge-spaces:
    post:
      summary: Create a knowledge space within a tenant
      operationId: createKnowledgeSpace
      tags: [KnowledgeSpaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSpaceCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSpace'
        '409':
          description: Quota or naming conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge-spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    patch:
      summary: Update quotas or policy templates
      operationId: patchKnowledgeSpace
      tags: [KnowledgeSpaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSpacePatch'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSpace'
        '409':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge-spaces/{spaceId}/retire:
    post:
      summary: Retire a space and trigger 13-month archive
      operationId: retireKnowledgeSpace
      tags: [KnowledgeSpaces]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetireSpaceRequest'
      responses:
        '202':
          description: Retirement scheduled
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge-spaces/{spaceId}/ingestion-jobs:
    get:
      summary: List ingestion jobs for a space
      operationId: listIngestionJobs
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestionJob'
    post:
      summary: Trigger multimodal ingestion
      operationId: createIngestionJob
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
  /knowledge-spaces/{spaceId}/ingestion-jobs/{jobId}:
    get:
      summary: Get ingestion job by id
      operationId: getIngestionJob
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an ingestion job and its derived artifacts
      operationId: deleteIngestionJob
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteIngestionJobResult'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge-spaces/{spaceId}/ingestion-jobs/{jobId}/chunks:
    get:
      summary: List chunks for an ingestion job (preview)
      operationId: listIngestionJobChunks
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/JobId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Chunk page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionChunkList'
  /knowledge-spaces/{spaceId}/ingestion-jobs/{jobId}/chunks/{chunkId}:
    patch:
      summary: Update a chunk and rebuild its vector index
      operationId: updateIngestionJobChunk
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ChunkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChunkRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChunkResponse'
  /knowledge-spaces/{spaceId}/ingestion-jobs/{jobId}/pages/{pageNumber}/image:
    get:
      summary: Fetch OCR page image for overlay preview
      operationId: getIngestionJobPageImage
      tags: [Ingestion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/JobId'
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Page image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /knowledge-spaces/{spaceId}/fusion-strategies:
    post:
      summary: Publish a fusion strategy version
      operationId: publishFusionStrategy
      tags: [Fusion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FusionStrategyRequest'
      responses:
        '201':
          description: Strategy activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusionStrategy'
        '202':
          description: Strategy queued due to conflict policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusionStrategy'
    get:
      summary: List fusion strategy versions
      operationId: listFusionStrategies
      tags: [Fusion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: Strategy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FusionStrategy'
  /knowledge-spaces/{spaceId}/fusion-strategies/{strategyId}/rollback:
    post:
      summary: Rollback to a previous strategy version
      operationId: rollbackFusionStrategy
      tags: [Fusion]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
        - $ref: '#/components/parameters/StrategyId'
      responses:
        '200':
          description: Strategy re-activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FusionStrategy'
  /knowledge-spaces/{spaceId}/feedback:
    post:
      summary: Submit accuracy or freshness feedback
      operationId: createFeedbackCase
      tags: [Feedback]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCaseRequest'
      responses:
        '202':
          description: Feedback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackCase'
        '410':
          description: Space retired or deleted
    get:
      summary: List feedback cases
      operationId: listFeedbackCases
      tags: [Feedback]
      parameters:
        - $ref: '#/components/parameters/SpaceId'
      responses:
        '200':
          description: Feedback list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackCase'
  /openapi/knowledge-spaces/status:
    get:
      summary: Knowledge space provisioning summary
      operationId: getKnowledgeSpaceStatus
      tags: [KnowledgeSpaces]
      responses:
        '200':
          description: Current provisioning counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeSpaceStatus'
        '201':
          description: Feedback registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackCase'
  /openapi/knowledge-spaces/qa/retrieval-plan:
    post:
      summary: Compute QA retrieval plan across knowledge spaces
      operationId: planQARetrieval
      tags: [KnowledgeSpacesQA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QARetrievalPlanRequest'
      responses:
        '200':
          description: Retrieval plan payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QARetrievalPlanResponse'
  /openapi/knowledge-spaces/qa/memory-snapshot:
    post:
      summary: Upsert or fetch QA memory snapshot
      operationId: upsertQAMemorySnapshot
      tags: [KnowledgeSpacesQA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QAMemorySnapshotRequest'
      responses:
        '200':
          description: Snapshot payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QAMemorySnapshotResponse'

components:
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChunkId:
      name: chunkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StrategyId:
      name: strategyId
      in: path
      required: true
      schema:
        type: string
  schemas:
    KnowledgeSpaceCreate:
      type: object
      required: [spaceName, departmentCode, quotas, policyTemplateVersionId]
      properties:
        spaceName:
          type: string
        departmentCode:
          type: string
        quotas:
          $ref: '#/components/schemas/Quota'
        policyTemplateVersionId:
          type: string
        strategyPackageKey:
          type: string
          description: Strategy package key (A0–O) for the space.
        featureFlags:
          type: array
          items:
            type: string
    KnowledgeSpacePatch:
      type: object
      properties:
        quotas:
          $ref: '#/components/schemas/Quota'
        policyTemplateVersionId:
          type: string
        strategyPackageKey:
          type: string
          description: Strategy package key (A0–O) for the space.
        featureFlags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, active, pending_iam, retired]
    RetireSpaceRequest:
      type: object
      properties:
        reason:
          type: string
        requestedBy:
          type: string
        dropVectors:
          type: boolean
          default: false
    KnowledgeSpace:
      allOf:
        - $ref: '#/components/schemas/KnowledgeSpaceCreate'
        - type: object
          properties:
            tenant_uuid:
              type: string
              format: uuid
            spaceId:
              type: string
              format: uuid
            status:
              type: string
            retentionExpiresAt:
              type: string
              format: date-time
            auditToken:
              type: string
    Quota:
      type: object
      required: [cpuCores, storageGb, ingestionConcurrency]
      properties:
        cpuCores:
          type: integer
          minimum: 1
        storageGb:
          type: integer
          minimum: 50
        ingestionConcurrency:
          type: integer
          minimum: 1
    IngestionJobRequest:
      type: object
      required: [sourceUri]
      properties:
        format:
          type: string
          enum: [pdf, docx, xlsx, csv, markdown, html, sql, image, table, api]
        sourceType:
          type: string
          enum: [pdf, docx, xlsx, csv, markdown, html, sql, image, table, api]
        sourceUri:
          type: string
        ingestionProfile:
          type: string
        processorProfile:
          type: string
        ocrRequired:
          type: boolean
        maskingProfile:
          type: string
        priority:
          type: string
          enum: [normal, high]
    IngestionJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [pending, running, retrying, paused, completed, failed, blocked]
        retryCount:
          type: integer
        errorCode:
          type: string
        reason:
          type: string
        chunkTotal:
          type: integer
        chunkCoveragePct:
          type: number
        embeddingSuccessPct:
          type: number
        maskingCoveragePct:
          type: number
    IngestionChunk:
      type: object
      required: [chunkId, kind, content]
      properties:
        chunkId:
          type: string
          format: uuid
        kind:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        confidence:
          type: number
        masked:
          type: boolean
    IngestionChunkList:
      type: object
      required: [spaceId, jobId, total, page, pageSize, items]
      properties:
        spaceId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        format:
          type: string
        sourceUri:
          type: string
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/IngestionChunk'
    UpdateChunkRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
        editedBy:
          type: string
        editReason:
          type: string
    UpdateChunkResponse:
      type: object
      properties:
        updated:
          type: boolean
        chunkId:
          type: string
        jobId:
          type: string
        spaceId:
          type: string
        updatedAt:
          type: string
          format: date-time
    DeleteIngestionJobResult:
      type: object
      required: [deleted, deletedChunks, deletedVectors, deletedArtifacts]
      properties:
        deleted:
          type: boolean
        deletedChunks:
          type: integer
        deletedVectors:
          type: integer
        deletedArtifacts:
          type: boolean
    FusionStrategyRequest:
      type: object
      required: [label, bm25Weight, vectorWeight, graphConstraint, rerankerModel]
      properties:
        label:
          type: string
        bm25Weight:
          type: number
          minimum: 0
          maximum: 1
        vectorWeight:
          type: number
          minimum: 0
          maximum: 1
        graphConstraint:
          type: string
        rerankerModel:
          type: string
        conflictPolicy:
          type: string
          enum: [block, queue, allow_with_flag]
        requestedBy:
          type: string
    FusionStrategy:
      type: object
      properties:
        strategyId:
          type: string
        spaceId:
          type: string
          format: uuid
        label:
          type: string
        bm25Weight:
          type: number
        vectorWeight:
          type: number
        graphConstraint:
          type: string
        rerankerModel:
          type: string
        conflictPolicy:
          type: string
          enum: [block, queue, allow_with_flag]
        deploymentState:
          type: string
          enum: [draft, active, rollback]
        degraded:
          type: boolean
        degradeReasons:
          type: array
          items:
            type: string
        publishedAt:
          type: string
          format: date-time
    FeedbackCaseRequest:
      type: object
      required: [severity, linkedChunks, issueType]
      properties:
        issueType:
          type: string
          enum: [accuracy, freshness, compliance]
        severity:
          type: string
          enum: [low, medium, high, critical]
        linkedChunks:
          type: array
          items:
            type: string
            format: uuid
        notes:
          type: string
        reportedBy:
          type: string
          format: email
        toolTraceRef:
          type: string
    FeedbackCase:
      allOf:
        - $ref: '#/components/schemas/FeedbackCaseRequest'
        - type: object
          properties:
            caseId:
              type: string
            status:
              type: string
              enum: [open, in_progress, reprocessed, escalated, closed]
            slaDueAt:
              type: string
              format: date-time
            qualityScore:
              type: number
            reprocessJobId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    KnowledgeSpaceStatus:
      type: object
      properties:
        pendingIam:
          type: integer
        active:
          type: integer
        retired:
          type: integer
      required: [pendingIam, active, retired]
    QARetrievalPlanRequest:
      type: object
      required: [intent]
      properties:
        intent:
          type: string
        domainTags:
          type: array
          items:
            type: string
        sessionId:
          type: string
        latencyBudgetMs:
          type: integer
    QARetrievalPlanResponse:
      type: object
      required: [tenant_uuid, intent, candidateSpaces, telemetry]
      properties:
        tenant_uuid:
          type: string
          format: uuid
        intent:
          type: string
        domainTags:
          type: array
          items:
            type: string
        candidateSpaces:
          type: array
          items:
            $ref: '#/components/schemas/QACandidateSpace'
        tooling:
          type: array
          items:
            $ref: '#/components/schemas/QAToolMetadata'
        telemetry:
          $ref: '#/components/schemas/QATelemetry'
        degradeCount:
          type: integer
        sessionId:
          type: string
        latencyBudgetMs:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    QACandidateSpace:
      type: object
      required: [spaceId, spaceName, strategy, citationCoverage]
      properties:
        spaceId:
          type: string
          format: uuid
        spaceName:
          type: string
        strategy:
          type: string
          description: Strategy package key (A0–O).
        citationCoverage:
          type: number
        degradeReason:
          type: string
    QAToolMetadata:
      type: object
      properties:
        toolId:
          type: string
        name:
          type: string
        category:
          type: string
        endpoint:
          type: string
    QATelemetry:
      type: object
      properties:
        traceId:
          type: string
        recordedAt:
          type: string
          format: date-time
    QAMemorySnapshotRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
        updates:
          type: array
          items:
            $ref: '#/components/schemas/QACitationSummary'
    QAMemorySnapshotResponse:
      type: object
      properties:
        tenant_uuid:
          type: string
          format: uuid
        sessionId:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/QACitationSummary'
    QACitationSummary:
      type: object
      required: [chunkId, spaceId]
      properties:
        chunkId:
          type: string
        spaceId:
          type: string
        status:
          type: string
        citations:
          type: array
          items:
            type: string
        sourceType:
          type: string
        confidence:
          type: number
        deltaReason:
          type: string
