openapi: 3.0.3
info:
  title: Capability Registry & Integration Gateway API (Design Draft)
  version: 0.2.0
  description: |
    Breaking Change（Delegated Gateway Contract v1）：
    delegated 模式业务调用统一使用 STS access token（aud=powerx:api）。
    `PX_PLUGIN_TOOL_TOKEN` 仅用于 bootstrap/过渡探活。
    Gateway 固定入口为 `PX_GATEWAY_BASE_URL` + `PX_GATEWAY_AUTH_SCHEME=bearer`，
    不再兼容 `PX_TOOL_TOKEN` 与 `PX_GATEWAY_API_KEY`。
    Token 边界以 `docs/guides/auth/plugin_auth_token_model.md` 为准。
servers:
  - url: https://api.powerx.local
paths:
  /admin/capabilities:
    get:
      summary: List capabilities from registry (Admin)
      tags: [CapabilityRegistryAdmin]
      parameters:
        - in: query
          name: plugin_id
          schema:
            type: string
        - in: query
          name: intent
          schema:
            type: string
        - in: query
          name: protocol
          schema:
            type: string
            enum: [rest, grpc, mcp, workflow, composite]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 200
          default: 50
      responses:
        '200':
          description: Capability list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
  /admin/capabilities/{capabilityId}:
    get:
      summary: Fetch single capability metadata (Admin)
      tags: [CapabilityRegistryAdmin]
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - in: query
          name: include_workflows
          schema:
            type: boolean
          description: When true, return workflow/composite templates
      responses:
        '200':
          description: Capability found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDetailResponse'
        '404':
          description: Capability not found
  /admin/capability-sync/jobs:
    get:
      summary: Inspect latest capability sync jobs per plugin
      tags: [CapabilityRegistryAdmin]
      parameters:
        - in: query
          name: plugin_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, running, succeeded, failed]
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CapabilitySyncJobDTO'
  /admin/workflow-templates:
    get:
      summary: List workflow templates from catalog
      tags: [CapabilityRegistryAdmin]
      parameters:
        - in: query
          name: plugin_id
          schema:
            type: string
        - in: query
          name: capability_id
          schema:
            type: string
      responses:
        '200':
          description: Workflow templates snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  generated_at:
                    type: string
                    format: date-time
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowCatalogTemplateDTO'
  /admin/workflow-templates/{templateId}/upgrade:
    post:
      summary: Promote workflow template to latest capability hash
      tags: [CapabilityRegistryAdmin]
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capabilities_hash:
                  type: string
                reason:
                  type: string
              required: [capabilities_hash]
      responses:
        '200':
          description: Template upgraded
        '409':
          description: Provided hash does not match latest snapshot
  /admin/platform-capabilities:
    get:
      summary: List CoreX platform capabilities grouped by module
      tags: [CapabilityRegistryAdmin]
      parameters:
        - in: query
          name: module
          schema:
            type: string
          description: Filter by module key（如 media、event_fabric、workflow）
      responses:
        '200':
          description: Platform capability modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCapabilityModuleListResponse'
  /admin/platform-capabilities/{moduleKey}:
    get:
      summary: Get a single platform capability module
      tags: [CapabilityRegistryAdmin]
      parameters:
        - name: moduleKey
          in: path
          required: true
          schema:
            type: string
          description: Module key（如 media、event_fabric、workflow）
      responses:
        '200':
          description: Module found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCapabilityModuleResponse'
        '404':
          description: Module not found
  /tenant/capabilities:
    get:
      summary: List capabilities granted to tenant (Tenant API)
      tags: [CapabilityRegistryTenant]
      parameters:
        - in: query
          name: channel
          schema:
            type: string
            enum: [agent, workflow, api]
          description: Filter by exposure channel
        - in: query
          name: source
          schema:
            type: string
            enum: [corex, plugin]
          description: Filter by capability source (`corex` for platform, `plugin` otherwise)
      responses:
        '200':
          description: Authorized capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityListResponse'
  /tenant/invocations:
    post:
      summary: Invoke capability via Integration Gateway (Tenant API)
      tags: [IntegrationGatewayTenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityInvokeRequest'
      responses:
        '200':
          description: Invocation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityInvokeResponse'
        '202':
          description: Workflow/composite invocation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityInvokeResponse'
        '409':
          description: Capability version mismatch (manual upgrade pending)
        '429':
          description: Rate limit exceeded
        '503':
          description: Delegated gateway contract missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayContractErrorResponse'
  /tenant/invocations/stream:
    post:
      summary: Invoke capability via Integration Gateway and stream SSE (Tenant API)
      tags: [IntegrationGatewayTenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityInvokeRequest'
      responses:
        '200':
          description: SSE passthrough stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    event: start
                    data: {"traceId":"...","model_key":"openai/gpt-4o-mini"}

                    event: delta
                    data: {"delta":"partial...","index":0,"traceId":"..."}

                    event: done
                    data: {"ok":true,"text":"full output","finish_reason":"stop","traceId":"..."}
        '400':
          description: Bad request
        '403':
          description: Forbidden
        '429':
          description: Rate limit exceeded
        '502':
          description: Upstream is not SSE or upstream gateway error
  /tenant/invocations/{traceId}:
    get:
      summary: Fetch invocation status by trace id
      tags: [IntegrationGatewayTenant]
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invocation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationStatusResponse'
        '404':
          description: Trace not found

components:
  parameters:
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
  schemas:
    CapabilityListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityRecordDTO'
        pagination:
          type: object
          properties:
            page:
              type: integer
            page_size:
              type: integer
            total:
              type: integer
    CapabilityDetailResponse:
      type: object
      properties:
        capability:
          $ref: '#/components/schemas/CapabilityRecordDTO'
        workflow_templates:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTemplateDTO'
        composite_graphs:
          type: array
          items:
            type: object
            additionalProperties: true
    CapabilityRecordDTO:
      type: object
      properties:
        capability_id:
          type: string
        plugin_id:
          type: string
        source:
          type: string
          enum: [corex, plugin]
        title:
          type: string
        description:
          type: string
        intents:
          type: array
          items:
            type: string
        tool_scope:
          type: array
          items:
            type: string
        policy:
          type: object
          properties:
            prefer:
              type: string
            fallback:
              type: array
              items:
                type: string
            rollback_capability_id:
              type: string
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolBindingDTO'
        capabilities_hash:
          type: string
        protocol_hash:
          type: string
        status:
          type: string
    ProtocolBindingDTO:
      type: object
      properties:
        channel:
          type: string
          enum: [rest, grpc, mcp, workflow, composite]
        endpoint:
          type: string
        schema_ref:
          type: string
        method:
          type: string
        rpc:
          type: string
        tool_ref:
          type: string
        auth_type:
          type: string
        health_state:
          type: string
        last_checked_at:
          type: string
          format: date-time
    WorkflowTemplateDTO:
      type: object
      properties:
        template_id:
          type: string
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
        params_schema:
          type: object
        requires_manual_upgrade:
          type: boolean
        capabilities_hash_snapshot:
          type: string
    CapabilityInvokeRequest:
      type: object
      required: [capability_id, tenant_uuid]
      properties:
        capability_id:
          type: string
        tenant_uuid:
          type: string
        idempotency_key:
          type: string
        preferred_protocol:
          type: string
          enum: [mcp, grpc, rest, workflow]
        trace_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        context:
          type: object
          properties:
            tool_scope:
              type: string
            workflow_instance_id:
              type: string
    CapabilityInvokeResponse:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
          description: Real business payload proxied from REST/gRPC/MCP responses.
        trace_id:
          type: string
        status:
          type: string
          enum: [accepted, completed, failed, queued]
        protocol_used:
          type: string
        result:
          type: object
          additionalProperties: true
          description: Deprecated alias of payload kept for backward compatibility.
          deprecated: true
        fallback_used:
          type: boolean
    InvocationStatusResponse:
      type: object
      properties:
        trace_id:
          type: string
        capability_id:
          type: string
        tenant_uuid:
          type: string
        protocol_used:
          type: string
        fallback_used:
          type: boolean
        status:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        latency_ms:
          type: integer
        event_published:
          type: boolean
    GatewayContractErrorResponse:
      type: object
      properties:
        code:
          type: integer
          example: 503
        message:
          type: string
          example: gateway contract invalid
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - GW_CFG_MISSING_BASE_URL
                - GW_CFG_INVALID_AUTH_SCHEME
                - GW_CFG_MISSING_PLUGIN_TOOL_TOKEN
                - GW_BOOTSTRAP_CONTRACT_BROKEN
            message:
              type: string
    CapabilitySyncJobDTO:
      type: object
      properties:
        job_id:
          type: string
        plugin_id:
          type: string
        plugin_version:
          type: string
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        hash_before:
          type: string
        hash_after:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    WorkflowTemplateApprovalDTO:
      type: object
      properties:
        template_id:
          type: string
        capability_id:
          type: string
        capabilities_hash:
          type: string
        reason:
          type: string
        approved_by:
          type: string
        approved_at:
          type: string
          format: date-time
    WorkflowCatalogTemplateDTO:
      type: object
      properties:
        template_id:
          type: string
        capability_id:
          type: string
        capability_title:
          type: string
        plugin_id:
          type: string
        name:
          type: string
        description:
          type: string
        steps:
          type: object
        params_schema:
          type: object
        protocol_requirements:
          type: object
        capabilities_hash:
          type: string
        template_hash:
          type: string
        requires_manual_upgrade:
          type: boolean
        approved:
          $ref: '#/components/schemas/WorkflowTemplateApprovalDTO'
        needs_upgrade:
          type: boolean
        last_synced_at:
          type: string
          format: date-time
        error_summary:
          type: string

    PlatformCapabilityModuleListResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        total_modules:
          type: integer
        total_capabilities:
          type: integer
        modules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformCapabilityModuleDTO'

    PlatformCapabilityModuleResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        module:
          $ref: '#/components/schemas/PlatformCapabilityModuleDTO'

    PlatformCapabilityModuleDTO:
      type: object
      properties:
        module:
          type: string
        display_name:
          type: string
        description:
          type: string
        capability_count:
          type: integer
        protocol_channels:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/PlatformCapabilityDTO'

    PlatformCapabilityDTO:
      type: object
      properties:
        capability_id:
          type: string
        title:
          type: string
        description:
          type: string
        module:
          type: string
        source:
          type: string
          enum: [corex]
        plugin_id:
          type: string
        plugin_version:
          type: string
        docs:
          type: array
          items:
            type: string
        capabilities_hash:
          type: string
        preferred_protocol:
          type: string
        protocols:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolBindingDTO'
        debug_examples:
          $ref: '#/components/schemas/PlatformCapabilityDebugExamples'

    PlatformCapabilityDebugExamples:
      type: object
      properties:
        tenant_invocation_curl:
          type: string
        tenant_invocation_payload:
          type: object
          additionalProperties: true
