openapi: 3.1.0
info:
  title: PowerX Multimodal Model API
  version: 0.1.0
  description: >
    Tenant-scoped multimodal model APIs with stateless invoke and sessioned chat.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:8077
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantHeader:
      name: X-PowerX-Tenant
      in: header
      required: true
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: model_not_allowed
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
      example:
        code: model_not_allowed
        message: model not allowed for tenant
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer
    ContentItem:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [text, image_url, audio_url]
        text:
          type: string
        url:
          type: string
    MultimodalInvokeRequest:
      type: object
      required: [modality, model_key, inputs]
      properties:
        modality:
          type: string
          enum: [text, image, audio, video, embedding, mixed]
        model_key:
          type: string
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        params:
          type: object
          additionalProperties: true
    MultimodalInvokeResponse:
      type: object
      properties:
        output:
          type: object
          additionalProperties: true
        usage:
          $ref: '#/components/schemas/Usage'
    CreateMMSSessionRequest:
      type: object
      required: [model_key]
      properties:
        model_key:
          type: string
        title:
          type: string
    CreateMMSSessionResponse:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
    SessionMessageRequest:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentItem'
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_results:
          type: array
          items:
            type: object
            additionalProperties: true
    EmbeddingRequest:
      type: object
      required: [model_key, inputs]
      properties:
        model_key:
          type: string
        inputs:
          type: array
          items:
            type: string
    EmbeddingResponse:
      type: object
      properties:
        vectors:
          type: array
          items:
            type: array
            items:
              type: number
        usage:
          $ref: '#/components/schemas/Usage'
paths:
  /ai/multimodal/invoke:
    post:
      summary: Stateless multimodal invoke
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultimodalInvokeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultimodalInvokeResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ai/multimodal/sessions:
    post:
      summary: Create multimodal session
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMMSSessionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMMSSessionResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ai/multimodal/sessions/{session_id}/messages:
    post:
      summary: Append session message
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionMessageRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ai/multimodal/sessions/{session_id}/stream:
    get:
      summary: Stream multimodal session output (SSE)
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    event: start
                    data: {"session_id":"...","request_id":"..."}

                    event: token
                    data: {"text":"partial..."}

                    event: final
                    data: {"message":"full output"}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /ai/embeddings:
    post:
      summary: Embedding generation
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
