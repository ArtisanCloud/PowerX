syntax = "proto3";

package powerx.integration_gateway.v1;

option go_package = "github.com/ArtisanCloud/PowerX/api/grpc/gen/go/powerx/integration_gateway/v1;integration_gatewayv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

message ListCapabilitiesRequest {
  string plugin_id = 1;
  string intent = 2;
  repeated string protocols = 3;
  int32 page = 4;
  int32 page_size = 5;
  bool include_disabled = 6;
}

message Capability {
  string capability_id = 1;
  string plugin_id = 2;
  string title = 3;
  string description = 4;
  repeated string intents = 5;
  repeated string tool_scope = 6;
  Policy policy = 7;
  repeated ProtocolBinding protocols = 8;
  repeated WorkflowTemplate workflow_templates = 9;
  string capabilities_hash = 10;
  string protocol_hash = 11;
  string status = 12;
}

message Policy {
  string prefer = 1;
  repeated string fallback = 2;
  string rollback_capability_id = 3;
}

message ProtocolBinding {
  string channel = 1;       // rest/grpc/mcp/workflow/composite
  string endpoint = 2;      // URL, RPC 全名或 MCP tool 名
  string schema_ref = 3;    // OpenAPI/Proto/MCP schema 路径
  string method = 4;        // REST method
  string rpc = 5;           // gRPC RPC 名称
  string tool_ref = 6;      // MCP tool 名
  string auth_type = 7;     // tenant_jwt/plugin_token/sse
  string health_state = 8;  // healthy/degraded/offline
  google.protobuf.Timestamp last_checked_at = 9;
}

message WorkflowTemplate {
  string template_id = 1;
  string name = 2;
  string description = 3;
  google.protobuf.Struct params_schema = 4;
  bool requires_manual_upgrade = 5;
  string capabilities_hash_snapshot = 6;
  repeated WorkflowStep steps = 7;
}

message WorkflowStep {
  string capability_id = 1;
  string protocol = 2;
  google.protobuf.Struct params = 3;
}

message ListCapabilitiesResponse {
  repeated Capability items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

message GetCapabilityRequest {
  string capability_id = 1;
  bool include_workflows = 2;
}

message InvokeCapabilityRequest {
  string capability_id = 1;
  string tenant_uuid = 2;
  string idempotency_key = 3;
  string preferred_protocol = 4; // mcp/grpc/rest/workflow
  string trace_id = 5;
  google.protobuf.Struct payload = 6;
  map<string, string> context = 7; // workflow instance, tool scope 等
}

message InvokeCapabilityResponse {
  string trace_id = 1;
  string status = 2; // accepted/completed/failed/queued
  string protocol_used = 3;
  bool fallback_used = 4;
  google.protobuf.Struct result = 5;
}

message ListWorkflowTemplatesRequest {
  string capability_id = 1;
  string tenant_uuid = 2;
}

message ListWorkflowTemplatesResponse {
  repeated WorkflowTemplate items = 1;
}

message StreamInvocationRequest {
  string trace_id = 1;
}

message StreamInvocationResponse {
  string trace_id = 1;
  string status = 2;
  google.protobuf.Struct event = 3;
}

message ListCapabilitySyncJobsRequest {
  string plugin_id = 1;
  string status = 2;
}

message CapabilitySyncJob {
  string job_id = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string status = 4;
  string hash_before = 5;
  string hash_after = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp finished_at = 8;
  string error_summary = 9;
}

message ListCapabilitySyncJobsResponse {
  repeated CapabilitySyncJob items = 1;
}

service IntegrationGatewayService {
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc GetCapability(GetCapabilityRequest) returns (Capability);
  rpc InvokeCapability(InvokeCapabilityRequest) returns (InvokeCapabilityResponse);
  rpc ListWorkflowTemplates(ListWorkflowTemplatesRequest) returns (ListWorkflowTemplatesResponse);
  rpc StreamInvocation(StreamInvocationRequest) returns (stream StreamInvocationResponse);
  rpc ListCapabilitySyncJobs(ListCapabilitySyncJobsRequest) returns (ListCapabilitySyncJobsResponse);
}
