syntax = "proto3";

package powerx.integration.gateway.v1;

option go_package = "github.com/ArtisanCloud/PowerX/api/grpc/gen/go/powerx/integration_gateway/v1;integrationgatewayv1";
option java_package = "com.artisancloud.powerx.integration.gateway.v1";

import "google/protobuf/timestamp.proto";

message RateLimitPolicy {
  uint64 limit = 1;
  uint64 burst = 2;
  uint32 window_seconds = 3;
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    PER_ROUTE = 1;
    PER_TENANT = 2;
    PER_ROUTE_PER_TENANT = 3;
  }
  Scope scope = 4;
}

message EventTopicConfig {
  string created = 1;
  string updated = 2;
  string invocation_succeeded = 3;
  string invocation_failed = 4;
}

message IntegrationRoute {
  string route_id = 1;
  string tenant_id = 2;
  string route_slug = 3;
  string capability_id = 4;
  repeated string tool_grant_ids = 5;
  repeated string channels = 6;
  RateLimitPolicy rate_limit = 7;
  EventTopicConfig event_topics = 8;
  enum LifecycleState {
    LIFECYCLE_STATE_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE = 2;
    SUSPENDED = 3;
    RETIRED = 4;
  }
  LifecycleState lifecycle_state = 9;
  bool enabled = 10;
  uint32 current_version = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string description = 14;
}

message IntegrationRouteSummary {
  string route_id = 1;
  string tenant_id = 2;
  string route_slug = 3;
  string capability_id = 4;
  IntegrationRoute.LifecycleState lifecycle_state = 5;
  repeated string channels = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message IntegrationRouteVersion {
  uint32 version = 1;
  string change_type = 2;
  string change_summary = 3;
  string changed_by = 4;
  google.protobuf.Timestamp changed_at = 5;
  string trace_id = 6;
  IntegrationRoute snapshot = 7;
}

message CreateRouteRequest {
  string tenant_id = 1;
  string route_slug = 2;
  string capability_id = 3;
  repeated string tool_grant_ids = 4;
  repeated string channels = 5;
  RateLimitPolicy rate_limit = 6;
  EventTopicConfig event_topics = 7;
  string description = 8;
}

message CreateRouteResponse {
  IntegrationRoute route = 1;
  string trace_id = 2;
}

message GetRouteRequest {
  string route_id = 1;
  string version_selector = 2; // "latest" or "draft"
}

message GetRouteResponse {
  IntegrationRoute route = 1;
  uint32 version = 2;
  string trace_id = 3;
}

message UpdateRouteRequest {
  string route_id = 1;
  uint32 expect_version = 2;
  repeated string tool_grant_ids = 3;
  repeated string channels = 4;
  RateLimitPolicy rate_limit = 5;
  EventTopicConfig event_topics = 6;
  string description = 7;
  IntegrationRoute.LifecycleState lifecycle_state = 8;
}

message UpdateRouteResponse {
  IntegrationRoute route = 1;
  uint32 version = 2;
  string trace_id = 3;
}

message ListRoutesRequest {
  string tenant_id = 1;
  string capability_id = 2;
  IntegrationRoute.LifecycleState lifecycle_state = 3;
  uint32 page = 4;
  uint32 page_size = 5;
}

message ListRoutesResponse {
  repeated IntegrationRouteSummary items = 1;
  uint32 page = 2;
  uint32 page_size = 3;
  uint64 total = 4;
  string trace_id = 5;
}

message ChangeLifecycleRequest {
  string route_id = 1;
  IntegrationRoute.LifecycleState target_state = 2;
  string reason = 3;
}

message ChangeLifecycleResponse {
  IntegrationRoute route = 1;
  string trace_id = 2;
}

message ListRouteVersionsRequest {
  string route_id = 1;
}

message ListRouteVersionsResponse {
  repeated IntegrationRouteVersion versions = 1;
  string trace_id = 2;
}

message TenantGetRouteRequest {
  string tenant_id = 1;
  string route_slug = 2;
}

message TenantGetRouteResponse {
  IntegrationRoute route = 1;
  string trace_id = 2;
}

message TenantListRoutesRequest {
  string tenant_id = 1;
  string capability_id = 2;
  string channel = 3;
}

message TenantInvokeRequest {
  string tenant_id = 1;
  string route_slug = 2;
  string trace_id = 3;
  string idempotency_key = 4;
  bytes payload_json = 5;
}

message TenantInvokeResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    OK = 1;
    ACCEPTED = 2;
    RATE_LIMITED = 3;
    DENIED = 4;
    FAILED = 5;
  }
  Status status = 1;
  bytes result_json = 2;
  string routed_capability_id = 3;
  string routed_adapter = 4;
  string trace_id = 5;
  google.protobuf.Timestamp dispatched_at = 6;
  string error_code = 7;
  string error_message = 8;
}

service IntegrationGatewayAdminService {
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc GetRoute(GetRouteRequest) returns (GetRouteResponse);
  rpc UpdateRoute(UpdateRouteRequest) returns (UpdateRouteResponse);
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc ChangeLifecycle(ChangeLifecycleRequest) returns (ChangeLifecycleResponse);
  rpc ListRouteVersions(ListRouteVersionsRequest) returns (ListRouteVersionsResponse);
}

service IntegrationGatewayTenantService {
  rpc ListRoutes(TenantListRoutesRequest) returns (ListRoutesResponse);
  rpc GetRoute(TenantGetRouteRequest) returns (TenantGetRouteResponse);
  rpc InvokeRoute(TenantInvokeRequest) returns (TenantInvokeResponse);
}
