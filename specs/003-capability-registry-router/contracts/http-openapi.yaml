openapi: 3.0.3
info:
  title: Capability Registry & Router API (Design Draft)
  version: 0.1.0
servers:
  - url: https://api.powerx.local
paths:
  /admin/capabilities:
    post:
      summary: Create or publish a capability registration snapshot
      tags: [Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRegistrationResponse'
        '409':
          description: Version conflict or duplicate capability for tenant
        '422':
          description: Validation failed (missing Tool Grant / Contract)
  /admin/capabilities/{capabilityId}/tenants/{tenantId}:
    get:
      summary: Fetch capability registration snapshot
      tags: [Registry]
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/TenantId'
        - in: query
          name: version
          schema:
            type: string
            enum: [latest, draft]
          description: Defaults to latest published snapshot
      responses:
        '200':
          description: Snapshot found
          headers:
            ETag:
              schema:
                type: string
              description: Version tag for optimistic concurrency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRegistration'
        '404':
          description: Capability not registered for tenant
    put:
      summary: Update capability registration snapshot (optimistic concurrency)
      tags: [Registry]
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapabilityRegistrationRequest'
      responses:
        '200':
          description: Updated
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityRegistrationResponse'
        '412':
          description: Version mismatch (ETag required)
        '422':
          description: Validation failure
    delete:
      summary: Disable capability registration (soft delete)
      tags: [Registry]
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '202':
          description: Soft delete accepted
  /admin/capabilities/{capabilityId}/tenants/{tenantId}/health:
    post:
      summary: Submit passive health probe result
      tags: [Health]
      parameters:
        - $ref: '#/components/parameters/CapabilityId'
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthProbeSubmission'
      responses:
        '202':
          description: Probe queued
  /router/invoke:
    post:
      summary: Route a capability invocation request
      tags: [Router]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
      responses:
        '200':
          description: Invocation result proxy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
        '307':
          description: Redirect to selected adapter (HTTP only)
        '409':
          description: No healthy adapter available, fallback triggered
  /discovery/{tenantId}/{capabilityId}:
    get:
      summary: Retrieve cached capability snapshot
      tags: [Discovery]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CapabilityId'
      responses:
        '200':
          description: Cached snapshot
          headers:
            Cache-Control:
              schema:
                type: string
              description: TTL in seconds (default 120)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverySnapshot'
        '404':
          description: No cache; client must request full sync
  /discovery/sync:
    post:
      summary: Request bulk sync of capability snapshots
      tags: [Discovery]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id:
                  type: string
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Returns selected capability snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscoverySnapshot'

components:
  parameters:
    CapabilityId:
      name: capabilityId
      in: path
      required: true
      schema:
        type: string
      description: Canonical capability identifier (e.g., capabilities.search.v1)
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      description: Tenant or org identifier
  schemas:
    CapabilityRegistrationRequest:
      type: object
      required:
        - capability_id
        - tenant_id
        - contract_ref
        - adapters
        - routing_policy
      properties:
        capability_id:
          type: string
        tenant_id:
          type: string
        contract_ref:
          type: string
        status:
          type: string
          enum: [draft, published, deprecated, disabled]
        environment_policies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/EnvironmentPolicy'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/AdapterEndpoint'
        routing_policy:
          $ref: '#/components/schemas/RoutingPolicy'
        fallback_plan:
          $ref: '#/components/schemas/FallbackPlan'
        tool_grant_ids:
          type: array
          items:
            type: string
        version:
          type: integer
          description: Required for updates (optimistic concurrency)
    CapabilityRegistrationResponse:
      type: object
      properties:
        capability_id:
          type: string
        tenant_id:
          type: string
        version:
          type: integer
        status:
          type: string
        published_at:
          type: string
          format: date-time
    CapabilityRegistration:
      allOf:
        - $ref: '#/components/schemas/CapabilityRegistrationRequest'
        - type: object
          properties:
            version:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            updated_by:
              type: string
    AdapterEndpoint:
      type: object
      required:
        - adapter_id
        - transport_type
        - weight
        - timeout_ms
      properties:
        adapter_id:
          type: string
        transport_type:
          type: string
          enum: [http, grpc, mcp, a2a]
        endpoint_url:
          type: string
        service_ref:
          type: string
        weight:
          type: integer
          minimum: 0
        max_concurrency:
          type: integer
          minimum: 1
        timeout_ms:
          type: integer
          minimum: 1
        visibility:
          $ref: '#/components/schemas/VisibilityPolicy'
        labels:
          type: object
          additionalProperties:
            type: string
    RoutingPolicy:
      type: object
      required:
        - strategy
        - cooldown_seconds
      properties:
        strategy:
          type: string
          enum: [weighted_round_robin, priority, sticky]
        tenant_strategies:
          type: object
          additionalProperties:
            type: string
        rate_limit:
          $ref: '#/components/schemas/RateLimit'
        fallback_sequence:
          type: array
          items:
            type: string
        cooldown_seconds:
          type: integer
          minimum: 30
        sticky_keys:
          type: array
          items:
            type: string
    FallbackPlan:
      type: object
      properties:
        fallback_targets:
          type: array
          items:
            type: string
        static_response:
          type: object
          properties:
            payload:
              type: object
            ttl_seconds:
              type: integer
    VisibilityPolicy:
      type: object
      properties:
        environments:
          type: object
          properties:
            allow:
              type: array
              items:
                type: string
            deny:
              type: array
              items:
                type: string
        tenants:
          type: object
          properties:
            allow:
              type: array
              items:
                type: string
            deny:
              type: array
              items:
                type: string
    EnvironmentPolicy:
      type: object
      properties:
        is_enabled:
          type: boolean
        overrides:
          type: object
          additionalProperties:
            type: string
    RateLimit:
      type: object
      properties:
        limit:
          type: integer
        window_seconds:
          type: integer
    HealthProbeSubmission:
      type: object
      required:
        - adapter_id
        - status
      properties:
        adapter_id:
          type: string
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        reason:
          type: string
        observed_at:
          type: string
          format: date-time
    InvokeRequest:
      type: object
      required:
        - capability_id
        - tenant_id
        - payload
      properties:
        capability_id:
          type: string
        tenant_id:
          type: string
        actor:
          type: object
          properties:
            id:
              type: string
            roles:
              type: array
              items:
                type: string
        payload:
          type: object
        timeout_ms:
          type: integer
        sticky_key:
          type: string
    InvokeResponse:
      type: object
      properties:
        adapter_id:
          type: string
        trace_id:
          type: string
        latency_ms:
          type: integer
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fallback_used:
              type: boolean
    DiscoverySnapshot:
      type: object
      properties:
        capability_id:
          type: string
        tenant_id:
          type: string
        version:
          type: integer
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        routing_policy:
          $ref: '#/components/schemas/RoutingPolicy'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/AdapterEndpoint'
        fallback_plan:
          $ref: '#/components/schemas/FallbackPlan'
        metadata_digest:
          type: string
