name: Publish PowerX Container Distribution
on:
  push:
    branches: [develop, main, master]
    paths:
      - backend/**
      - web-admin/**
      - deploy/powerx/container/**
      - deploy/powerx/docker/dockerfiles/**
      - .dockerignore
      - .github/workflows/publish-container.yml
      - docs/contracts/powerx-upgrade*.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: powerx-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      migration-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: powerx
          POSTGRES_PASSWORD: ci-upgrade-test-only
          POSTGRES_DB: powerx_upgrade_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U powerx"
          --health-interval 5s --health-timeout 3s --health-retries 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate deployment initializer
        run: |
          python3 -m pip install pyyaml
          python3 deploy/powerx/container/test_init.py
          python3 -m unittest discover -s deploy/powerx/container -p 'test_upgrade*.py'
          python3 deploy/powerx/container/upgrade_registry.py --check
          sh -n deploy/powerx/container/entrypoint.sh deploy/powerx/container/run.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migration failure, retry, concurrency and configuration gates
        working-directory: backend
        env:
          POWERX_UPGRADE_TEST_DSN: host=127.0.0.1 port=5432 user=powerx password=ci-upgrade-test-only dbname=powerx_upgrade_test_ci sslmode=disable
        run: |
          go test ./cmd/database ./config ./pkg/corex/db/database ./internal/service/integration_gateway/apikeypermissions ./pkg/corex/db/persistence/repository/iam
          go test ./internal/service/integration_gateway -run '^TestUpgrade'
      - name: Release identity
        id: identity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in main|master) prefix=release ;; *) prefix=dev ;; esac
          echo "version=$prefix-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/powerx/docker/dockerfiles/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/artisancloud/powerx-backend:sha-${{ github.sha }}
          build-args: |
            POWERX_SOURCE_SHA=${{ github.sha }}
            POWERX_VERSION=${{ steps.identity.outputs.version }}
            POWERX_BUILD_TIME=${{ steps.identity.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/ArtisanCloud/PowerX
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=powerx-backend
          cache-to: type=gha,mode=max,scope=powerx-backend
      - name: Build web admin
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/powerx/docker/dockerfiles/web-admin.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/artisancloud/powerx-web-admin:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ArtisanCloud/PowerX
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=powerx-web
          cache-to: type=gha,mode=max,scope=powerx-web
      - name: Freeze and verify paired OCI image digests
        env:
          SOURCE_SHA: ${{ github.sha }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          python3 deploy/powerx/container/upgrade_release.py resolve --source-sha "$SOURCE_SHA" --backend "$BACKEND_DIGEST" --web-admin "$WEB_DIGEST" --output target-pair.json
      - uses: actions/upload-artifact@v6
        with:
          name: powerx-target-pair-${{ github.sha }}
          path: target-pair.json
      - name: Fresh database, login, frontend and API smoke test
        env:
          POWERX_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          cd deploy/powerx/container
          cp .env.example .env
          sed -i "s/REPLACE_WITH_PUBLISHED_TAG/sha-$POWERX_SOURCE_SHA/g" .env
          sh run.sh start
          python3 smoke.py
      - name: Cleanup smoke environment
        if: always()
        run: |
          cd deploy/powerx/container
          if test -f .env; then docker compose --profile standalone down --volumes; fi
  installed-upgrade:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install pyyaml
      - uses: actions/download-artifact@v5
        with:
          name: powerx-target-pair-${{ github.sha }}
      - name: Installed baseline to target, preservation and restore rollback
        working-directory: deploy/powerx/container
        env:
          POWERX_UPGRADE_CI: '1'
          COMPOSE_PROJECT_NAME: powerx-upgrade-${{ github.run_id }}-${{ matrix.arch }}
        run: python3 upgrade_smoke.py --pair ../../../target-pair.json --platform '${{ matrix.platform }}' --report ../../../reports/upgrade-report-linux-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: powerx-upgrade-report-${{ github.sha }}-${{ matrix.arch }}
          path: reports/upgrade-report-*.json
      - name: Remove all CI-owned containers and volumes
        if: always()
        working-directory: deploy/powerx/container
        env:
          COMPOSE_PROJECT_NAME: powerx-upgrade-${{ github.run_id }}-${{ matrix.arch }}
        run: if test -f .env; then docker compose --profile standalone down --volumes; fi
  upgrade-metadata:
    needs: [images, installed-upgrade]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install pyyaml jsonschema
      - uses: actions/download-artifact@v5
        with:
          name: powerx-target-pair-${{ github.sha }}
      - uses: actions/download-artifact@v5
        with:
          pattern: powerx-upgrade-report-${{ github.sha }}-*
          path: reports
          merge-multiple: true
      - name: Publishable contract only after both upgrade platforms pass
        env:
          CI_RUN_URL: https://github.com/ArtisanCloud/PowerX/actions/runs/${{ github.run_id }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          case "$SOURCE_BRANCH" in main|master) channel=stable ;; *) channel=development ;; esac
          python3 deploy/powerx/container/upgrade_release.py manifest --pair target-pair.json --reports-dir reports --ci-run-url "$CI_RUN_URL" --channel "$channel" --output powerx-upgrade-manifest.json
          python3 -c 'import json,jsonschema; jsonschema.validate(json.load(open("powerx-upgrade-manifest.json")),json.load(open("docs/contracts/powerx-upgrade-manifest.schema.json")))'
      - name: Export verified paired deployment bundle
        run: |
          mkdir /tmp/powerx-docker
          cp deploy/powerx/container/{compose.yml,compose.restore-access.yml,gateway.conf,run.sh,README.md,.env.example} /tmp/powerx-docker/
          cp powerx-upgrade-manifest.json docs/contracts/powerx-upgrade*.schema.json /tmp/powerx-docker/
          cp reports/upgrade-report-*.json /tmp/powerx-docker/
          python3 -c 'import json,pathlib; p=json.load(open("target-pair.json")); f=pathlib.Path("/tmp/powerx-docker/.env.example"); s=f.read_text(); s=s.replace("ghcr.io/artisancloud/powerx-backend:REPLACE_WITH_PUBLISHED_TAG",p["images"]["backend"]["repository"]+"@"+p["images"]["backend"]["index_digest"]); s=s.replace("ghcr.io/artisancloud/powerx-web-admin:REPLACE_WITH_PUBLISHED_TAG",p["images"]["web_admin"]["repository"]+"@"+p["images"]["web_admin"]["index_digest"]); f.write_text(s)'
          tar -czf powerx-docker.tar.gz -C /tmp powerx-docker
          sha256sum powerx-docker.tar.gz > powerx-docker.tar.gz.sha256
          sha256sum powerx-upgrade-manifest.json > powerx-upgrade-manifest.json.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: powerx-docker-${{ github.sha }}
          path: |
            powerx-docker.tar.gz
            powerx-docker.tar.gz.sha256
            powerx-upgrade-manifest.json
            powerx-upgrade-manifest.json.sha256
  bundle-release:
    needs: upgrade-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: powerx-docker-${{ github.sha }}
      - name: Publish the verified deployment bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          case "$SOURCE_BRANCH" in main|master) tag="docker-release-${SOURCE_SHA:0:12}"; release_flags=() ;; *) tag="docker-dev-${SOURCE_SHA:0:12}"; release_flags=(--prerelease) ;; esac
          printf 'Verified paired PowerX images for source %s. See powerx-upgrade-manifest.json for supported baseline digests, migration contract, platform evidence and restore-required rollback. This release does not authorize image-only rollback.\n' "$SOURCE_SHA" > /tmp/release-notes.txt
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" powerx-docker.tar.gz powerx-docker.tar.gz.sha256 powerx-upgrade-manifest.json powerx-upgrade-manifest.json.sha256 --repo "$REPO" --clobber
          else
            gh release create "$tag" powerx-docker.tar.gz powerx-docker.tar.gz.sha256 powerx-upgrade-manifest.json powerx-upgrade-manifest.json.sha256 --repo "$REPO" --target "$SOURCE_SHA" "${release_flags[@]}" --title "PowerX Docker ${SOURCE_SHA:0:12}" --notes-file /tmp/release-notes.txt
          fi
