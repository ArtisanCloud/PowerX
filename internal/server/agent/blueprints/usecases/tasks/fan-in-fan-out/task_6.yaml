flow_id: core.demo.fanin.task_6
name: "fan-in/fan-out：task_6（收尾）"
version: "1.0"

metadata:
  io:
    inputs:
      - { name: upstream_id, type: string, required: true }
    outputs:
      - { name: id, type: string }
      - { name: timestamp, type: string }
  requires: ["core.demo.fanin.task_5"]
  intent:
    register: true
    group: "demo.fanin"
    matchers:
      - type: keyword
        any: ["收尾任务6","fan-in 任务6","执行任务6","执行task_6","t6 fanin"]
    embedding:
      title: "Fan-in/Fan-out：执行 task_6（收尾）"
      synonyms: ["第六步","完成任务"]
    examples:
      positive: ["执行任务6"]
      negative: ["执行任务2"]

slots:
  - { name: upstream_id, type: string, required: true }

nodes:
  - id: n1
    use: core.debug.forward
    kind: biz_logic
    params: { id_ref: "{{ .input.upstream_id }}" }
    io:
      in_map:      { upstream_id: "{{ input.upstream_id }}" }
      out_map: { id: id, timestamp: timestamp }
  - id: n2
    use: core.response.format
    kind: text_proc
    params:
      template: '{ "id":"{{ node.n1.output.id }}","from":"t6@fanin" }'
    io:
      out_map: { id: id, timestamp: timestamp }
edges:
  - { from: n1, to: n2, type: SEQ }
