server:
  host: "0.0.0.0"
  port: 8077
  read_timeout_seconds: 30
  write_timeout_seconds: 30
  mode: debug
  api_prefix: /api/v1
  ws_prefix: /ws

  # secret_key 是 32 字节的 Base64 编码
  # umask 077
  # head -c 32 /dev/urandom | base64 -w0
  secret_key: "XG6yQ4G3hXlqQnKf1v2q2Qn9cH7g1pVv5N8S0yL3w9Y="

  grpc:
    enable: true
    host: 0.0.0.0
    port: 9010
    reflection: true
    health: true
    max_recv_mb: 32
    max_send_mb: 32

    keepalive:
      enable: true
      max_connection_idle: 2m
      max_connection_age: 0s
      max_connection_age_grace: 30s
      time: 1m
      timeout: 5s
      min_time: 5s
      permit_without_stream: true

    tls:
      enable: false
      cert_file: "etc/tls/server.crt"
      key_file: "etc/tls/server.key"
      require_client_cert: false
      client_ca_file: "etc/tls/ca.crt"

    interceptors:
      logging: true
      recovery: true
      authz: true
      audit: true
      tracing: false
      prometheus: false

    limits:
      max_concurrent_streams: 0


security:
  frame_ancestors:
    - "'self'"               # 可留可不留；我们会自动补上
    - "http://localhost:3030"
    - "http://127.0.0.1:3030"
    - "https://admin.powerx.io"
    # 支持通配子域：
    # - "https://*.powerx.io"
    -
agent:
  host: "0.0.0.0"
  port: 8082 # 如果和 corex.server.port 冲突，可以改一个端口
  mode: "ws_sse"

  intent_recognizer:
    # 允许逐层开关
    rule:
      enabled: true

    embedding:
      enabled: true
      provider: ollama            # ollama | openai
      endpoint: http://localhost:11434
      model: bge-m3               # nomic-embed-text | bge-m3 | text-embedding-3-small
      max_batch: 128
      dim: 1024                   # 可选；多数模型不用填
      accept_threshold: 0.68      # >= 接受
      llm_gate_threshold: 0.62    # [gate, accept) 且 top1-top2<δ 时才进入 LLM
      top_delta_gate: 0.05        # δ

    classifier:
      enabled: false              # 需要时再开
      provider: ollama            # ollama | openai
      endpoint: http://localhost:11434
      model: qwen3:8b  # 或 gpt-4o-mini / gpt-4o
#      provider: openai
#      endpoint: "https://api.chatanywhere.tech/v1"
#      model: "text-embedding-3-small"
#      api_key: "sk-qFExGKFvHXp2VjXKkVGz6GCVp564E9eTdft09gtiOy7pruAr"
      api_key: ""                 # openai 时必填
      temperature: 0.0
      max_tokens: 256
      llm_min_confidence: 0.60    # LLM 置信度 >= 接受
      top_k: 6                     # 候选 flow 限制，避免 token 爆炸

  # Blueprint 目录：只加载业务 Variant
  flow_spec:
    base_dir: "./pkg/corex/flow/blueprints"
    business_dir: "./internal/server/agent/blueprints"

  # 业务消息模板目录
  templates_dir: "./services/agent/templates"

  llm:
    provider: ollama
    endpoint: http://localhost:11434
    model: qwen3:8b
#    model: deepseek-r1:1.5b
#    provider: openai
#    endpoint: https://api.chatanywhere.tech/v1
#    model: gpt-3.5-turbo

ai:
  catalog:
    dirs:
      - "config/agents/providers.d"   # 你已经放好了的目录
    include_embedded: false
    fail_if_empty: true
    hot_reload: false

  defaults:
    llm:
      provider: ollama
      endpoint: http://localhost:11434
#      model: qwen3:8b
      model: deepseek-r1:1.5b
      temperature: 0.7
      max_tokens: 512
      top_p: 1
      stream: true

    embedding:
      provider: ollama
      endpoint: http://localhost:11434
      model: bge-m3
      dimensions: 1024
      truncate: none
      batch: 32

    image:
      provider: openai
      endpoint: https://api.openai.com/v1
      model: gpt-image-1
      size: 1024x1024
      quality: standard
      format: png

    video:
      provider: openai
      endpoint: https://api.openai.com/v1
      model: gpt-4o-realtime
      resolution: 1080p
      fps: 24
      max_duration_sec: 10

  routing:
    enable: true
    policy_refresh: 30s
    provider_cache_ttl: 5m
    route_decision_timeout: 500ms
    retry_on_timeout: true
    max_retries: 1

mcp:
  server:
    host: "0.0.0.0"
    port: 8078
    launch_mode: "http"
  #    launch_mode: "stdio"

  flow_spec:
    base_dir: "./pkg/corex/flow/blueprints"
    blueprints: "./services/mcp/blueprints/"
    capabilities: "./services/mcp/capabilities/"
    feedbacks: "./services/mcp/feedbacks/"

  tool_spec:
    core_dir: "./services/mcp/tool_specs" # CoreX 内置 tool spec 目录
    app_dirs: # 应用层可以是多个
  #      - "PowerX/mcp/tool_specs"
  #      - "MediaX/mcp/tool_specs"
  templates_dir: "./services/mcp/templates/"

  endpoints:
    sse: "/mcp/sse"
    message: "/mcp/message"

