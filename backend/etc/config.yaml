event_bus:
  type: local
  redis_addr: "localhost:6379"
  redis_password: ""
  dedupe_ttl_sec: 3600

integration_gateway:
  rate_limit_prefix: "integration_gateway:rl"
  default_rate_limit:
    limit: 120
    burst: 120
    window_seconds: 60
    scope: per_route_per_tenant
  event_topics:
    created: "integration.gateway.route.created"
    updated: "integration.gateway.route.updated"
    invocation_succeeded: "integration.gateway.invocation.succeeded"
    invocation_failed: "integration.gateway.invocation.failed"
  redis_addr: "localhost:6379"
  redis_password: ""
  redis_db: 2

agent_lifecycle:
  redis_addr: "localhost:6379"
  redis_password: ""
  redis_db: 3
  capacity_key_prefix: "agent_lifecycle:capacity"
  health_key_prefix: "agent_lifecycle:health"
  default_capacity_instances: 3
  event_topics:
    lifecycle_prefix: "agent.lifecycle"
    health_prefix: "agent.health"
  notifications:
    im_webhook: ""
    retry_interval_seconds: 30
    retry_max_attempts: 3
    http_timeout_seconds: 5

event_fabric:
  ack_timeout_seconds: 30
  default_max_retry: 5
  redis_addr: localhost:6379
  redis_password: ""
  redis_db: 1
  retry_key_prefix: event_fabric:retry
  replay_key_prefix: event_fabric:replay
  scheduler_interval: 5

dynamic_form:
  max_concurrent_flows: 100
  default_timeout_sec: 300


storage:
#  default_driver: local
