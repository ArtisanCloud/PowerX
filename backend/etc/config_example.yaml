server:
  port: 8077
  read_timeout_seconds: 5
  write_timeout_seconds: 10
  mode: debug
  api_prefix: /api/v1
  ws_prefix: /ws
  # secret_key 是 32 字节的 Base64 编码，可用以下命令生成：
  #   umask 077 && head -c 32 /dev/urandom | base64 -w0
  secret_key: ""
  grpc:
    enable: true
    network: tcp
    host: 0.0.0.0
    port: 9001
    reflection: true
    useTLS: false
    certFile: ""
    keyFile: ""
    health: true
    max_recv_mb: 32
    max_send_mb: 32
    keepalive:
      enable: true
      max_connection_idle: "2m"
      max_connection_age: "0s"
      max_connection_age_grace: "30s"
      time: "1m"
      timeout: "5s"
      min_time: "5s"
      permit_without_stream: true
    interceptors:
      logging: true
      recovery: true
      authz: true
      audit: true
      tracing: false
      prometheus: false
    limits:
      max_concurrent_streams: 0

security:
  frame_ancestors:
    - "'self'"
    - "http://localhost:3030"
    - "http://127.0.0.1:3030"
    - "https://admin.powerx.io"

feature_gate:
  license_key: demo-license-xyz

database:
  driver: postgres
  dsn: ""
  host: localhost
  port: 5432
  username: postgres
  password: postgres
  database: corex
  ssl_mode: disable
  timezone: Asia/Shanghai
  table_prefix: px_
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_minutes: 60
  log_level: info

cache:
  driver: redis
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  max_idle: 5
  max_active: 20
  idle_timeout: 60
  timeout: 5
  read_timeout: 5
  write_timeout: 5
  max_retries: 3

log:
  level: debug
  console: true
  use_json_format: false
  show_timestamp: true
  show_caller: false
  http_debug: false
  debug: true
  file:
    enable: false
    info_file_path: logs/info.log
    error_file_path: logs/error.log
    max_size: 100
    max_backups: 5
    max_age: 30
    compress: true
  loki:
    enable: false
    url: ""
    job_name: corex
    batch_wait: 1
    batch_size: 100

auth:
  jwt_secret: K8mN2pQ7rS9tU4vW6xY1zA3bC5dE8fG0
  issuer: powerx-auth
  audience_user: user
  audience_customer: customer
  platforms:
    - admin
    - web
    - miniapp
  access_ttl: "720h"
  refresh_ttl: "336h"

event_bus:
  type: local
  redis_addr: localhost:6379
  redis_password: ""
  dedupe_ttl_sec: 30

dynamic_form:
  max_concurrent_flows: 10
  default_timeout_sec: 60

ai:
  catalog:
    dirs: []
    include_embedded: true
    fail_if_empty: false
    hot_reload: false
  defaults:
    llm:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: gpt-4o-mini
      api_key: ""
      temperature: 0.7
      max_tokens: 512
      top_p: 1.0
      stream: false
    embedding:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: text-embedding-3-small
      api_key: ""
      dimensions: 1536
      truncate: none
      batch: 32
    image:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: dall-e-3
      api_key: ""
      size: 1024x1024
      quality: standard
      format: png
      prompt_hint: ""
    video:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: gpt-video
      api_key: ""
      resolution: 1080p
      fps: 24
      max_duration_sec: 10
      prompt_hint: ""
  routing:
    enable: false
    policy_refresh: "30s"
    provider_cache_ttl: "5m"
    route_decision_timeout: "500ms"
    retry_on_timeout: true
    max_retries: 1

agent:
  host: 127.0.0.1
  port: 8082
  mode: ws_sse
  driver: eino
  flow_spec:
    base_dir: ./pkg/corex/flow/blueprints
    business_dir: ./internal/server/agent/blueprints
  template_dir: ./services/agent/templates
  intent_recognizer:
    rule:
      enabled: true
    embedding:
      enabled: false
      provider: ""
      endpoint: ""
      model: ""
      api_key: ""
      max_batch: 32
      dim: 0
      accept_threshold: 0.5
      llm_gate_threshold: 0.6
      top_delta_gate: 0.2
    classifier:
      enabled: false
      provider: ""
      endpoint: ""
      model: ""
      api_key: ""
      temperature: 0.0
      max_tokens: 1024
      llm_min_confidence: 0.6
      top_k: 3
  retry_policy:
    max_attempts: 3
    interval: "2s"
    backoff: true
    jitter: true
    max_interval: "10s"
  options: {}

mcp:
  server:
    host: 0.0.0.0
    port: 8086
    launch_mode: standalone
  flow_spec:
    blueprints: ./blueprints/
    capabilities: ./capabilities/
    feedbacks: ./feedbacks/
  tool_spec:
    core_dir: CoreX/services/mcp/tool_specs
    app_dirs:
      - PowerX/mcp/tool_specs
  templates_dir: ./mcp/templates/
  endpoints:
    sse: /mcp/sse
    message: /mcp/message

plugin:
  enabled: false
  registry_file: ./plugins/registry.json
  base_prefix: /_p
  installed_dir: ./plugins/installed
  market_cache_dir: ./plugins/market_cache
  read_timeout_sec: 15
  write_timeout_sec: 15
  dev_mode: false

storage:
  default_driver: local
  ttl_seconds: 43200
  local:
    base_path: ./storage/media
    public_base_url: http://localhost:8077/media
    enable_upload_endpoint: false
    upload_token_secret: ""  # 启用上传端点时必须显式配置强随机密钥
    max_upload_size_bytes: 104857600
  s3:
    endpoint: http://127.0.0.1:9000
    region: us-east-1
    access_key: minioadmin
    secret_key: minioadmin
    session_token: ""
    bucket: powerx-media
    use_ssl: false
    force_path_style: true
    external_domain: ""
    presign_endpoint: ""
