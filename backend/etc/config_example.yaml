server:
  port: 8077
  read_timeout_seconds: 5
  write_timeout_seconds: 10
  mode: debug
  api_prefix: /api/v1
  ws_prefix: /ws
  # secret_key 是 32 字节的 Base64 编码，可用以下命令生成：
  #   umask 077 && head -c 32 /dev/urandom | base64 -w0
  secret_key: ""
  grpc:
    enable: true
    network: tcp
    host: 0.0.0.0
    port: 9001
    reflection: true
    useTLS: false
    certFile: ""
    keyFile: ""
    health: true
    max_recv_mb: 32
    max_send_mb: 32
    keepalive:
      enable: true
      max_connection_idle: "2m"
      max_connection_age: "0s"
      max_connection_age_grace: "30s"
      time: "1m"
      timeout: "5s"
      min_time: "5s"
      permit_without_stream: true
    interceptors:
      logging: true
      recovery: true
      authz: true
      audit: true
      tracing: false
      prometheus: false
    limits:
      max_concurrent_streams: 0

http_security:
  frame_ancestors:
    - "'self'"
    - "http://localhost:3030"
    - "http://127.0.0.1:3030"
    - "https://admin.powerx.io"

feature_gate:
  license_key: demo-license-xyz
  enable_event_fabric: true
  enable_workflow: true
  enable_knowledge_space: true
  enable_media_platform: true
  enable_experimental_features: true

database:
  driver: postgres
  dsn: ""
  host: localhost
  port: 5432
  username: postgres
  password: postgres
  database: corex
  ssl_mode: disable
  timezone: Asia/Shanghai
  table_prefix: px_
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime_minutes: 60
  log_level: info
  cluster_mode: single
  replicas:
    # - role: read
    #   dsn: ""
    #   host: replica-host
    #   port: 5432
    #   username: postgres
    #   password: postgres
    #   database: corex

cache:
  driver: redis
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  max_idle: 5
  max_active: 20
  idle_timeout: 60
  timeout: 5
  read_timeout: 5
  write_timeout: 5
  max_retries: 3

log:
  level: debug
  console: true
  use_json_format: false
  show_timestamp: true
  show_caller: false
  http_debug: false
  debug: true
  file:
    enable: false
    info_file_path: logs/info.log
    error_file_path: logs/error.log
    max_size: 100
    max_backups: 5
    max_age: 30
    compress: true
  loki:
    enable: false
    url: ""
    job_name: corex
    batch_wait: 1
    batch_size: 100

auth:
  jwt_secret: K8mN2pQ7rS9tU4vW6xY1zA3bC5dE8fG0
  issuer: powerx-auth
  audience_user: user
  audience_customer: customer
  platforms:
    - admin
    - web
    - miniapp
  access_ttl: "720h"
  refresh_ttl: "336h"

event:
  bus:
    type: local
    redis_addr: ""
    redis_password: ""
    redis_db: 0
    dedupe_ttl_sec: 30
  fabric:
    ack_timeout_seconds: 30
    default_max_retry: 5
    redis_addr: ""          # 留空则复用 queue.redis.addr
    redis_password: ""      # 留空则复用 queue.redis.password
    redis_db: 0             # 0 表示复用 queue.redis.db
    retry_key_prefix: event_fabric:retry
    replay_key_prefix: event_fabric:replay
    scheduler_interval: 0   # 0 表示复用 scheduler.interval_seconds
    security:
      require_tls: false
      signature_secret: ""
      signature_header: X-PowerX-Signature
      timestamp_header: X-PowerX-Timestamp
      signature_key_id: event-fabric
      allowed_clock_skew_seconds: 300
      sandbox:
        enforce: false
        allowed_outbound_hosts: []
        blocked_http_paths: []
        blocked_grpc_methods: []
        forbidden_headers: []
    authorization:
      cache_ttl_seconds: 60
      local_cache_ttl_seconds: 30
      redis_addr: ""                   # 可单独指定，留空则复用 queue.redis
      redis_password: ""
      redis_db: 0
      cache_invalidate_channel: event_fabric:authorization:invalidate
      challenge_sla_seconds: 60
      challenge_topic: event_fabric.authorization.challenge
      challenge_consumer_group: event_fabric.authorization.default
      alert_topic: event_fabric.authorization.alert
      rate_limit_prefix: event_fabric:authorization:rl
      timeout_sweep_interval_seconds: 60
      audit_retention_days: 7
      audit_archive_bucket: ""
      audit_archive_prefix: ""
      secrets:
        provider: ""
        key_id: ""
        rotation_interval_seconds: 0
        cache_ttl_seconds: 0

queue:
  driver: redis
  redis:
    addr: localhost:6379
    password: ""
    db: 5

scheduler:
  driver: builtin
  interval_seconds: 5

capability_registry:
  redis_prefix: "capability_registry:cache"
  event_topic_prefix: "capability.catalog"
  default_rate_limit:
    limit: 60
    burst: 120
    window_seconds: 60

low_code:
  max_concurrent_flows: 10
  default_timeout_sec: 60

ai:
  catalog:
    dirs:
      - "./config/agents/providers.d"
    include_embedded: true
    fail_if_empty: false
    hot_reload: false
  defaults:
    llm:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: gpt-4o-mini
      api_key: ""
      temperature: 0.7
      max_tokens: 512
      top_p: 1.0
      stream: false
    embedding:
      # 默认使用 OpenAI embedding（需要在 Web Admin「AI Settings」或此处配置 api_key 才能生效）。
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: text-embedding-3-small
      api_key: ""
      dimensions: 1536
      truncate: none
      batch: 32
    image:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: dall-e-3
      api_key: ""
      size: 1024x1024
      quality: standard
      format: png
      prompt_hint: ""
    video:
      provider: openai
      endpoint: "https://api.openai.com/v1"
      model: gpt-video
      api_key: ""
      resolution: 1080p
      fps: 24
      max_duration_sec: 10
      prompt_hint: ""
  routing:
    enable: false
    policy_refresh: "30s"
    provider_cache_ttl: "5m"
    route_decision_timeout: "500ms"
    retry_on_timeout: true
    max_retries: 1

agent:
  host: 127.0.0.1
  port: 8082
  mode: ws_sse
  driver: eino
  flow_spec:
    base_dir: ./pkg/corex/flow/blueprints
    business_dir: ./internal/server/agent/blueprints
  template_dir: ./services/agent/templates
  intent_recognizer:
    rule:
      enabled: true
    embedding:
      enabled: false
      provider: ""
      endpoint: ""
      model: ""
      api_key: ""
      max_batch: 32
      dim: 0
      accept_threshold: 0.5
      llm_gate_threshold: 0.6
      top_delta_gate: 0.2
    classifier:
      enabled: false
      provider: ""
      endpoint: ""
      model: ""
      api_key: ""
      temperature: 0.0
      max_tokens: 1024
      llm_min_confidence: 0.6
      top_k: 3
  retry_policy:
    max_attempts: 3
    interval: "2s"
    backoff: true
    jitter: true
    max_interval: "10s"
  options: {}
  mcp:
    server:
      host: 0.0.0.0
      port: 8078
      launch_mode: standalone
    flow_spec:
      blueprints: ./blueprints/
      capabilities: ./capabilities/
      feedbacks: ./feedbacks/
    tool_spec:
      core_dir: CoreX/services/mcp/tool_specs
      app_dirs:
        - PowerX/mcp/tool_specs
    templates_dir: ./mcp/templates/
    endpoints:
      sse: /mcp/sse
      message: /mcp/message

knowledge_space:
  redis_addr: ""      # 留空则复用 queue.redis
  redis_password: ""
  redis_db: 0
  lock_key_prefix: knowledge_space:lock
  metrics_key_prefix: knowledge_space:metrics
  default_retention_months: 13
  provisioning_sla_seconds: 120
  ingestion_sla_seconds: 14400
  scene_strategy_catalog_path: backend/config/knowledge/scene_strategy_catalog.yaml
  ingestion_processors:
    # PDF 内嵌文本抽取（需要镜像/机器安装 `pdftotext`，通常来自 poppler-utils）
    # - true: 强制启用
    # - false: 强制禁用
    # - null/不写: 自动探测
    pdf_text_available: null
    # OCR Plan B（需要 tesseract + pdftoppm 或 mutool）
    ocr_available: null
  event_topics:
    provisioning: knowledge.space.provisioning
    ingestion: knowledge.space.ingestion
    fusion: knowledge.space.fusion
    feedback: knowledge.space.feedback
  notifications:
    im_webhook: ""
    retry_interval_seconds: 60
    retry_max_attempts: 3
    http_timeout_seconds: 5
  vector_store:
    driver: "pgvector" # pgvector / milvus / pinecone
    pgvector:
      dsn: "" # 留空则复用 database.dsn
      schema: public
      table: knowledge_vectors_v1_1536
      dimensions: 1536
      enable_migrations: false
      batch_size: 128
      ivfflat_lists: 100
      timeout_seconds: 30
    milvus:
      endpoint: ""
      api_key: ""
      project: ""
    pinecone:
      endpoint: ""
      api_key: ""
      index: ""
      namespace: ""
  index_backends:
    sparse: postgres_fts              # or external
    hier: postgres_links              # or external
    structured_fields: postgres_jsonb # or external
    kg: postgres                      # or external
  delta:
    sources_config: configs/knowledge/delta_sources.yaml
    partial_release_config: configs/knowledge/partial_release.yaml
    report_path: backend/reports/_state/knowledge-delta.json
    aggregate_report_path: reports/_state/knowledge-update.json
    sla_minutes: 30
    approval_minutes: 15
    default_diff_accuracy: 98
  reports:
    feedback_path: backend/reports/_state/knowledge-feedback.json
    qa_bridge_path: reports/_state/qa-reasoning.json
  event_hotfix:
    policies_path: configs/knowledge/event_hotfix_policies.yaml
    agent_weight_matrix_path: configs/knowledge/agent_weight_matrix.yaml
    report_path: backend/reports/_state/knowledge-event.json
    aggregate_report_path: reports/_state/knowledge-update.json
    retry_max: 3
    replay_window_seconds: 300
  decay:
    threshold_path: configs/knowledge/decay_thresholds.yaml
    report_path: backend/reports/_state/knowledge-decay.json
    aggregate_report_path: reports/_state/knowledge-update.json
  release:
    matrix_path: configs/knowledge/tenant_release_matrix.yaml
    guardrails_doc: docs/ops/release_guardrails.md
    report_path: backend/reports/_state/knowledge-release.json
    aggregate_report_path: reports/_state/knowledge-update.json




plugin:
  enabled: false
  registry_file: ./plugins/registry.json
  base_prefix: /_p
  installed_dir: ./plugins/installed
  market_cache_dir: ./plugins/market_cache
  read_timeout_sec: 15
  write_timeout_sec: 15
  dev_mode: false
  release:
    feature_flags:
      enable_local_install: true
      enable_pipeline_deployment: true
      enable_offline_distribution: true
    local_install:
      session_ttl_minutes: 30
      max_artifact_size_mb: 512
    pipeline:
      approval_sla_hours: 24
      max_parallel_releases: 4
      default_rollback_notice_minutes: 15
    canary:
      rollback_timeout_seconds: 300
      default_batch_size: 10
      max_batches: 5
    distribution:
      offline_bucket: plugin-release-artifacts
      offline_prefix: packages
      escalation_threshold: 2
      artifact_retention_days: 30
    observability:
      dashboard_uid: plugin-release
      alert_rule_prefix: plugin_release
      kpi_targets:
        can_rollback_within_seconds: 300
        hotload_latency_p95_ms: 600
  dev_hotload:
    feature_flags:
      enabled: true
      gateway_flag: PX_DEV_PLUGIN_HOTLOAD
      session_audit_flag: PX_DEV_SESSION_AUDIT
    sessions:
      ttl_minutes: 15
      max_concurrent_sessions: 25
      cleanup_interval_seconds: 30
    sandbox:
      image: ghcr.io/artisancloud/powerx/dev-hotload-host:latest
      max_cpu_percent: 25
      max_memory_mb: 512
      watch_file_limit: 10000
    security:
      require_mtls: false
      allowed_subjects: []
      pat_header: X-PowerX-Dev-Token
      token_ttl_seconds: 900
    observability:
      metrics_namespace: dev.hotload
      sse_buffer_size: 128
      audit_topic: dev.hotload.sessions
  bootstrap:
    templates_index: ./config/plugins/templates/index.yaml
    default_template: fullstack-go-nuxt
    allowlisted_hosts:
      - git.powerx.io
      - gitlab.internal
      - github.com
  debug:
    component: plugin_debug
    host_simulator:
      enabled: true
      feature_flag: PX_PLUGIN_HOST_SIMULATOR
      config_path: ./config/plugins/debug/host_simulator.yaml
    reports:
      template: ./config/plugins/debug/report_template.yaml
      masking_rules: ./config/security/data_masking_rules.yaml
      fallback_log_base: ""
    ticket_bridge:
      provider: noop
      endpoint: ""
      project: plugin-debug
    sandbox:
      enabled: true
      feature_flag: plugin-sandbox-suite
      data_suite_path: ./config/plugins/debug/data_suite.yaml

storage:
  default_driver: local
  ttl_seconds: 43200
  local:
    base_path: ./storage/media
    public_base_url: http://localhost:8077/media
    upload_token_secret: ""  # 建议配置强随机密钥，用于校验 PUT 上传请求
    max_upload_size_bytes: 104857600
  s3:
    endpoint: http://127.0.0.1:9000
    region: us-east-1
    access_key: minioadmin
    secret_key: minioadmin
    session_token: ""
    bucket: powerx-media
    use_ssl: false
    force_path_style: true
    external_domain: ""
    presign_endpoint: ""
