version: v1

deps:
  - buf.build/googleapis/googleapis  # powerx/{agent,knowledge}/v1 契约复用公共类型

# Buf 默认扫描整个 contracts 目录，capability/v1 proto 会随模块一起构建。
breaking: {
  use: [FILE]
}

lint: {
  use: [STANDARD],
  except: [
    PACKAGE_DIRECTORY_MATCH,
    RPC_REQUEST_RESPONSE_UNIQUE
  ],
  ignore_only: {
    RPC_REQUEST_STANDARD_NAME: [
      "powerx/capability/registry/v1/registry.proto",
      "powerx/agent/v1/agent_lifecycle.proto",
      "powerx/integration_gateway/v1/integration_gateway.proto",
      "powerx/knowledge/v1/knowledge_space.proto",
      "powerx/plugin_release/v1/plugin_release.proto"
    ],
    RPC_RESPONSE_STANDARD_NAME: [
      "powerx/capability/registry/v1/registry.proto",
      "powerx/agent/v1/agent_lifecycle.proto",
      "powerx/integration_gateway/v1/integration_gateway.proto",
      "powerx/knowledge/v1/knowledge_space.proto",
      "powerx/plugin_release/v1/plugin_release.proto"
    ],
    ENUM_ZERO_VALUE_SUFFIX: [
      "powerx/agent_model_hub/v1/agent_model_hub.proto"
    ],
    ENUM_VALUE_PREFIX: [
      "powerx/integration_gateway/v1/integration_gateway.proto"
    ]
  }
}
