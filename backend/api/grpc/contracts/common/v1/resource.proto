syntax = "proto3";

package common.v1;

option go_package = "github.com/ArtisanCloud/PowerX/api/grpc/gen/go/common/v1;commonv1";

// PowerX 统一资源引用（PRN）
message ResourceRef {
  string tenant_uuid = 1;          // 所属租户
  string domain    = 2;            // "organization"/"iam"/"ecom"...
  string entity    = 3;            // "member"/"team"/"order"...
  string id        = 4;            // ULID/Snowflake 等稳定主键
  string human_key = 5;            // 业务可读编号（可选）
  string prn       = 6;            // prn:powerx:env:t-xx:domain.entity:id
  map<string,string> labels = 7;   // 便于路由/归档的标签
}
