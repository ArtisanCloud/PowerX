version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/ArtisanCloud/PowerX/api/grpc/gen/go
    # powerx/{workflow,knowledge}/v1 均沿用默认前缀以维持路径一致性
    # powerx/platform_ops/v1 也沿用默认前缀，生成到 gen/go/powerx/platform_ops/v1
    # Integration Gateway (powerx/integration_gateway/v1) 复用默认前缀，无需额外 override
plugins:
  - plugin: go
    out: ../gen/go
    opt:
      - paths=source_relative
  - plugin: go-grpc
    out: ../gen/go
    opt:
      - paths=source_relative
