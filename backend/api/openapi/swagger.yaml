components:
    schemas:
        BudgetRef:
            properties:
                currency:
                    type: string
                monthlyLimit:
                    type: number
            required:
                - currency
                - monthlyLimit
            type: object
        ConnectorInstance:
            allOf:
                - $ref: '#/components/schemas/ConnectorInstanceInput'
                - properties:
                    errorRate:
                        type: number
                    instanceId:
                        type: string
                    platform:
                        type: string
                    status:
                        enum:
                            - active
                            - paused
                            - degrading
                        type: string
                  type: object
        ConnectorInstanceInput:
            properties:
                mappingTemplate:
                    type: object
                oauthRef:
                    type: string
                rateLimitPerMinute:
                    type: integer
                region:
                    type: string
                tenantId:
                    type: string
                webhookSigningKeyRef:
                    type: string
            required:
                - tenantId
                - oauthRef
                - webhookSigningKeyRef
            type: object
        EnforcementRequest:
            properties:
                action:
                    enum:
                        - throttle
                        - degrade
                        - disable
                    type: string
                providerId:
                    type: string
                reason:
                    type: string
                tenantId:
                    type: string
                ticketId:
                    type: string
            required:
                - tenantId
                - action
            type: object
        ProviderProfile:
            allOf:
                - $ref: '#/components/schemas/ProviderProfileInput'
                - properties:
                    providerId:
                        type: string
                    rolloutStatus:
                        enum:
                            - draft
                            - validating
                            - gray
                            - live
                            - rolled_back
                        type: string
                  type: object
        ProviderProfileInput:
            properties:
                budgets:
                    items:
                        $ref: '#/components/schemas/BudgetRef'
                    type: array
                capabilities:
                    items:
                        type: string
                    type: array
                credentials:
                    additionalProperties:
                        type: string
                    type: object
                name:
                    type: string
                primaryEndpoint:
                    type: string
                regions:
                    items:
                        type: string
                    type: array
                tenantWhitelist:
                    items:
                        $ref: '#/components/schemas/TenantRef'
                    type: array
            required:
                - name
                - primaryEndpoint
            type: object
        ProviderWeight:
            properties:
                providerId:
                    type: string
                weight:
                    type: number
            required:
                - providerId
                - weight
            type: object
        QuotaEntry:
            properties:
                limit:
                    type: number
                providerId:
                    type: string
                status:
                    enum:
                        - healthy
                        - warning
                        - breached
                    type: string
                usage:
                    type: number
            type: object
        QuotaSnapshot:
            properties:
                quotas:
                    items:
                        $ref: '#/components/schemas/QuotaEntry'
                    type: array
                tenantId:
                    type: string
            type: object
        RoutingDecision:
            properties:
                fallbackChain:
                    items:
                        type: string
                    type: array
                policyVersion:
                    type: integer
                primaryProviderId:
                    type: string
                traceId:
                    type: string
            type: object
        RoutingDecisionInput:
            properties:
                taskContext:
                    additionalProperties: true
                    type: object
                tenantId:
                    type: string
            required:
                - tenantId
                - taskContext
            type: object
        RoutingPolicy:
            allOf:
                - $ref: '#/components/schemas/RoutingPolicyInput'
                - properties:
                    policyId:
                        type: string
                    status:
                        enum:
                            - draft
                            - staged
                            - active
                            - rolled_back
                        type: string
                    version:
                        type: integer
                  type: object
        RoutingPolicyInput:
            properties:
                approvalConfig:
                    properties:
                        requiredApprovers:
                            type: integer
                        workflowId:
                            type: string
                    type: object
                fallbackChain:
                    items:
                        type: string
                    type: array
                rules:
                    items:
                        $ref: '#/components/schemas/RoutingRule'
                    type: array
                safeModeThresholds:
                    $ref: '#/components/schemas/SafeModeThresholds'
                tenantScope:
                    type: string
            required:
                - tenantScope
                - rules
            type: object
        RoutingRule:
            properties:
                candidates:
                    items:
                        $ref: '#/components/schemas/ProviderWeight'
                    type: array
                sla:
                    properties:
                        costCeiling:
                            type: number
                        latencyMs:
                            type: integer
                    type: object
                taskPattern:
                    type: string
            required:
                - taskPattern
                - candidates
            type: object
        SafeModeThresholds:
            properties:
                maxFallbackFailureRate:
                    type: number
                maxLatencyMs:
                    type: integer
                minHitRate:
                    type: number
            type: object
        TenantRef:
            properties:
                environment:
                    type: string
                tenantId:
                    type: string
            required:
                - tenantId
                - environment
            type: object
        UsageReport:
            properties:
                events:
                    items:
                        properties:
                            costUsd:
                                type: number
                            timestamp:
                                format: date-time
                                type: string
                            tokens:
                                type: integer
                            traceId:
                                type: string
                        type: object
                    type: array
                providerId:
                    type: string
                tenantId:
                    type: string
            required:
                - tenantId
                - events
            type: object
info:
    title: PowerX Admin API (Minimal)
    version: v1.0.0
openapi: 3.0.3
paths:
    /connector-platforms/{platform}/instances:
        post:
            parameters:
                - in: path
                  name: platform
                  required: true
                  schema:
                    enum:
                        - coze
                        - n8n
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConnectorInstanceInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConnectorInstance'
                    description: Instance stored
            summary: Register or update an external platform instance
            tags:
                - Connectors
    /connector-platforms/{platform}/instances/{instanceId}/pause:
        post:
            parameters:
                - in: path
                  name: platform
                  required: true
                  schema:
                    type: string
                - in: path
                  name: instanceId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Instance paused
            summary: Pause a specific connector instance after errors
            tags:
                - Connectors
    /model-routing/policies:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RoutingPolicyInput'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RoutingPolicy'
                    description: Policy stored and awaiting approval
            summary: Create or update a routing policy version
            tags:
                - Routing Policies
    /model-routing/rollback:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                targetVersion:
                                    type: integer
                                tenantScope:
                                    type: string
                            required:
                                - tenantScope
                            type: object
                required: true
            responses:
                "200":
                    description: Rollback triggered
            summary: Roll back to a previous routing policy version
            tags:
                - Routing Policies
    /model-routing/route:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RoutingDecisionInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RoutingDecision'
                    description: Decision result
            summary: Request a routing decision for a task context
            tags:
                - Routing Policies
    /provider-quotas:
        get:
            parameters:
                - in: query
                  name: tenantId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QuotaSnapshot'
                    description: Quota configuration
            summary: Retrieve quota configuration for a tenant
            tags:
                - Cost & Quota
    /provider-quotas/enforce:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EnforcementRequest'
                required: true
            responses:
                "200":
                    description: Enforcement action recorded
            summary: Confirm and execute a throttle/degrade/disable action
            tags:
                - Cost & Quota
    /provider-usage/report:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UsageReport'
                required: true
            responses:
                "202":
                    description: Usage accepted
            summary: Ingest batched usage metrics
            tags:
                - Cost & Quota
    /providers/{providerId}/publish:
        post:
            parameters:
                - in: path
                  name: providerId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                rollbackTimeoutMinutes:
                                    type: integer
                                rolloutStrategy:
                                    enum:
                                        - full
                                        - percentage
                                        - canary
                                    type: string
                                tenantWhitelist:
                                    items:
                                        $ref: '#/components/schemas/TenantRef'
                                    type: array
                            required:
                                - tenantWhitelist
                            type: object
                required: true
            responses:
                "200":
                    description: Rollout initiated
            summary: Publish a validated provider to target tenants with gray release controls
            tags:
                - Provider Registry
    /providers/{providerId}/validate:
        post:
            parameters:
                - in: path
                  name: providerId
                  required: true
                  schema:
                    type: string
                - in: query
                  name: suite
                  schema:
                    enum:
                        - llm
                        - vlm
                        - tts
                        - embeddings
                        - full
                    type: string
            responses:
                "202":
                    description: Validation started
            summary: Trigger automated validation suite for a provider
            tags:
                - Provider Registry
    /providers/register:
        post:
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProviderProfileInput'
                required: true
            responses:
                "202":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProviderProfile'
                    description: Provider draft created and sent to validation
            summary: Register or update a provider profile (draft state)
            tags:
                - Provider Registry
servers:
    - url: /
tags:
    - name: Provider Registry
    - name: Routing Policies
    - name: Connectors
    - name: Cost & Quota
