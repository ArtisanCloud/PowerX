id: com.powerx.plugins.scrm.template.list
type: API
version: 1.0.0
description: "查询模板列表的原子能力，支持分页与关键词过滤。"
rbac:
  resource: template
  actions: [read]
provides:
  - id: schema/input/com.powerx.plugins.scrm.template.list.v1
    path: schema/input/com.powerx.plugins.scrm.template.list.json
    kind: input
    version: 1.0.0
  - id: schema/output/com.powerx.plugins.scrm.template.list.v1
    path: schema/output/com.powerx.plugins.scrm.template.list.json
    kind: output
    version: 1.0.0
metadata:
  protocols:
    rest:
      method: GET
      path: /api/v1/templates
      description: "PowerX Gateway 统一鉴权后的 REST 列表入口"
    grpc:
      service: powerx.template.TemplateService
      method: ListTemplates
    agent_tool:
      id: com.powerx.plugins.scrm.template.list
      scope: agent.template.list
      transport: http
      endpoint: /api/v1/templates
