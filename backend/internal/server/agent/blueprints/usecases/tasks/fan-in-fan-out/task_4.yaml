flow_id: core.demo.fanin.task_4
name: "fan-in/fan-out：task_4"
version: "1.0"

metadata:
  io:
    inputs:
      - { name: upstream_id, type: string, required: true }
    outputs:
      - { name: id, type: string }
      - { name: timestamp, type: string }
  requires: ["core.demo.fanin.task_1"]
  intent:
    register: true
    group: "demo.fanin"
    matchers:
      - type: keyword
        any: ["扇出任务4","fan-in 任务4","执行任务4","执行task_4","t4 fanin"]
    embedding:
      title: "Fan-in/Fan-out：执行 task_4"
      synonyms: ["第四步","并发分支-4"]
    examples:
      positive: ["执行任务4"]
      negative: ["执行任务2","执行任务6"]

slots:
  - { name: upstream_id, type: string, required: true }

nodes:
  - id: n1
    use: core.debug.forward
    kind: biz_logic
    params: { id_ref: "{{ .input.upstream_id }}" }
    io:
      in_map:      { upstream_id: "{{ input.upstream_id }}" }
      out_map: { id: id, timestamp: timestamp }
  - id: n2
    use: core.response.format
    kind: text_proc
    params: { template: '{ "id":"{{ node.n1.output.id }}","from":"t4@fanin" }' }
    io:
      out_map: { id: id, timestamp: timestamp }
edges:
  - { from: n1, to: n2, type: SEQ }
