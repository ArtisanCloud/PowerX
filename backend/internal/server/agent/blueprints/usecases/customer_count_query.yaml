flow_id: "customer_count_query"
name: "查询客户数量"
version: "1.0.0"

metadata:
  domain: "crm"
  entity: "customer"
  version: "1.0.0"
  intent:
    matchers:
      - type: "keyword"
        any: ["客户数量", "客户统计", "统计客户", "count customers", "customer count"]
      - type: "pattern"
        regex: "(客户|customer).*(数量|count|多少)"
    examples:
      positive:
        - "查询客户数量"
        - "统计客户数量"
        - "客户数量有多少"
      negative:
        - "查询用户数量"
        - "查询用户数量"
        - "统计用户数量"

nodes:
  - id: n1_count
    use: core.debug.forward
    kind: biz_logic
    params:
      id_ref: "customer-count-demo"
    io:
      out_map:
        id: id
        timestamp: timestamp
  - id: n2_fmt
    use: core.response.format
    kind: text_proc
    params:
      template: '{ "metric":"customer_count","value":0,"note":"legacy blueprint migrated to nodes schema" }'

edges:
  - { from: n1_count, to: n2_fmt, type: SEQ }
