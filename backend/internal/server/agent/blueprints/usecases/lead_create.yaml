flow_id: "lead_create"
name: "新增线索记录"
version: "1.0.0"

metadata:
  domain: "crm"
  entity: "lead"
  version: "1.0.0"
  intent:
    matchers:
      - type: keyword
        any: [ "创建线索", "新增线索", "添加线索", "新建线索", "create lead", "add lead" ]
      - type: pattern
        regex: "(创建|新增|添加|新建).*(线索|lead)"
    examples:
      positive:
        - "创建线索"
        - "新增一个 lead"
        - "帮我添加销售线索"
        - "把这个客户信息存成线索"
      negative:
        - "删除线索"
        - "更新线索"
        - "查询线索"
        - "查找线索"
        - "查询线索详情"
        - "查找线索详情"
  description: "创建一条新的线索记录，关联到指定的客户。"
  notes: |
    这个用例主要用于处理线索的创建操作，包括从外部系统获取客户信息、生成线索记录并进行相应的事件和审计日志记录。

nodes:
  - id: n1_create
    use: core.debug.forward
    kind: biz_logic
    params:
      id_ref: "lead-create-demo"
    io:
      out_map:
        id: id
        timestamp: timestamp
  - id: n2_fmt
    use: core.response.format
    kind: text_proc
    params:
      template: '{ "status":"created","entity":"lead","note":"legacy blueprint migrated to nodes schema" }'

edges:
  - { from: n1_create, to: n2_fmt, type: SEQ }
