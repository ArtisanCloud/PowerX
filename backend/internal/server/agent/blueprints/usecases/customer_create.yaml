flow_id: "customer_create"
name: "新增客户记录"
version: "1.0.0"

metadata:
  domain: "crm"
  entity: "customer"
  version: "1.0.0"
  intent:
    matchers:
      - type: "keyword"
        any: ["创建客户", "新增客户", "add customer", "create customer"]
      - type: "pattern"
        regex: "(创建|新增|添加|新建).*(客户|customer)"
    examples:
      positive:
      - "创建一个新客户，名字叫张三，邮箱是zhangsan@example.com，由李四所有。"
      - "新增一位客户，姓名为李四，电子邮件地址为lisi@example.com，由王五负责管理。"
      - "添加一名客户，名字是赵六，邮箱是zhao6@example.com，由孙七负责。"
      negative:
        - "删除客户"
        - "更新客户"
        - "查询客户"
        - "查找客户"
        - "查询客户详情"
        - "查找客户详情"

nodes:
  - id: n1_create
    use: core.debug.forward
    kind: biz_logic
    params:
      id_ref: "customer-create-demo"
    io:
      out_map:
        id: id
        timestamp: timestamp
  - id: n2_fmt
    use: core.response.format
    kind: text_proc
    params:
      template: '{ "status":"created","entity":"customer","note":"legacy blueprint migrated to nodes schema" }'

edges:
  - { from: n1_create, to: n2_fmt, type: SEQ }
