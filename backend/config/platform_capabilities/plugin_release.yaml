version: 1
capabilities:
- capability_id: com.corex.plugin_release.signing_keys.manage
  title_i18n: {en: Manage Package Signing Keys, zh-CN: 管理安装包签名密钥}
  description_i18n: {en: Administer Core-owned offline package signing keys., zh-CN: 通过管理端治理底座托管的离线安装包签名密钥。}
  module: plugin_release
  title: Plugin Release Signing Key Manage
  description: Manage Core-owned offline package signing keys from the administration plane.
  permission_code: corex.plugin_release.signing_keys:manage
  agent_usable: false
  risk_level: critical
  categories: [plugin_release]
  intents: [plugin_release.signing_keys.manage]
  tool_scopes: [plugin_release.signing_keys.manage]
  policy: { prefer: rest }
  protocols:
  - channel: rest
    endpoint: /api/v1/plugin-release/signing-keys
    method: POST
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: plugin_release.signing_keys.manage
  - channel: rest
    endpoint: /api/v1/plugin-release/signing-keys/{key_uuid}/disable
    method: POST
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: plugin_release.signing_keys.manage
- capability_id: com.corex.plugin_release.sessions.read
  title_i18n: {en: Read Install Sessions, zh-CN: 读取安装会话}
  description_i18n: {en: Read install sessions in the credential tenant., zh-CN: 读取凭证所属租户的安装会话。}
  module: plugin_release
  title: Plugin Release Session Read
  description: Read an install session scoped to the calling service credential tenant.
  permission_code: corex.plugin_release.sessions:read
  agent_usable: false
  risk_level: high
  categories: [plugin_release]
  intents: [plugin_release.sessions.read]
  tool_scopes: [plugin_release.sessions.read]
  policy: { prefer: rest }
  docs: [specs/009-install-plugin-pxp/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: /api/v1/tenant/plugin-release/install-sessions/{session_uuid}
    method: GET
    schema_ref: specs/009-install-plugin-pxp/contracts/http-openapi.yaml#/paths/~1tenant~1plugin-release~1install-sessions~1{session_uuid}/get
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: plugin_release.sessions.read
    api_key:
      scope: _scope.plugin_release.sessions.read
      action: read
      resource_type: api
      resource_pattern: sessions
