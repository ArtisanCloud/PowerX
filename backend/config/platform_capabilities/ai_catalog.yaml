        auth_type: api_key_or_bearer
        actor_context: service_actor
        resource_scope: tenant
        sts_direct: false
        tool_scope: ai.catalog.read
        api_key:
          scope: _scope.ai.catalog.models.read
          action: read
          resource_type: api
