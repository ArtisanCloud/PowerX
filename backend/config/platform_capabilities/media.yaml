version: 1
capabilities:
- capability_id: com.corex.media.assets.read
  title_i18n: {en: Read Media Assets, zh-CN: 读取媒体资产}
  description_i18n: {en: Read media assets and variants in the credential tenant., zh-CN: 读取凭证所属租户的媒体资产与变体。}
  module: media
  title: Media Assets Read
  description: Read tenant-scoped media assets and UUID-addressable variants.
  permission_code: corex.media.assets:read
  agent_usable: false
  risk_level: low
  categories: [media]
  intents: [media.assets.read]
  tool_scopes: [media.assets.read]
  policy: {prefer: rest}
  docs: [specs/001-media-storage/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets"
    method: GET
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.read
    api_key:
      scope: _scope.media.assets.read
      action: read
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}"
    method: GET
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.read
    api_key:
      scope: _scope.media.assets.read
      action: read
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/variants/{variant_uuid}"
    method: GET
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.read
    api_key:
      scope: _scope.media.assets.read
      action: read
      resource_type: api
      resource_pattern: assets
- capability_id: com.corex.media.assets.manage
  title_i18n: {en: Manage Media Assets, zh-CN: 管理媒体资产}
  description_i18n: {en: Create and update or delete media assets in the credential tenant., zh-CN: 创建、更新或删除凭证所属租户的媒体资产。}
  module: media
  title: Media Assets Manage
  description: Create, update and delete tenant-scoped media assets.
  permission_code: corex.media.assets:manage
  agent_usable: false
  risk_level: high
  categories: [media]
  intents: [media.assets.manage]
  tool_scopes: [media.assets.manage]
  policy: {prefer: rest}
  docs: [specs/001-media-storage/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets"
    method: POST
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.manage
    api_key:
      scope: _scope.media.assets.manage
      action: manage
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}"
    method: PATCH
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.manage
    api_key:
      scope: _scope.media.assets.manage
      action: manage
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}"
    method: DELETE
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.manage
    api_key:
      scope: _scope.media.assets.manage
      action: manage
      resource_type: api
      resource_pattern: assets
- capability_id: com.corex.media.assets.transfer
  title_i18n: {en: Transfer Media Assets, zh-CN: 传输媒体资产}
  description_i18n: {en: Issue and consume short-lived media transfer tickets., zh-CN: 签发并使用短期媒体传输票据。}
  module: media
  title: Media Assets Transfer
  description: Issue, complete and consume short-lived Core media transfer tickets.
  permission_code: corex.media.assets:transfer
  agent_usable: false
  risk_level: high
  categories: [media]
  intents: [media.assets.transfer]
  tool_scopes: [media.assets.transfer]
  policy: {prefer: rest}
  docs: [specs/001-media-storage/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}/presign-upload"
    method: POST
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.transfer
    api_key:
      scope: _scope.media.assets.transfer
      action: transfer
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}/complete-upload"
    method: POST
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.transfer
    api_key:
      scope: _scope.media.assets.transfer
      action: transfer
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}/presign-download"
    method: POST
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.transfer
    api_key:
      scope: _scope.media.assets.transfer
      action: transfer
      resource_type: api
      resource_pattern: assets
  - channel: rest
    endpoint: "/api/v1/media/transfers/{asset_uuid}/upload"
    method: PUT
    auth_type: signed_ticket
    actor_context: service_actor
    resource_scope: ticket_scoped_asset
    sts_direct: false
    tool_scope: media.assets.transfer
  - channel: rest
    endpoint: "/api/v1/media/transfers/{asset_uuid}/download"
    method: GET
    auth_type: signed_ticket
    actor_context: service_actor
    resource_scope: ticket_scoped_asset
    sts_direct: false
    tool_scope: media.assets.transfer
- capability_id: com.corex.media.assets.variants.manage
  title_i18n: {en: Manage Media Variants, zh-CN: 管理媒体变体}
  description_i18n: {en: Create UUID-addressable variants in the credential tenant., zh-CN: 在凭证所属租户创建可通过 UUID 定位的媒体变体。}
  module: media
  title: Media Asset Variants Manage
  description: Create tenant-scoped UUID-addressable media variants.
  permission_code: corex.media.assets.variants:manage
  agent_usable: false
  risk_level: high
  categories: [media]
  intents: [media.assets.variants.manage]
  tool_scopes: [media.assets.variants.manage]
  policy: {prefer: rest}
  docs: [specs/001-media-storage/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/media/assets/{asset_uuid}/variants"
    method: POST
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: media.assets.variants.manage
    api_key:
      scope: _scope.media.assets.variants.manage
      action: manage
      resource_type: api
      resource_pattern: variants
