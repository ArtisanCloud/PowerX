- capability_id: com.corex.iam.authorization.check
  module: iam
  title: IAM Tenant Authorization Check
  description: Evaluate a declared IAM permission for a tenant member without allowing any IAM mutation.
  permission_code: corex.iam.authorization:check
  agent_usable: false
  risk_level: high
  categories: [iam, authorization]
  intents: [iam.authorization.check]
  tool_scopes: [iam.authorization.check]
  policy:
    prefer: rest
  docs: [specs/026-iam/contracts/http-openapi.yaml]
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/iam/authorization:check"
    method: POST
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1tenant~1iam~1authorization:check/post
    auth_type: api_key_or_bearer
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: iam.authorization.check
  title_i18n:
    en: IAM Tenant Authorization Check
    zh-CN: IAM 租户授权判定
  description_i18n:
    en: Evaluate a declared IAM permission for a tenant member without allowing any IAM mutation.
    zh-CN: 判定租户成员的已声明 IAM 权限，不允许通过该能力修改 IAM 数据。
