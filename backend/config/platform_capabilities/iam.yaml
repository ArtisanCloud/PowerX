version: 1
capabilities:
  - capability_id: com.corex.iam.registration_policy.admin_manage
    module: iam
    title: IAM Registration Policy Administration
    description: Manage platform tenant registration policy, invite code batches, and registration request approvals from the root admin surface.
    permission_code: corex.iam.registration_policy:admin_manage
    agent_usable: false
    risk_level: high
    categories: [iam, registration, admin]
    intents: [iam.registration_policy.admin_manage]
    tool_scopes: [iam.registration_policy.admin_manage]
    policy:
      prefer: rest
    docs:
      - specs/026-iam/contracts/http-openapi.yaml
    protocols:
      - channel: rest
        endpoint: /api/v1/admin/registration-policy
        method: GET
        schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1admin~1registration-policy/get
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: platform
        sts_direct: false
        tool_scope: iam.registration_policy.admin_manage
      - channel: rest
        endpoint: /api/v1/admin/registration-policy
        method: PUT
        schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1admin~1registration-policy/put
