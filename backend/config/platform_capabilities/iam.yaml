  protocols:
  - channel: rest
    endpoint: "/api/v1/admin/registration-policy"
    method: GET
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1admin~1registration-policy/get
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.registration_policy.admin_manage
  - channel: rest
    endpoint: "/api/v1/admin/registration-policy"
    method: PUT
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1admin~1registration-policy/put
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.registration_policy.admin_manage
