- capability_id: com.corex.iam.permissions.catalog_read
  module: iam
  title: IAM Permission Catalog Read
  description: Read IAM permission catalogs from the admin surface, including plugin-grouped permission catalogs used by role and permission configuration pages.
  permission_code: corex.iam.permissions:read
  agent_usable: false
  risk_level: medium
  categories:
  - iam
  - permissions
  - admin
  intents:
  - iam.permissions.catalog_read
  tool_scopes:
  - iam.permissions.catalog_read
  policy:
    prefer: rest
  docs:
  - specs/026-iam/contracts/http-openapi.yaml
  protocols:
  - channel: rest
    endpoint: "/api/v1/admin/iam/permissions"
    method: GET
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.permissions.catalog_read
  - channel: rest
    endpoint: "/api/v1/admin/iam/permissions/catalog"
    method: GET
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.permissions.catalog_read
  - channel: rest
    endpoint: "/api/v1/admin/iam/permissions/plugin-catalog"
    method: GET
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.permissions.catalog_read
  title_i18n:
    en: IAM Permission Catalog Read
  description_i18n:
    en: Read IAM permission catalogs from the admin surface, including plugin-grouped permission catalogs used by role and permission configuration pages.
- capability_id: com.corex.iam.permissions.cleanup
  module: iam
  title: IAM Permission Registration Cleanup
  description: Clean invalid plugin permission registrations from the admin surface after capability declaration validation fails.
  permission_code: corex.iam.permissions:cleanup
  agent_usable: false
  risk_level: high
  categories:
  - iam
  - permissions
  - admin
  intents:
  - iam.permissions.cleanup
  tool_scopes:
  - iam.permissions.cleanup
  policy:
    prefer: rest
  docs:
  - backend/internal/transport/http/admin/iam/api.go
  protocols:
  - channel: rest
    endpoint: "/api/v1/admin/iam/permissions/plugin-invalid"
    method: DELETE
    auth_type: user_jwt
    actor_context: admin_user
    resource_scope: platform
    sts_direct: false
    tool_scope: iam.permissions.cleanup
  title_i18n:
    zh-CN: IAM 权限异常登记清理
    en: IAM Permission Registration Cleanup
  description_i18n:
    zh-CN: 在插件能力声明校验失败后，从后台清理异常插件权限登记。
    en: Clean invalid plugin permission registrations from the admin surface after capability declaration validation fails.
- capability_id: com.corex.iam.roles.read
  module: iam
  title: IAM Tenant Role Catalog
  description: List bindable tenant roles for plugin service workflows. The endpoint returns role_user and plugin-managed roles in the current STS tenant without exposing admin, owner, root, system, or numeric role identifiers.
  permission_code: corex.iam.roles:read
  agent_usable: false
  risk_level: high
  categories:
  - iam
  - provisioning
  intents:
  - iam.roles.read
  tool_scopes:
  - iam.roles.read
  policy:
    prefer: rest
  docs:
  - specs/026-iam/contracts/http-openapi.yaml
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/iam/roles/provisionable"
    method: GET
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1tenant~1iam~1roles~1provisionable/get
    auth_type: tenant_jwt
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: iam.roles.read
  title_i18n:
    en: IAM Tenant Role Catalog
  description_i18n:
    en: List bindable tenant roles for plugin service workflows. The endpoint returns role_user and plugin-managed roles in the current STS tenant without exposing admin, owner, root, system, or numeric role identifiers.
- capability_id: com.corex.iam.roles.provision
  module: iam
  title: IAM Tenant Role Provisioning
  description: Provision plugin-managed tenant roles for the current STS tenant. This service identity capability cannot create system, owner, admin, builtin, or unrestricted IAM roles.
  permission_code: corex.iam.roles:provision
  agent_usable: false
  risk_level: critical
  categories:
  - iam
  - provisioning
  intents:
  - iam.roles.provision
  tool_scopes:
  - iam.roles.provision
  policy:
    prefer: rest
  docs:
  - specs/026-iam/contracts/http-openapi.yaml
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/iam/roles/provision"
    method: POST
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1tenant~1iam~1roles~1provision/post
    auth_type: tenant_jwt
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: iam.roles.provision
  title_i18n:
    en: IAM Tenant Role Provisioning
  description_i18n:
    en: Provision plugin-managed tenant roles for the current STS tenant. This service identity capability cannot create system, owner, admin, builtin, or unrestricted IAM roles.
- capability_id: com.corex.iam.members.provision
  module: iam
  title: IAM Tenant Member Provisioning
  description: Provision tenant users and members from a plugin service identity. The endpoint is tenant-scoped, forbids root/system admin creation, and only binds role_user or plugin-managed roles.
  permission_code: corex.iam.members:provision
  agent_usable: false
  risk_level: critical
  categories:
  - iam
  - provisioning
  intents:
  - iam.members.provision
  tool_scopes:
  - iam.members.provision
  policy:
    prefer: rest
  docs:
  - specs/026-iam/contracts/http-openapi.yaml
  protocols:
  - channel: rest
    endpoint: "/api/v1/tenant/iam/members/provision"
    method: POST
    schema_ref: specs/026-iam/contracts/http-openapi.yaml#/paths/~1tenant~1iam~1members~1provision/post
    auth_type: tenant_jwt
    actor_context: service_actor
    resource_scope: tenant
    sts_direct: true
    tool_scope: iam.members.provision
  title_i18n:
    en: IAM Tenant Member Provisioning
  description_i18n:
    en: Provision tenant users and members from a plugin service identity. The endpoint is tenant-scoped, forbids root/system admin creation, and only binds role_user or plugin-managed roles.
