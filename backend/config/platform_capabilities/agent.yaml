version: 1
capabilities:
  - capability_id: com.corex.agent.invoke
    module: agent
    title: Agent Invoke
    description: 非流式调用 Agent 对话。
    categories: [agent, ai]
    intents: [agent.invoke]
    tool_scopes: [agent.runtime]
    policy:
      prefer: rest
      fallback: [grpc]
    docs:
      - specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml
      - backend/api/grpc/contracts/powerx/agent/v1/agent_api.proto
    protocols:
      - channel: rest
        endpoint: /api/v1/agents/invoke
        method: POST
        schema_ref: specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml#/paths/~1agents~1invoke/post
        auth_type: tenant_jwt
        tool_scope: agent.runtime
      - channel: grpc
        endpoint: powerx.agent.v1.AgentInvokeService
        rpc: Invoke
        schema_ref: backend/api/grpc/contracts/powerx/agent/v1/agent_api.proto#AgentInvokeService
        auth_type: tenant_jwt
        tool_scope: agent.runtime
  - capability_id: com.corex.agent.stream
    module: agent
    title: Agent Stream
    description: 通过 SSE/gRPC 流式输出 Agent 对话内容。
    categories: [agent, ai]
    intents: [agent.stream]
    tool_scopes: [agent.runtime]
    policy:
      prefer: rest
    docs:
      - specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml
      - backend/api/grpc/contracts/powerx/agent/v1/stream.proto
    protocols:
      - channel: rest
        endpoint: /api/v1/agents/stream/sse
        method: GET
        schema_ref: specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml#/paths/~1agents~1stream~1sse/get
        auth_type: tenant_jwt
        tool_scope: agent.runtime
      - channel: grpc
        endpoint: powerx.agent.v1.AgentStreamService
        rpc: Stream
        schema_ref: backend/api/grpc/contracts/powerx/agent/v1/stream.proto#AgentStreamService
        auth_type: tenant_jwt
        tool_scope: agent.runtime
  - capability_id: com.corex.agent.session.manage
    module: agent
    title: Agent Session Management
    description: 创建会话与管理消息。
    categories: [agent, ai]
    intents: [agent.session.manage]
    tool_scopes: [agent.session]
    policy:
      prefer: rest
      fallback: [grpc]
    docs:
      - specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml
      - backend/api/grpc/contracts/powerx/agent/v1/agent_api.proto
    protocols:
      - channel: rest
        endpoint: /api/v1/agents/sessions
        method: POST
        schema_ref: specs/007-integration-gateway-and-mcp/contracts/agent.http-openapi.yaml#/paths/~1agents~1sessions/post
        auth_type: tenant_jwt
        tool_scope: agent.session
      - channel: grpc
        endpoint: powerx.agent.v1.AgentSessionService
        rpc: CreateSession
        schema_ref: backend/api/grpc/contracts/powerx/agent/v1/agent_api.proto#AgentSessionService
        auth_type: tenant_jwt
        tool_scope: agent.session
