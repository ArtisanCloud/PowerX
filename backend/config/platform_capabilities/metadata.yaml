version: 1
capabilities:
  - capability_id: com.corex.metadata.dictionary.read
    module: metadata
    title: Metadata Dictionary Read
    description: Read tenant metadata dictionary namespaces and items.
    permission_code: metadata.dictionary:read
    agent_usable: false
    risk_level: low
    categories: [metadata, dictionary]
    intents: [metadata.dictionary.read]
    tool_scopes: [metadata.dictionary.read]
    policy:
      prefer: rest
    protocols:
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionaries
        method: GET
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.read
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionaries/{namespace_uuid}/items
        method: GET
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.read
  - capability_id: com.corex.metadata.dictionary.manage
    module: metadata
    title: Metadata Dictionary Management
    description: Create, update, and delete tenant metadata dictionary definitions.
    permission_code: metadata.dictionary:manage
    agent_usable: false
    risk_level: medium
    categories: [metadata, dictionary]
    intents: [metadata.dictionary.manage]
    tool_scopes: [metadata.dictionary.manage]
    policy:
      prefer: rest
    protocols:
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionaries
        method: POST
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.manage
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionaries/{namespace_uuid}
        method: PATCH
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.manage
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionary-items/{item_uuid}
        method: PATCH
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.manage
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionaries/{namespace_uuid}/items
        method: POST
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.manage
      - channel: rest
        endpoint: /api/v1/admin/metadata/dictionary-items/{item_uuid}
        method: DELETE
        auth_type: user_jwt
        actor_context: admin_user
        resource_scope: tenant
        sts_direct: false
        tool_scope: metadata.dictionary.manage
