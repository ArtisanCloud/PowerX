version: 1
capabilities:
  - capability_id: com.corex.ai.llm.invoke
    module: ai
    title: LLM Invoke
    description: 大语言模型无状态调用。
    categories: [ai, llm]
    intents: [ai.llm.invoke]
    tool_scopes: [ai.llm]
    policy:
      prefer: rest
      fallback: [grpc]
    docs:
      - specs/007-integration-gateway-and-mcp/contracts/ai-multimodal.http-openapi.yaml
      - backend/api/grpc/contracts/powerx/ai/v1/multimodal.proto
    protocols:
      - channel: rest
        endpoint: /api/v1/ai/llm/invoke
        method: POST
        schema_ref: specs/007-integration-gateway-and-mcp/contracts/ai-multimodal.http-openapi.yaml#/paths/~1ai~1llm~1invoke/post
        auth_type: tenant_jwt
        tool_scope: ai.llm
      - channel: grpc
        endpoint: powerx.ai.v1.MultimodalService
        rpc: Invoke
        schema_ref: backend/api/grpc/contracts/powerx/ai/v1/multimodal.proto#MultimodalService
        auth_type: tenant_jwt
        tool_scope: ai.llm
