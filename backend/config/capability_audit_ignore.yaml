routes:
  - method: GET
    path: /api/v1/admin/ops/backup/jobs/:job_id/download
    category: root_runtime_control
    reason: Full-database file downloads require a Root user session and must never be published to tenants or plugins.
  - method: POST
    path: /api/v1/admin/ops/backup/archives/jobs
    category: root_runtime_control
    reason: One-time whole-site media exports require a Root user session and must never be published to tenants or plugins.
  - method: GET
    path: /api/v1/public/saas/registration-policy/effective
    category: public_registration
    reason: Public registration policy summary is anonymous signup UX metadata and must not be registered as a tenant capability.
  - method: POST
    path: /api/v1/public/saas/registration-requests
    category: public_registration
    reason: Public registration request submission is an anonymous tenant signup entry and must not be registered as a tenant capability.
  - method: POST
    path: /api/v1/tenant/iam/members:operation
    category: transport_route_adapter
    reason: Gin requires the two declared colon-action member directory contracts to share a parameterized dispatcher route; the formal IAM directory capability declares the concrete batch-get and batch-resolve endpoints.
  - method: POST
    path: /api/v1/tenant/knowledge/spaces/:space_uuid/indexes:operation
    category: transport_route_adapter
    reason: Gin requires the declared indexes:rebuild action to use a constrained parameter dispatcher; the formal Knowledge Document Manage capability declares only the concrete rebuild endpoint.
  - method: POST
    path: /api/v1/tenant/knowledge/spaces/:space_uuid/documents/:document_uuid/indexes:operation
    category: transport_route_adapter
    reason: Constrained Gin dispatcher accepts only indexes:rebuild; the formal Knowledge Document Manage service capability declares the concrete single-document rebuild endpoint.
  - method: POST
    path: /api/v1/admin/knowledge-spaces/:spaceId/documents/:documentId/indexes:operation
    category: transport_route_adapter
    reason: Constrained Gin dispatcher accepts only indexes:rebuild; the same formal document capability declares the concrete Admin JWT/RBAC document rebuild endpoint.
  - method: POST
    path: /api/v1/admin/ops/backup/restore-copies/imports
    category: root_runtime_control
    reason: Root user session only; full database restore copies and credentials are cluster operations and must not become tenant or plugin capabilities.
