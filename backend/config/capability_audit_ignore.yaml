routes:
  - method: GET
    path: /api/v1/public/saas/registration-policy/effective
    category: public_registration
    reason: Public registration policy summary is anonymous signup UX metadata and must not be registered as a tenant capability.
  - method: POST
    path: /api/v1/public/saas/registration-requests
    category: public_registration
    reason: Public registration request submission is an anonymous tenant signup entry and must not be registered as a tenant capability.
  - method: POST
    path: /api/v1/tenant/iam/members:operation
    category: transport_route_adapter
    reason: Gin requires the two declared colon-action member directory contracts to share a parameterized dispatcher route; the formal IAM directory capability declares the concrete batch-get and batch-resolve endpoints.
  - method: POST
    path: /api/v1/tenant/knowledge/spaces/:space_uuid/indexes:operation
    category: transport_route_adapter
    reason: Gin requires the declared indexes:rebuild action to use a constrained parameter dispatcher; the formal Knowledge Document Manage capability declares only the concrete rebuild endpoint.
