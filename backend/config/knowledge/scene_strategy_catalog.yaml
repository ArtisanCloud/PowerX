version: 1
kind: scene_strategy_catalog

# 单一事实来源（SSOT）：Web Admin 的“场景（L1）→策略包（L2）”选择、以及后端的前置依赖校验/推荐规则，都应以此文件为准。
# 设计依据：
# - docs/plan/AI_engineering/knowledge/rag.md
# - docs/plan/AI_engineering/knowledge/rag_scene_strategy_mode.md

modules:
  # A: Simple RAG（简单切块 + 向量召回）
  A_simple:
    label: "Simple RAG"
    requires: ["index.dense"]
  # A1: Query Routing（查询路由）
  A1_routing:
    label: "Query Routing"
    requires: []
  # A2: Time-aware RAG（时间感知）
  A2_time_aware:
    label: "Time-aware"
    requires: ["index.time_fields"]
  # B: Semantic Chunking（语义切块）
  B_semantic_chunking:
    label: "Semantic Chunking"
    requires: ["asset.section_summaries"]
  # C: Context Enriched Retrieval（上下文扩展）
  C_context_enriched:
    label: "Context Enriched"
    requires: ["index.hier"]
  # D: Document Augmentation（离线增强）
  D_doc_augmentation:
    label: "Document Augmentation"
    requires: ["asset.augmented_fields"]
  # E: Query Transformation（查询转换）
  E_query_transform:
    label: "Query Transformation"
    requires: []
  # F: Reranker（重排）
  F_rerank:
    label: "Reranker"
    requires: ["runtime.rerank"]
  # G: RSE（语义扩展重排）
  G_rse:
    label: "RSE"
    requires: ["asset.domain_lexicon"]
  # H: Fusion（融合：vector+bm25+kg+hier）
  H_fusion:
    label: "Fusion (Hybrid/RRF)"
    requires: ["index.dense", "index.sparse"]
  # I: HyDE
  I_hyde:
    label: "HyDE"
    requires: ["runtime.llm", "index.dense"]
  # J: Hierarchical Indices（层次索引）
  J_hier:
    label: "Hierarchical Indices"
    requires: ["index.hier", "asset.section_summaries"]
  # K: Knowledge Graph（知识图谱）
  K_kg:
    label: "Knowledge Graph"
    requires: ["index.kg"]
  # L: Feedback Loop（反馈闭环）
  L_feedback:
    label: "Feedback Loop"
    requires: ["runtime.feedback"]
  # M: Adaptive RAG（自适应）
  M_adaptive:
    label: "Adaptive RAG"
    requires: ["runtime.policy_router"]
  # N: Self RAG（自反思回路）
  N_self_rag:
    label: "Self RAG"
    requires: ["runtime.llm", "runtime.evidence_checker"]
  # O: CRAG（纠错）
  O_crag:
    label: "CRAG"
    requires: ["runtime.evidence_checker", "index.sparse"]

strategy_packages:
  A0_acl:
    label: "A0 Metadata/ACL 优先过滤"
    summary: "先做租户/权限/元数据过滤，再做召回，保证合规降噪。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes:
      [
        "product_specs",
        "product_compat",
        "product_selection",
        "sop",
        "contract_quote",
        "research_longdoc",
        "ledger_table",
        "support_faq",
        "support_policy",
        "support_troubleshooting",
        "eng_runbook",
        "eng_incident",
        "eng_change",
        "api_reference",
        "data_dictionary",
        "sales_enablement",
        "marketing_promo_rules",
        "compliance_regulation",
        "billing_pricing",
        "meeting_minutes",
        "project_docs",
        "ticket_conversations",
        "onboarding_training",
        "sql_kg",
        "custom_expert",
      ]
    dependencies:
      index: []
      runtime: ["acl_enforcer"]
      assets: ["metadata.normalized"]

  A1_routing:
    label: "A1 Query Routing（查询路由）"
    summary: "按意图/领域把 query 路由到不同索引通道或空间。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["product_specs", "support_faq", "support_policy", "eng_runbook", "compliance_regulation", "sales_enablement", "marketing_promo_rules", "project_docs", "custom_expert"]
    dependencies:
      index: []
      runtime: ["routing_policy"]
      assets: ["domain_router_map"]

  A2_time_aware:
    label: "A2 Time-aware（时间/版本）"
    summary: "对版本/生效时间做过滤或权重衰减。"
    coupling: "strong"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes: ["contract_quote", "compliance_regulation", "billing_pricing", "marketing_promo_rules", "product_specs"]
    dependencies:
      index: ["index.time_fields"]
      runtime: ["versioning_policy"]
      assets: ["effective_date_fields"]

  A_simple:
    label: "A Simple RAG（最小闭环）"
    summary: "简单切块 + 向量召回，适合快速验证。"
    coupling: "weak"
    recommended_profile_key: "p0_basic"
    recommended_scenes: ["sop", "support_faq", "support_policy", "support_troubleshooting", "eng_runbook", "meeting_minutes", "project_docs", "onboarding_training"]
    dependencies:
      index: ["index.dense"]
      runtime: []
      assets: []

  B_semantic_chunking:
    label: "B Semantic Chunking（语义切块）"
    summary: "按语义边界切块，适合论文/长报告。"
    coupling: "strong"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["research_longdoc", "project_docs", "meeting_minutes"]
    dependencies:
      index: ["index.dense"]
      runtime: []
      assets: ["semantic_boundaries"]

  C_context_enriched:
    label: "C Context Enriched（上下文增强）"
    summary: "召回后扩展同章节邻居/父摘要。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["sop", "contract_quote", "eng_runbook", "support_policy", "compliance_regulation"]
    dependencies:
      index: ["index.hier"]
      runtime: []
      assets: ["section_neighbors"]

  D_doc_augmentation:
    label: "D Doc Augmentation（离线增强）"
    summary: "生成摘要/关键词/实体标签等增强字段。"
    coupling: "strong"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes: ["contract_quote", "product_specs", "sales_enablement", "marketing_promo_rules", "compliance_regulation"]
    dependencies:
      index: ["index.structured_fields"]
      runtime: ["offline_pipeline"]
      assets: ["augmented_fields"]

  E_query_transform:
    label: "E Query Transformation（查询转换）"
    summary: "同义扩展/结构化抽取/纠错。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["product_specs", "data_dictionary", "api_reference", "billing_pricing"]
    dependencies:
      index: ["index.structured_fields"]
      runtime: ["query_rewrite"]
      assets: ["synonyms_rules"]

  F_rerank:
    label: "F Reranker（重排序）"
    summary: "降低相似候选误命中。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["product_specs", "product_compat", "contract_quote", "compliance_regulation", "data_dictionary", "api_reference"]
    dependencies:
      index: ["index.dense"]
      runtime: ["reranker_model"]
      assets: []

  G_rse:
    label: "G RSE（语义扩展重排）"
    summary: "语义扩展 + 重排，适合术语多的场景。"
    coupling: "weak"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes: ["product_specs", "product_compat", "data_dictionary", "api_reference", "sql_kg"]
    dependencies:
      index: ["index.dense"]
      runtime: ["reranker_model"]
      assets: ["domain_lexicon"]

  H_fusion:
    label: "H Fusion（融合检索）"
    summary: "dense+sparse(+kg/hier) 多路召回融合。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes:
      [
        "product_specs",
        "product_compat",
        "product_selection",
        "sop",
        "contract_quote",
        "research_longdoc",
        "ledger_table",
        "support_faq",
        "support_policy",
        "support_troubleshooting",
        "eng_runbook",
        "eng_incident",
        "eng_change",
        "api_reference",
        "data_dictionary",
        "sales_enablement",
        "marketing_promo_rules",
        "compliance_regulation",
        "billing_pricing",
        "meeting_minutes",
        "project_docs",
        "ticket_conversations",
        "onboarding_training",
        "sql_kg",
      ]
    dependencies:
      index: ["index.dense", "index.sparse"]
      runtime: ["score_normalizer"]
      assets: []

  I_hyde:
    label: "I HyDE（假设文档检索）"
    summary: "生成假设答案后再向量检索。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["research_longdoc", "project_docs", "meeting_minutes"]
    dependencies:
      index: ["index.dense"]
      runtime: ["llm_generate"]
      assets: []

  J_hier:
    label: "J Hierarchical Indices（层次索引）"
    summary: "先章节/摘要，再下钻 chunk。"
    coupling: "strong"
    recommended_profile_key: "p1_general"
    recommended_scenes: ["sop", "research_longdoc", "eng_runbook", "compliance_regulation"]
    dependencies:
      index: ["index.hier"]
      runtime: []
      assets: ["section_summaries"]

  K_kg:
    label: "K Knowledge Graph（知识图谱）"
    summary: "实体/关系召回与约束。"
    coupling: "strong"
    recommended_profile_key: "p3_kg_strong"
    recommended_scenes: ["product_compat", "data_dictionary", "api_reference", "sql_kg", "compliance_regulation"]
    dependencies:
      index: ["index.kg"]
      runtime: ["graph_query"]
      assets: ["kg_entities_relations"]

  L_feedback:
    label: "L Feedback Loop（反馈闭环）"
    summary: "标注→再加工→回归评估。"
    coupling: "weak"
    recommended_profile_key: "p1_general"
    recommended_scenes:
      [
        "product_specs",
        "product_compat",
        "product_selection",
        "sop",
        "contract_quote",
        "research_longdoc",
        "ledger_table",
        "support_faq",
        "support_policy",
        "support_troubleshooting",
        "eng_runbook",
        "eng_incident",
        "eng_change",
        "api_reference",
        "data_dictionary",
        "sales_enablement",
        "marketing_promo_rules",
        "compliance_regulation",
        "billing_pricing",
        "meeting_minutes",
        "project_docs",
        "ticket_conversations",
        "onboarding_training",
        "sql_kg",
        "custom_expert",
      ]
    dependencies:
      index: []
      runtime: ["feedback_workflow"]
      assets: ["feedback_case"]

  M_adaptive:
    label: "M Adaptive RAG（自适应策略）"
    summary: "按置信度/成本动态启用策略。"
    coupling: "weak"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes:
      [
        "product_specs",
        "product_compat",
        "product_selection",
        "sop",
        "contract_quote",
        "research_longdoc",
        "ledger_table",
        "support_faq",
        "support_policy",
        "support_troubleshooting",
        "eng_runbook",
        "eng_incident",
        "eng_change",
        "api_reference",
        "data_dictionary",
        "sales_enablement",
        "marketing_promo_rules",
        "compliance_regulation",
        "billing_pricing",
        "meeting_minutes",
        "project_docs",
        "ticket_conversations",
        "onboarding_training",
        "sql_kg",
        "custom_expert",
      ]
    dependencies:
      index: []
      runtime: ["policy_router"]
      assets: ["observability_metrics"]

  N_self_rag:
    label: "N Self RAG（自反思回路）"
    summary: "自检证据与冲突，触发二次检索。"
    coupling: "weak"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes: ["contract_quote", "compliance_regulation", "billing_pricing"]
    dependencies:
      index: []
      runtime: ["consistency_checker"]
      assets: ["evidence_guardrails"]

  O_crag:
    label: "O CRAG（纠错）"
    summary: "证据不足/冲突时触发纠错检索。"
    coupling: "strong"
    recommended_profile_key: "p2_high_accuracy"
    recommended_scenes: ["contract_quote", "compliance_regulation", "billing_pricing", "product_specs"]
    dependencies:
      index: ["index.dense", "index.sparse"]
      runtime: ["consistency_checker"]
      assets: []

strategy_bundles:
  p0_basic:
    label: "P0 基础（最小闭环）"
    description: "最少干预：仅 dense 召回 + 引用返回；不开 multiquery/HyDE/rerank/KG/self-check。"
    prerequisites: ["index.dense"]
    default_modules: ["A_simple", "L_feedback"]
    guardrails:
      must_cite_sources: true
      max_queries: 1
      rerank_topk: 0
      self_rag_max_loops: 0
      hyde_enabled: false

  p1_general:
    label: "P1 通用推荐（企业默认）"
    description: "hybrid + RRF + 轻量 rerank + contextual（按场景启用 hier）。"
    prerequisites: ["index.dense", "index.sparse"]
    default_modules: ["H_fusion", "F_rerank", "C_context_enriched", "L_feedback"]
    guardrails:
      must_cite_sources: true
      max_queries: 3
      rerank_topk: 10
      self_rag_max_loops: 0
      hyde_enabled: false

  p2_high_accuracy:
    label: "P2 高准确/合规（证据优先）"
    description: "sparse 优先 + hybrid + CRAG/可选 self-check + time-aware（按场景）。"
    prerequisites: ["index.dense", "index.sparse", "runtime.evidence_checker"]
    default_modules: ["H_fusion", "O_crag", "F_rerank", "L_feedback"]
    guardrails:
      must_cite_sources: true
      min_evidence_chunks: 2
      max_queries: 3
      rerank_topk: 10
      self_rag_max_loops: 1
      hyde_enabled: false

  p3_kg_strong:
    label: "P3 KG 约束（关系驱动）"
    description: "KG recall/filter + hybrid + cite，适用于依赖/约束/关系查询。"
    prerequisites: ["index.kg", "index.sparse", "index.dense"]
    default_modules: ["K_kg", "H_fusion", "C_context_enriched", "L_feedback"]
    guardrails:
      must_cite_sources: true
      max_queries: 2
      rerank_topk: 10
      self_rag_max_loops: 0
      hyde_enabled: false

scenes:
  product_specs:
    label: "产品库 / 规格参数查询"
    description: "参数/型号/价格/口径等事实精确型查询；混合数据源常见（DB+文档）。"
    default_bundle: "p2_high_accuracy"
    allowed_bundles: ["p1_general", "p2_high_accuracy", "p3_kg_strong"]
    default_modules: ["H_fusion", "O_crag", "F_rerank", "E_query_transform", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.structured_fields"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "structured_fields_card"
        unit: "chars"
        chunk_size: 700
        overlap: 120
        separators: ["\\n\\n", "\\n", "。", "；", ":", "："]

  product_compat:
    label: "产品库 / 兼容性与配件关系"
    description: "兼容矩阵/配件关系/约束条件；可选 KG 强化解释与过滤。"
    default_bundle: "p2_high_accuracy"
    allowed_bundles: ["p1_general", "p2_high_accuracy", "p3_kg_strong"]
    default_modules: ["H_fusion", "O_crag", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.structured_fields"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "structured_compat"
        unit: "chars"
        chunk_size: 800
        overlap: 120
        separators: ["\\n\\n", "\\n", "兼容", "不兼容", "支持", "不支持", "：", ":"]

  product_selection:
    label: "产品库 / 选型对比与推荐理由"
    description: "方案对比/选型决策；更偏解释归纳，但仍需可追溯引用。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["H_fusion", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "structured"
        unit: "chars"
        chunk_size: 900
        overlap: 150
        separators: ["\\n\\n", "\\n", "对比", "推荐", "理由", "。", "；"]

  sop:
    label: "SOP/制度/产品说明"
    description: "Markdown/Word 为主，结构清晰，常见查询为流程/解释归纳。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["H_fusion", "F_rerank", "C_context_enriched", "J_hier", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.hier"]
      assets: ["asset.section_summaries"]
    ingestion_defaults:
      chunking:
        mode: "structured"
        unit: "chars"
        chunk_size: 800
        overlap: 120
        separators: ["\\n\\n", "\\n", "。", "！", "？", "；"]

  contract_quote:
    label: "合同/报价"
    description: "PDF/Word/Excel 表格多；事实查找+合规风险高，默认证据优先。"
    default_bundle: "p2_high_accuracy"
    allowed_bundles: ["p1_general", "p2_high_accuracy", "p3_kg_strong"]
    default_modules: ["H_fusion", "A2_time_aware", "O_crag", "F_rerank", "D_doc_augmentation", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.time_fields", "index.structured_fields"]
      assets: ["asset.augmented_fields"]
    ingestion_defaults:
      chunking:
        mode: "structured_clause_table"
        unit: "chars"
        chunk_size: 900
        overlap: 150
        separators: ["\\n\\n", "\\n", "条", "款", "。", "；"]

  research_longdoc:
    label: "论文/研究/长报告"
    description: "PDF 长文；需要语义切块与层次索引，支持 hier-first 与 HyDE（可选）。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["B_semantic_chunking", "J_hier", "H_fusion", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.hier"]
      assets: ["asset.section_summaries"]
    ingestion_defaults:
      chunking:
        mode: "semantic"
        unit: "chars"
        chunk_size: 1200
        overlap: 200
        separators: ["\\n\\n", "\\n", "。", "！", "？"]

  ledger_table:
    label: "台账/清单（表格）"
    description: "Excel/CSV 结构化行；以精确过滤/字段查询为主。"
    default_bundle: "p2_high_accuracy"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["H_fusion", "F_rerank", "O_crag", "L_feedback"]
    prerequisites:
      index: ["index.sparse", "index.structured_fields", "index.dense"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "row"
        unit: "records"
        chunk_size: 1
        overlap: 0
        separators: []

  support_faq:
    label: "客服 / FAQ 与使用说明"
    description: "问答粒度、同义表达多；强调命中率与可解释引用。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["H_fusion", "E_query_transform", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "qna"
        unit: "chars"
        chunk_size: 500
        overlap: 80
        separators: ["\\n\\n", "\\n", "Q:", "A:", "？", "。"]

  support_policy:
    label: "客服 / 售后政策与规则"
    description: "退款/保修/条款政策；高风险答复需要强证据与纠错。"
    default_bundle: "p2_high_accuracy"
    allowed_bundles: ["p1_general", "p2_high_accuracy"]
    default_modules: ["H_fusion", "O_crag", "F_rerank", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse"]
      assets: []
    ingestion_defaults:
      chunking:
        mode: "policy_clause"
        unit: "chars"
        chunk_size: 900
        overlap: 150
        separators: ["\\n\\n", "\\n", "条", "款", "。", "；"]

  support_troubleshooting:
    label: "客服 / 故障现象与排查"
    description: "现象→原因→处理步骤；需要步骤链路与上下文补齐。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy", "p3_kg_strong"]
    default_modules: ["J_hier", "H_fusion", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.hier"]
      assets: ["asset.section_summaries"]
    ingestion_defaults:
      chunking:
        mode: "structured_steps"
        unit: "chars"
        chunk_size: 900
        overlap: 150
        separators: ["\\n\\n", "\\n", "步骤", "Step", "。", "；"]

  eng_runbook:
    label: "工程 / Runbook 与标准操作"
    description: "标准操作/手册；章节与步骤链路清晰，强调上下文。"
    default_bundle: "p1_general"
    allowed_bundles: ["p0_basic", "p1_general", "p2_high_accuracy"]
    default_modules: ["J_hier", "H_fusion", "F_rerank", "C_context_enriched", "L_feedback"]
    prerequisites:
      index: ["index.dense", "index.sparse", "index.hier"]
      assets: ["asset.section_summaries"]
    ingestion_defaults:
