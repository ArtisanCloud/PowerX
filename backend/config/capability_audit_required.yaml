required_capabilities:
  - capability_id: com.corex.storage.datasets.execution_worker
    source: corex.storage.datasets
    reason: Plugin storage execution requires an explicit STS grant and a durable Core-authorized batch.
  - capability_id: com.corex.storage.datasets.preview_worker
    source: corex.storage.datasets
    reason: Framework STS must claim and report a Core-originated read-only preview through a typed binding.
  - capability_id: com.corex.storage.datasets.register
    source: corex.storage.datasets
    reason: Framework STS registration is typed and restricted to the active installation of its own plugin.
  - capability_id: com.corex.notifications.creation_receipts.read
    source: corex.notifications
    reason: Plugins need an explicit read-only service grant for owned creation receipt reconciliation.
  - capability_id: com.corex.customer.memberships.service_read
    source: corex.customer.memberships
    reason: Checkout requires exact live customer membership and primary contact verification under a service grant.
  - capability_id: com.corex.ai.catalog.models.read
    source: corex.ai.catalog
    reason: External plugins require an API Key grantable AI model catalog capability.
  - capability_id: com.corex.ai.catalog.providers.read
    source: corex.ai.catalog
    reason: External plugins require an API Key grantable AI provider catalog capability.
  - capability_id: com.corex.customer.accounts.admin_manage
    source: corex.customer.accounts
    reason: Customer account admin management is a required base platform capability for plugin delegated calls.
  - capability_id: com.corex.metadata.dictionary.read
    source: corex.metadata
    reason: Metadata dictionary read is required for plugin delegated metadata clients.
  - capability_id: com.corex.metadata.taxonomy.read
    source: corex.metadata
    reason: Metadata taxonomy read is required for plugin delegated metadata clients.
  - capability_id: com.corex.metadata.tag.read
    source: corex.metadata
    reason: Metadata tag read is required for plugin delegated metadata clients.
  - capability_id: com.corex.metadata.tag.manage
    source: corex.metadata
    reason: Metadata tag binding replacement is required for plugin delegated metadata clients.
  - capability_id: com.corex.metadata.resource_type.read
    source: corex.metadata
    reason: Metadata resource type resolution is required for plugin delegated metadata clients.
