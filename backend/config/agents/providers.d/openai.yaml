id: openai
name: OpenAI
aliases: ["OpenAI API", "openai.com"]

drivers:
  llm: openai
  vlm: openai
  embedding: openai
  image: openai
  audio_tts: openai
  audio_asr: openai
  video: openai
  rerank: openai

auth:
  scheme: bearer
  fields: ["api_key", "base_url"]
  defaults:
    base_url: "https://api.openai.com/v1"

modalities:
  llm:
    models:
      - id: gpt-6-luna
        label: "GPT-6 Luna"
        tags: ["text", "vision-capable"]
      - id: gpt-4o
        label: "GPT-4o"
        tags: ["omni","multimodal","flagship"]
        defaults:
          temperature: 0.7
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: gpt-4o-mini
        label: "GPT-4o mini"
        tags: ["fast","cheap"]
        defaults:
          temperature: 0.7
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: gpt-4.1-mini
        label: "GPT-4.1 mini"
        tags: ["json"]
        defaults:
          temperature: 0.3
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: o3
        label: "OpenAI o3"
        tags: ["reasoning","deep"]
        defaults:
          temperature: 0.2
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: o4-mini
        label: "OpenAI o4-mini"
        tags: ["reasoning","cost-effective"]
        defaults:
          temperature: 0.3
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: o4-mini-high
        label: "OpenAI o4-mini-high"
        tags: ["reasoning","high-effort","accuracy"]
        defaults:
          temperature: 0.2
          max_tokens: 1024
          api_path: "/v1/chat/completions"
      - id: gpt-3.5-turbo
        label: "GPT-3.5 Turbo"
        tags: ["fast","cheap"]
        defaults:
          temperature: 0.7
          max_tokens: 1024
          api_path: "/v1/chat/completions"

  # 单图是本项目本轮支持范围，并非供应商官方上限。
  vlm:
    models:
      - id: gpt-6-luna
        label: "GPT-6 Luna"
        defaults: { max_tokens: 2048, reasoning_effort: none }
        operations:
          vision_understanding:
            driver: openai
            input_types: [text, image_url, image_base64]
            max_images: 1
            max_videos: 0
            async: false
            parameters:
              max_tokens: { type: integer, minimum: 1, maximum: 128000, default: 2048 }
              reasoning_effort: { type: string, enum: [none, low, medium, high, xhigh, max], default: none }
              temperature: { type: number, minimum: 0, maximum: 2 }
              top_p: { type: number, minimum: 0, maximum: 1 }
              json_mode: { type: boolean, default: false }

  embedding:
    models:
      - id: text-embedding-3-small
        label: "TE-3-small"
        tags: ["cheap"]
        limits: { dims: 1536 }
      - id: text-embedding-3-large
        label: "TE-3-large"
        limits: { dims: 3072 }

  image:
    models:
      # 官方 Images API 合同，精确列举型号；不把未知的 gpt-* 推断为文本。
      # https://developers.openai.com/api/reference/resources/images/methods/generate
      - id: gpt-image-2
        label: "GPT-Image-2"
        tags: ["img-gen"]
        operations: &gpt_image_2_operations
          image_generation:
            driver: openai
            # 官方 Images Edits JSON 协议；Core 另行限制单图与请求总量。
            # https://developers.openai.com/api/reference/resources/images/methods/edit
            input_types: [text, image_url, image_base64]
            max_images: 16
            max_image_bytes: 5242880
            max_total_image_bytes: 20971520
            max_image_pixels: 36000000
            max_videos: 0
            parameters:
              size:
                type: string
                enum: [auto, 1024x1024, 1536x1024, 1024x1536]
                default: 1024x1024
              quality:
                type: string
                enum: [auto, low, medium, high]
                default: auto
              format:
                type: string
                enum: [png, jpeg, webp]
              n:
                type: integer
                minimum: 1
                maximum: 10
      - id: gpt-image-2-2026-04-21
        label: "GPT-Image-2 (2026-04-21)"
        tags: ["img-gen", "snapshot"]
        operations: *gpt_image_2_operations
      - id: chatgpt-image-latest
        label: "ChatGPT Image Latest"
        tags: ["img-gen"]
        operations: *gpt_image_2_operations
      - id: gpt-image-1
        operations:
          image_generation:
            driver: openai
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 1024x1024
                - 1536x1024
                - 1024x1536
                default: 1024x1024
              quality:
                type: string
                enum:
                - auto
                - low
                - medium
                - high
              format:
                type: string
                enum:
                - png
                - jpeg
                - webp
              n:
                type: integer
                minimum: 1
                maximum: 10
        label: "GPT-Image-1"
        tags: ["img-gen","inpainting","variation"]
      - id: gpt-image-1-mini
        operations:
          image_generation:
            driver: openai
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 1024x1024
                - 1536x1024
                - 1024x1536
                default: 1024x1024
              quality:
                type: string
                enum:
                - auto
                - low
                - medium
                - high
              format:
                type: string
                enum:
                - png
                - jpeg
                - webp
              n:
                type: integer
                minimum: 1
                maximum: 10
        label: "GPT-Image-1 mini"
        tags: ["img-gen","fast","cheap"]
      - id: gpt-image-1.5
        operations:
          image_generation:
            driver: openai
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 1024x1024
                - 1536x1024
                - 1024x1536
                default: 1024x1024
              quality:
                type: string
                enum:
                - auto
                - low
                - medium
                - high
              format:
                type: string
                enum:
                - png
                - jpeg
                - webp
              n:
                type: integer
                minimum: 1
                maximum: 10
        label: "GPT-Image-1.5"
        tags: ["img-gen","high-quality"]
      - id: dall-e-3
        operations:
          image_generation:
            driver: openai
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 1024x1024
                - 1792x1024
                - 1024x1792
                default: 1024x1024
              quality:
                type: string
                enum:
                - standard
                - hd
              n:
                type: integer
                minimum: 1
                maximum: 1
        label: "DALL·E 3"
        tags: ["img-gen","legacy"]
      - id: dall-e-2
        operations:
          image_generation:
            driver: openai
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 256x256
                - 512x512
                - 1024x1024
                default: 1024x1024
              quality:
                type: string
                enum:
                - standard
              n:
                type: integer
                minimum: 1
                maximum: 10
        label: "DALL·E 2"
        tags: ["img-gen","legacy"]

  audio_tts:
    models:
      - id: gpt-4o-mini-tts
        label: "GPT-4o mini TTS"
        tags: ["audio","tts","expressive"]
  audio_asr:
    models:
      - id: gpt-4o-transcribe
        label: "GPT-4o Transcribe"
        tags: ["audio","asr","multilingual"]
      - id: gpt-4o-mini-transcribe
        label: "GPT-4o mini Transcribe"
        tags: ["audio","asr","fast"]
      - id: whisper-1
        label: "Whisper v1 (legacy)"
        tags: ["audio","asr","legacy"]

  video:
    models:
      - id: sora
        label: "Sora"
        tags: ["video","gen","placeholder"]
      - id: sora-preview
        label: "Sora Preview"
        tags: ["video","gen","placeholder"]

  rerank:
    models: []
