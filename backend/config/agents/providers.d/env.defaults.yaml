envs:
  default:
    rollout_strategy: gray
    telemetry_labels:
      - "agent.provider.default"
  staging:
    rollout_strategy: canary
    tenant_whitelist:
      - tenantId: demo
        environment: staging
    telemetry_labels:
      - "agent.provider.staging"
  production:
    rollout_strategy: percentage
    rollout_percentage: 35
    telemetry_labels:
      - "agent.provider.production"
