              size: "1024x1024"
              force_single: true
          - id: "doubao-seedream-3-0-i2i-250628"
            label: "Seedream 3.0 图生图"
            tags: ["image", "volcengine", "seedream"]
            defaults:
              action: "CVSync2AsyncSubmitTask"
              action_poll: "CVSync2AsyncGetResult"
              version: "2022-08-31"
              service: "cv"
              size: "1024x1024"
              force_single: true
          - id: "jimeng_t2i_v40"
            label: "即梦-图片生成4.0"
            tags: ["image", "volcengine"]
            defaults:
              action: "CVSync2AsyncSubmitTask"
              action_poll: "CVSync2AsyncGetResult"
