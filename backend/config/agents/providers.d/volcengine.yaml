id: volcengine
name: Volcengine (ByteDance)
aliases: ["volcengine", "volc", "volcano", "bytedance"]

drivers:
  llm: volcengine
  image: volcengine
  video: volcengine

auth:
  scheme: mixed
  fields: ["base_url", "region"]
  defaults:
    base_url: "https://visual.volcengineapi.com"
  modes:
    - id: "aksk"
      label: "AccessKey / SecretKey"
      scheme: "aksk"
      fields: ["secret_id", "secret_key", "base_url", "region"]
      defaults:
        base_url: "https://visual.volcengineapi.com"
    - id: "api_key"
      label: "API Key (Seedance)"
      scheme: "bearer"
      fields: ["api_key", "base_url"]
      defaults:
        base_url: "https://operator.las.cn-beijing.volces.com"

modalities:
  audio_tts:
    models: []
  audio_asr:
    models: []

apps:
  jimeng:
    name: 即梦 AI
    modalities:
      image:
        models:
          - id: "doubao-seedream-3-0-t2i-250415"
            label: "Seedream 3.0 文生图"
            tags: ["image", "volcengine", "seedream"]
            defaults:
              action: "CVSync2AsyncSubmitTask"
              action_poll: "CVSync2AsyncGetResult"
              version: "2022-08-31"
              service: "cv"
              size: "1024x1024"
              force_single: true
          - id: "doubao-seedream-2-0-t2i-250428"
            label: "Seedream 2.0 文生图"
            tags: ["image", "volcengine", "seedream"]
            defaults:
