id: huggingface
name: Hugging Face Inference
aliases: ["Hugging Face", "HF", "api-inference", "huggingface.co"]

drivers:
  llm: huggingface
  embedding: huggingface
  image: huggingface
  audio_tts: huggingface
  audio_asr: huggingface
  video: huggingface
  rerank: huggingface

auth:
  scheme: bearer
  fields: ["api_key", "base_url"]
  defaults:
    base_url: "https://router.huggingface.co/v1"

modalities:
  llm:
    models:
      - id: Qwen/Qwen2.5-72B-Instruct
        label: "Qwen 2.5 72B Instruct"
        tags: ["open","zh+en","top-tier","long-context"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: Qwen/Qwen2.5-32B-Instruct
        label: "Qwen 2.5 32B Instruct"
        tags: ["open","zh+en","balanced","quality"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: Qwen/Qwen2.5-7B-Instruct
        label: "Qwen 2.5 7B Instruct"
        tags: ["open","zh+en","fast","cheap"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: Qwen/Qwen2.5-Coder-32B-Instruct
        label: "Qwen 2.5 Coder 32B Instruct"
        tags: ["open","code","quality"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: meta-llama/Llama-3.3-70B-Instruct
        label: "Llama 3.3 70B Instruct"
        tags: ["open","en","quality","ecosystem"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: meta-llama/Llama-3.1-8B-Instruct
        label: "Llama 3.1 8B Instruct"
        tags: ["open","en","balanced"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: deepseek-ai/DeepSeek-V3
        label: "DeepSeek V3"
        tags: ["open","moe","reasoning","code"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: google/gemma-2-9b-it
        label: "Gemma 2 9B Instruct"
        tags: ["open","en","compact"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: mistralai/Mistral-Nemo-Instruct-2407
        label: "Mistral Nemo Instruct 2407"
        tags: ["open","balanced","fast"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: microsoft/Phi-4
        label: "Phi-4"
        tags: ["open","compact","reasoning"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
  embedding:
    models:
      - id: BAAI/bge-m3
        label: "BGE M3 (multi-lingual)"
        tags: ["zh+en","mteb","general","long-context"]
      - id: BAAI/bge-large-zh-v1.5
        label: "BGE Large ZH v1.5"
        tags: ["zh","mteb","general"]
      - id: Alibaba-NLP/gte-Qwen2-7B-instruct
        label: "GTE Qwen2 7B Instruct"
        tags: ["zh+en","mteb","large","quality"]
      - id: Alibaba-NLP/gte-large-en-v1.5
        label: "GTE Large EN v1.5"
        tags: ["en","mteb","general"]
      - id: intfloat/multilingual-e5-large
        label: "E5 Multilingual Large"
        tags: ["zh+en","mteb","query-prefix"]
  image:
    models:
      - id: stabilityai/stable-diffusion-2
        label: "Stable Diffusion 2 (text-to-image)"
        tags: ["img-gen","open"]
  audio_tts:
    models:
      - id: coqui/XTTS-v2
        label: "Coqui XTTS v2 (TTS)"
        tags: ["tts","multilingual"]
  audio_asr:
    models:
      - id: openai/whisper-large-v3
        label: "Whisper Large v3 (ASR)"
        tags: ["asr","open"]
  video:
    models: []
  rerank:
    models:
      - id: cross-encoder/ms-marco-MiniLM-L-6-v2
        label: "MS MARCO MiniLM-L-6 (Cross-Encoder)"
        tags: ["rerank","open"]
