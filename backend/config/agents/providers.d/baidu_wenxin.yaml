id: baidu
name: Baidu Qianfan
aliases: ["Baidu", "百度", "文心一言", "ERNIE", "千帆", "qianfan", "wenxin"]

drivers:
  llm: baidu
  embedding: baidu
  image: baidu
  audio_tts: baidu
  audio_asr: baidu
  video: baidu
  rerank: baidu

auth:
  scheme: bearer
  fields: ["api_key", "base_url"]
  defaults:
    base_url: "https://qianfan.baidubce.com/v2"

modalities:
  llm:
    models:
      - id: ERNIE-Bot-4
        label: "ERNIE Bot 4"
        tags: ["multilingual","vision","balanced"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ERNIE-Speed-8K
        label: "ERNIE Speed 8K"
        tags: ["fast","cheap"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
        limits: { context_window: 8192 }
      - id: ERNIE-Speed-128K
        label: "ERNIE Speed 128K"
        tags: ["long-context","fast"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
        limits: { context_window: 128000 }
      - id: ERNIE-Bot
        label: "ERNIE Bot (base)"
        tags: ["general"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ERNIE-Lite-8K
        label: "ERNIE Lite 8K (Free)"
        tags: ["lite","free","cost-optimized"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
        limits: { context_window: 8192 }
      - id: ERNIE-Tiny-8K
        label: "ERNIE Tiny 8K"
        tags: ["lite","cheap","latency"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
        limits: { context_window: 8192 }
      - id: ernie-4.0-8k
        label: "ERNIE 4.0 8K"
        tags: ["flagship","multimodal","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ernie-4.0-128k
        label: "ERNIE 4.0 128K"
        tags: ["flagship","long-context","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ernie-3.5-8k
        label: "ERNIE 3.5 8K"
        tags: ["general","balanced","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ernie-speed-8k
        label: "ERNIE Speed 8K (v2)"
        tags: ["fast","cheap","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ernie-speed-128k
        label: "ERNIE Speed 128K (v2)"
        tags: ["fast","long-context","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
      - id: ernie-lite-8k
        label: "ERNIE Lite 8K (v2)"
        tags: ["free","lite","v2"]
        defaults: { temperature: 0.7, max_tokens: 1024 }
  embedding:
    models:
      - id: embedding-v1
        label: "Embedding-V1"
        tags: ["zh-optimized","general"]
        # 官方未公开统一维度，这里不写 dims，避免类型不符
  image:
    models: []
  audio_tts:
    models: []
  audio_asr:
    models: []
  video:
    models: []
  rerank:
    models: []
