id: qwen-intl
name: Qwen（官方国际）
aliases: ["qwen", "tongyi", "dashscope", "alibaba"]

drivers:
  llm: openai
  image: qwen
  audio_tts: qwen

auth:
  scheme: bearer
  fields: ["api_key", "base_url"]
  defaults:
    base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"

modalities:
  llm:
    models:
      - id: qwen-max-latest
        label: "Qwen Max Latest"
      - id: qwen-plus-latest
        label: "Qwen Plus Latest"
      - id: qwen-turbo-latest
        label: "Qwen Turbo Latest"
      - id: qwen-flash
        label: "Qwen Flash"
      - id: qwen-flash-latest
        label: "Qwen Flash Latest"
      - id: qwen-plus
        label: "Qwen Plus"
      - id: qwen-turbo
        label: "Qwen Turbo"
      - id: qwen-max
        label: "Qwen Max"
      - id: qwen-long
        label: "Qwen Long"

      - id: qwen3.5-plus
        label: "Qwen3.5 Plus"
