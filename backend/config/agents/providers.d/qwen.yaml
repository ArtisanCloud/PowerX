        label: "Qwen LLM (Any)"
  image:
    models:
      - id: qwen-vl-max-latest
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen VL Max Latest"
      - id: qwen-vl-plus-latest
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen VL Plus Latest"
      - id: qwen-vl-max
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen VL Max"
      - id: qwen-vl-plus
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen VL Plus"
      - id: qwen3-vl-plus
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen3 VL Plus"
      - id: qwen3-vl-flash
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen3 VL Flash"
      - id: qwen2.5-vl-72b-instruct
        operations:
          vision_understanding:
            driver: qwen
            input_types:
            - text
            - image_url
            - image_base64
            max_images: 1
            max_videos: 0
            parameters:
              temperature:
                type: number
                minimum: 0
                maximum: 2
              top_p:
                type: number
                minimum: 0.01
                maximum: 1
              max_tokens:
                type: integer
                minimum: 1
              json_mode:
                type: boolean
        capabilities: [text_generation, image_understanding]
        label: "Qwen 2.5 VL 72B Instruct"
      - id: "*"
        label: "Qwen VLM (Any)"
      - id: qwen-image-2.0-pro
        label: "qwen-image-2.0-pro"
        capabilities: [image_generation]
        operations:
          image_generation:
            driver: qwen
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 2048*2048
                - 2688*1536
                - 1536*2688
                - 2368*1728
                - 1728*2368
                default: 2048*2048
              n:
                type: integer
                minimum: 1
                maximum: 6
                default: 1
              seed:
                type: integer
                minimum: 0
                maximum: 2147483647
              negative_prompt:
                type: string
              prompt_extend:
                type: boolean
              watermark:
                type: boolean
      - id: qwen-image-2.0
        label: "qwen-image-2.0"
        capabilities: [image_generation]
        operations:
          image_generation:
            driver: qwen
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              size:
                type: string
                enum:
                - 2048*2048
                - 2688*1536
                - 1536*2688
                - 2368*1728
                - 1728*2368
                default: 2048*2048
              n:
                type: integer
                minimum: 1
                maximum: 6
                default: 1
              seed:
                type: integer
                minimum: 0
                maximum: 2147483647
              negative_prompt:
                type: string
              prompt_extend:
                type: boolean
              watermark:
                type: boolean
  audio_tts:
    models:
      - id: qwen-tts-latest
        label: "Qwen TTS Latest"
      - id: qwen-tts-1
        label: "Qwen TTS 1"
      - id: qwen3-tts-flash
        operations:
          speech_synthesis:
            driver: qwen
            input_types:
            - text
            max_images: 0
            max_videos: 0
            parameters:
              voice:
                type: string
                enum:
                - Cherry
                - Serena
                - Ethan
                - Chelsie
                default: Cherry
              language_type:
                type: string
                enum:
                - Auto
                - Chinese
                - English
                - Japanese
                - Korean
                - German
                - French
                - Russian
                - Portuguese
                - Spanish
                - Italian
                default: Auto
        label: "Qwen3 TTS Flash"
      - id: qwen3-tts-instruct-flash
        label: "Qwen3 TTS Instruct Flash"
      - id: qwen3-tts-vd
        label: "Qwen3 TTS VD"
      - id: qwen3-tts-vc
        label: "Qwen3 TTS VC"
      - id: "*"
        label: "Qwen TTS (Any)"
  audio_asr:
    models: []
