env: default
tenant_scope: global
metadata:
  description: "Baseline routing policy for shared tenants"
  owners: ["mx-ops", "finops"]
safe_mode:
  min_hit_rate: 0.92
  max_latency_ms: 900
  max_fallback_failure_rate: 0.05
approval:
  workflow: "ops-change-requests"
  required: 2
rules:
  - pattern: "general/*"
    candidates:
      - provider: "openai:gpt-4o"
        weight: 0.7
      - provider: "anthropic:claude-3.5-sonnet"
        weight: 0.3
    sla:
      latency_ms: 900
      cost_ceiling: 0.002
  - pattern: "vision/*"
    candidates:
      - provider: "openai:gpt-4o"
        weight: 0.5
      - provider: "moonshot:kiln-pro"
        weight: 0.5
    sla:
      latency_ms: 1200
      cost_ceiling: 0.004
fallback_chain:
  - provider: "anthropic:claude-3.5-sonnet"
  - provider: "moonshot:kiln-pro"
